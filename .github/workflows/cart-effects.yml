name: Luxury cart effects
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cart-effects.yml'
permissions:
  contents: write
jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix cart runtime and add premium interactions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          # The old cart renderer referenced a removed element (#luxProviderAll), causing a JS exception
          # that stopped luxRender/luxAdd and made the visible buttons appear dead.
          s=s.replace(";const providerAll=document.getElementById('luxProviderAll');", ";")
          s=s.replace(";providerAll.removeAttribute('onclick');providerAll.href='#';return}", ";return}")
          s=s.replace(";providerAll.onclick=luxProviderAll}", "}")
          # Keep exactly one checkout CTA.
          s=re.sub(r'<div class="lux-checkouts">.*?</div>', '<div class="lux-checkouts"><a class="lux-checkout-btn secondary" href="ciudadela/metodo-pago.html?from=cart">FINALIZAR COMPRA · TARJETA / PAYPAL</a></div>', s, count=1, flags=re.S)
          # Replace/add a stronger interaction layer for the principal buttons.
          css='''<style id="lux-working-button-effects">
          .btn-ali-champagne,.cart-link,.lux-close,.tab-btn,.atelier-item-btn,.pane-unmute-btn,.lux-control-actions button,.lux-checkout-btn{position:relative;overflow:hidden;cursor:pointer;transition:transform .22s cubic-bezier(.2,.9,.2,1),box-shadow .22s,border-color .22s,filter .22s!important;-webkit-tap-highlight-color:transparent}
          .btn-ali-champagne:hover,.cart-link:hover,.lux-close:hover,.tab-btn:hover,.atelier-item-btn:hover,.pane-unmute-btn:hover,.lux-control-actions button:hover,.lux-checkout-btn:hover{transform:translateY(-3px) scale(1.025);box-shadow:0 0 24px rgba(245,215,127,.32),0 14px 34px rgba(0,0,0,.55)!important;border-color:#fff1a8!important;filter:brightness(1.14)}
          .btn-ali-champagne:active,.cart-link:active,.lux-close:active,.tab-btn:active,.atelier-item-btn:active,.pane-unmute-btn:active,.lux-control-actions button:active,.lux-checkout-btn:active{transform:translateY(1px) scale(.94)!important;filter:brightness(1.3);box-shadow:0 0 42px rgba(245,215,127,.55)!important}
          .btn-ali-champagne:after,.cart-link:after,.lux-close:after,.tab-btn:after,.atelier-item-btn:after,.pane-unmute-btn:after,.lux-control-actions button:after,.lux-checkout-btn:after{content:"";position:absolute;inset:-80%;background:linear-gradient(110deg,transparent 42%,rgba(255,255,255,.8) 50%,transparent 58%);transform:translateX(-70%) rotate(8deg);pointer-events:none;transition:transform .55s ease}
          .btn-ali-champagne:hover:after,.cart-link:hover:after,.lux-close:hover:after,.tab-btn:hover:after,.atelier-item-btn:hover:after,.pane-unmute-btn:hover:after,.lux-control-actions button:hover:after,.lux-checkout-btn:hover:after{transform:translateX(70%) rotate(8deg)}
          .lux-checkouts .lux-checkout-btn{width:100%;min-height:56px;border-radius:15px!important}
          @media (prefers-reduced-motion:reduce){.btn-ali-champagne,.cart-link,.lux-close,.tab-btn,.atelier-item-btn,.pane-unmute-btn,.lux-control-actions button,.lux-checkout-btn{transition:none!important}}
          </style>'''
          s=re.sub(r'<style id="lux-working-button-effects">.*?</style>', '', s, flags=re.S)
          s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix cart JavaScript and button interactions'
          git push
