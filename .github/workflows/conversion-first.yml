name: Conversion First Store
on:
  push:
    paths:
      - '.github/workflows/conversion-first.yml'
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert homepage to product-discovery funnel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''<style id="conversion-first-css">
          .conversion-hero{position:relative;padding:24px 28px;background:linear-gradient(90deg,rgba(245,215,127,.12),rgba(0,0,0,.96) 45%,rgba(245,215,127,.08));border-bottom:1px solid rgba(245,215,127,.22);text-align:center}
          .conversion-hero strong{font:italic 26px 'Cormorant Garamond',serif;color:#fff5c0}.conversion-hero span{display:block;margin:5px 0 13px;font-size:9px;letter-spacing:.22em;color:#aaa;text-transform:uppercase}
          .conversion-cta,.product-discover-cta{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid #f5d77f;border-radius:999px;padding:13px 22px;background:linear-gradient(135deg,#6f5419,#f5d77f,#8c691c);color:#050505;font-weight:800;font-size:10px;letter-spacing:.14em;text-transform:uppercase;box-shadow:0 12px 36px rgba(245,215,127,.18);transition:transform .25s,box-shadow .25s,filter .25s}
          .conversion-cta:hover,.product-discover-cta:hover{transform:translateY(-3px) scale(1.025);box-shadow:0 18px 48px rgba(245,215,127,.3);filter:brightness(1.08)}
          #productos{padding:100px 32px;background:radial-gradient(circle at 50% 0,#16100a,#030305 60%);border-top:1px solid rgba(245,215,127,.18)}
          .products-head{max-width:1180px;margin:0 auto 35px;text-align:center}.products-head .eyebrow{display:block}.products-head h2{font:italic 300 clamp(42px,6vw,72px) 'Cormorant Garamond',serif;margin:12px 0}.products-head p{max-width:760px;margin:auto;color:#aaa;font:italic 18px/1.6 'Cormorant Garamond',serif}
          .conversion-grid{max-width:1180px;margin:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.conversion-card{position:relative;overflow:hidden;border:1px solid rgba(245,215,127,.18);background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.012));border-radius:14px;transition:.28s}.conversion-card:hover{transform:translateY(-6px);border-color:rgba(245,215,127,.58);box-shadow:0 24px 60px rgba(0,0,0,.65)}.conversion-card img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;transition:transform .45s}.conversion-card:hover img{transform:scale(1.05)}.conversion-info{padding:14px}.conversion-cat{font-size:7px;letter-spacing:.18em;color:#f5d77f;text-transform:uppercase}.conversion-name{font:italic 22px/1.05 'Cormorant Garamond',serif;margin:7px 0 12px;min-height:46px}.conversion-price{font:600 18px 'Cormorant Garamond',serif;color:#fff1a8;margin-bottom:13px}.product-discover-cta{padding:10px 15px;font-size:8px;width:100%}
          .conversion-note{max-width:760px;margin:38px auto 0;text-align:center;color:#777;font-size:10px;letter-spacing:.08em;line-height:1.7}
          .lux-drawer,.cart-link{display:none!important}
          @media(max-width:900px){.conversion-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:650px){#productos{padding:70px 18px}.conversion-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.conversion-name{font-size:19px}.conversion-hero strong{font-size:22px}}@media(max-width:430px){.conversion-grid{grid-template-columns:1fr}}
          </style>'''
          if 'conversion-first-css' not in s:
              s=s.replace('</head>',css+'</head>',1)
          hero='''<section class="conversion-hero"><strong>DESCUBRE LA PIEZA QUE TE HACE PARAR EL SCROLL</strong><span>Moda · estilo · lujo · selección digital</span><a class="conversion-cta" href="#productos">VER PRODUCTOS AHORA →</a></section>'''
          if 'conversion-hero' not in s:
              s=s.replace('<body>', '<body>'+hero,1)
          section='''<section id="productos"><div class="products-head"><span class="eyebrow">REMEMBER LUXURY · SHOPPING EDIT</span><h2>Compra empieza por descubrir.</h2><p>Una vitrina rápida, visual y directa. Entra a cada producto, revisa la pieza y continúa al canal de compra disponible.</p></div><div id="conversionGrid" class="conversion-grid"><div class="conversion-note">Cargando selección…</div></div><div class="conversion-note">Sin checkout en esta página. Primero descubrimiento, clic y conversión; la infraestructura de pago queda para la siguiente fase.</div></section><script id="conversion-first-js">(async()=>{const grid=document.getElementById('conversionGrid');try{const r=await fetch('Gaia/Data/products/todos_1450.json');const data=await r.json();const items=data.filter(x=>x&&((x.imagen_url||x.image)&&(x.nombre||x.title))).slice(0,24);grid.innerHTML=items.map(x=>{const id=encodeURIComponent(x.id||x.sku||x.nombre||x.title);const name=String(x.nombre||x.title||'Producto').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));const cat=String(x.categoria||x.category||'SELECCIÓN').replace(/[&<>]/g,'');const img=x.imagen_url||x.image;const price=x.precio??x.price;return '<article class="conversion-card"><a href="producto.html?id='+id+'"><img loading="lazy" src="'+img+'" alt="'+name+'"><div class="conversion-info"><div class="conversion-cat">'+cat+'</div><div class="conversion-name">'+name+'</div>'+(price!=null?'<div class="conversion-price">$'+Number(price).toFixed(2)+'</div>':'')+'<span class="product-discover-cta">VER PRODUCTO →</span></div></a></article>'}).join('')}catch(e){grid.innerHTML='<div class="conversion-note">La selección no pudo cargarse. Vuelve a intentarlo.</div>'}})();</script>'''
          if 'id="productos"' not in s:
              marker=re.search(r'<footer\b',s,re.I)
              if marker: s=s[:marker.start()]+section+s[marker.start():]
              else: s=s.replace('</body>',section+'</body>',1)
          guard='''<script id="conversion-first-guard">document.addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b)return;const t=(b.textContent||'').toLowerCase();if(t.includes('carrito')||t.includes('agregar')||t.includes('añadir')){e.preventDefault();const card=b.closest('.lux-item,.snake-card,.atelier-item-btn,.conversion-card');const n=card?.querySelector('.lux-name,.snake-name,.btn-title,.conversion-name')?.textContent?.trim();location.href='producto.html?q='+encodeURIComponent(n||'producto')}});</script>'''
          if 'conversion-first-guard' not in s:
              s=s.replace('</body>',guard+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'Remember Luxury Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Make homepage conversion-first and product-discovery focused' || exit 0
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/conversion-first.yml
          git commit -m 'Remove temporary conversion workflow'
          git push
