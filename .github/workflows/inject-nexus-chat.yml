name: Install AXEL chat in Nexus
on:
  push:
    paths:
      - 'ciudadela/nexus-chat.js'
      - '.github/workflows/inject-nexus-chat.yml'
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject script into Nexus
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ciudadela/nexus.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="nexus-chat.js"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s:
                  raise SystemExit('Nexus has no closing body tag')
              s=s.replace(marker, tag+'\n'+marker, 1)
              p.write_text(s,encoding='utf-8')
          else:
              print('Already installed')
          PY
      - name: Commit Nexus chat installation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ciudadela/nexus.html
          git diff --cached --quiet || git commit -m 'feat: enable AXEL chat inside Nexus'
          git push