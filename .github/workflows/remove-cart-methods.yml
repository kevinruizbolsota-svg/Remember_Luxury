name: Remove AliExpress and KRC cart buttons
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-cart-methods.yml'

jobs:
  remove-methods:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove AliExpress and KRC checkout buttons
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="lux-checkouts"><a id="luxProviderAll" class="lux-checkout-btn" href="#" target="_blank" rel="noopener noreferrer">① PROVEEDOR / ALIEXPRESS ↗</a><a class="lux-checkout-btn secondary" href="checkout-krc.html">② PUNTOS KRC</a><a class="lux-checkout-btn secondary" href="ciudadela/metodo-pago.html?from=cart">③ TARJETA / PAYPAL</a></div>'
          new = '<div class="lux-checkouts"><a class="lux-checkout-btn secondary" href="ciudadela/metodo-pago.html?from=cart">TARJETA / PAYPAL</a></div>'
          if old not in s:
              raise SystemExit('Expected cart checkout block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Simplify cart checkout to card and PayPal only'
          git push
