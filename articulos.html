<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORIONIX — Catálogo</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0d;--gold:#e8c86a;--gold2:#f5e0a0;--gold3:#b89a40;--txt:#f0e8d0;--pur:#6a3d9a;--card:#12121a;--bor:rgba(232,200,106,0.2)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:'Cormorant Garamond',serif;min-height:100vh}
canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
nav{position:sticky;top:0;z-index:100;background:rgba(11,11,13,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--bor);padding:14px 28px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Cinzel',serif;font-size:1.4rem;color:var(--gold);text-decoration:none;letter-spacing:3px}
.nav-links{display:flex;gap:22px}
.nav-links a{color:var(--txt);text-decoration:none;font-size:.9rem;letter-spacing:1px;transition:color .3s}
.nav-links a:hover{color:var(--gold)}
.cart-btn{position:relative;background:transparent;border:1px solid var(--gold);color:var(--gold);padding:8px 16px;border-radius:8px;cursor:pointer;font-family:'Cinzel',serif;font-size:.8rem;letter-spacing:2px}
.cart-btn:hover{background:rgba(232,200,106,.1)}
.cbadge{position:absolute;top:-8px;right:-8px;background:var(--pur);color:#fff;font-size:.7rem;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}
.wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:36px 20px 80px}
.bc{color:var(--gold3);font-size:.85rem;letter-spacing:2px;margin-bottom:26px}
.bc a{color:var(--gold);text-decoration:none}
h1{font-family:'Cinzel',serif;font-size:2.4rem;color:var(--gold);letter-spacing:5px;margin-bottom:8px;text-shadow:0 0 28px rgba(232,200,106,.4)}
.sub{color:var(--gold2);font-style:italic;letter-spacing:2px;margin-bottom:26px}
.stats{display:flex;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--bor);border-radius:10px;padding:13px 22px;text-align:center;min-width:90px}
.stat-n{font-family:'Cinzel',serif;font-size:1.8rem;color:var(--gold)}
.stat-l{font-size:.75rem;color:var(--gold3);letter-spacing:2px;text-transform:uppercase}
.filtros{display:flex;gap:10px;margin-bottom:26px;flex-wrap:wrap;align-items:center}
.fb{padding:9px 18px;background:transparent;border:1px solid var(--bor);color:var(--txt);border-radius:8px;cursor:pointer;font-family:'Cinzel',serif;font-size:.78rem;letter-spacing:1px;transition:all .3s}
.fb:hover,.fb.on{background:var(--gold);color:#0b0b0d;border-color:var(--gold);box-shadow:0 0 12px rgba(232,200,106,.3)}
.buscar{flex:1;min-width:180px;padding:9px 14px;background:var(--card);border:1px solid var(--bor);border-radius:8px;color:var(--txt);font-family:inherit;font-size:.95rem;outline:none}
.buscar:focus{border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--bor);border-radius:14px;overflow:hidden;transition:all .3s;cursor:pointer}
.card:hover{transform:translateY(-5px);border-color:var(--gold);box-shadow:0 10px 32px rgba(0,0,0,.6)}
.cimg{width:100%;height:200px;display:flex;align-items:center;justify-content:center;font-size:4rem;position:relative}
.cimg-moda{background:linear-gradient(135deg,rgba(232,200,106,.15),#1a1a22)}
.cimg-fashion{background:linear-gradient(135deg,rgba(156,39,176,.18),#1a1a22)}
.cimg-dinastia{background:linear-gradient(135deg,rgba(255,215,0,.14),#1a1a22)}
.cat-tag{position:absolute;top:10px;left:10px;background:var(--pur);color:#fff;font-size:.62rem;padding:3px 9px;border-radius:4px;font-family:'Cinzel',serif;letter-spacing:1px}
.cinfo{padding:18px}
.ccat{color:var(--gold3);font-size:.72rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
.cnombre{font-family:'Cinzel',serif;font-size:1rem;color:var(--gold);margin-bottom:7px;line-height:1.35}
.cdesc{font-size:.88rem;color:#a89f8d;margin-bottom:14px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cpio{display:flex;justify-content:space-between;align-items:center}
.cprecio{font-size:1.28rem;color:var(--gold2);font-weight:600}
.cadd{background:var(--gold);color:#0b0b0d;border:none;padding:9px 16px;border-radius:7px;font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:1px;cursor:pointer;transition:all .2s;font-weight:700}
.cadd:hover{box-shadow:0 0 14px rgba(232,200,106,.5);transform:scale(1.06)}
.vacio{text-align:center;padding:60px 20px;color:var(--gold3);font-family:'Cinzel',serif;letter-spacing:2px;grid-column:1/-1}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:150;display:none;backdrop-filter:blur(3px)}
.overlay.on{display:block}
.sidebar{position:fixed;top:0;right:-400px;width:370px;height:100vh;background:#0e0e12;border-left:1px solid var(--gold);z-index:200;padding:28px;transition:right .4s ease;display:flex;flex-direction:column}
.sidebar.open{right:0}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;border-bottom:1px solid var(--bor);padding-bottom:14px}
.sh h2{font-family:'Cinzel',serif;color:var(--gold);font-size:1.1rem;letter-spacing:2px}
.sc{background:transparent;border:none;color:var(--txt);font-size:1.8rem;cursor:pointer;line-height:1}
.citems{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.empty-cart{text-align:center;color:#a89f8d;margin-top:40px;font-style:italic}
.citem{display:flex;gap:12px;background:rgba(255,255,255,.03);padding:10px;border-radius:8px;border:1px solid var(--bor)}
.citem-img{width:56px;height:56px;background:#1a1a22;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0}
.citem-info{flex:1}
.citem-n{font-family:'Cinzel',serif;font-size:.8rem;color:var(--gold);margin-bottom:3px}
.citem-p{color:var(--gold2);font-size:.88rem}
.citem-ctrl{display:flex;align-items:center;gap:8px;margin-top:7px}
.citem-ctrl button{width:24px;height:24px;background:var(--card);border:1px solid var(--bor);color:var(--txt);border-radius:4px;cursor:pointer;font-size:.9rem}
.citem-ctrl span{font-size:.88rem;min-width:22px;text-align:center}
.brem{background:transparent;border:none;color:#f87171;font-size:.78rem;cursor:pointer;margin-left:auto;font-style:italic}
.sfooter{border-top:1px solid var(--bor);padding-top:18px;margin-top:16px}
.stotal{display:flex;justify-content:space-between;font-family:'Cinzel',serif;font-size:1.15rem;color:var(--gold);margin-bottom:18px}
.scheckout{width:100%;padding:14px;background:var(--gold);color:#0b0b0d;border:none;border-radius:8px;font-family:'Cinzel',serif;font-size:.88rem;letter-spacing:2px;cursor:pointer;font-weight:700;transition:all .2s}
.scheckout:hover{box-shadow:0 0 18px rgba(232,200,106,.4)}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(100px);background:rgba(14,14,18,.97);border:1px solid var(--gold);color:var(--gold);padding:12px 28px;border-radius:10px;font-family:'Cinzel',serif;font-size:.82rem;letter-spacing:2px;z-index:300;opacity:0;transition:all .35s ease;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@media(max-width:768px){.nav-links{display:none}.sidebar{width:100%;right:-100%}.grid{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="overlay" id="overlay"></div>

<nav>
  <a href="hub.html" class="logo">ORIONIX</a>
  <div class="nav-links">
    <a href="tienda.html">Tienda</a>
    <a href="agentes.html">Agentes</a>
    <a href="comunidad.html">Comunidad</a>
    <a href="hogar.html">Hogar</a>
  </div>
  <button class="cart-btn" id="cartBtn">CARRITO <span class="cbadge" id="badge">0</span></button>
</nav>

<div class="wrap">
  <div class="bc"><a href="hub.html">ORIONIX</a> &rsaquo; <a href="tienda.html">Tienda</a> &rsaquo; Catálogo</div>
  <h1>CATÁLOGO ORIONIX</h1>
  <p class="sub">De una aguja a una mansión — encuentra lo que necesitas en tu nivel</p>
  <div class="stats">
    <div class="stat"><div class="stat-n" id="cTotal">30</div><div class="stat-l">Artículos</div></div>
    <div class="stat"><div class="stat-n">10</div><div class="stat-l">Moda</div></div>
    <div class="stat"><div class="stat-n">10</div><div class="stat-l">Fashion</div></div>
    <div class="stat"><div class="stat-n">10</div><div class="stat-l">Dinastía</div></div>
  </div>
  <div class="filtros">
    <button class="fb on" data-cat="TODOS">TODOS</button>
    <button class="fb" data-cat="MODA">MODA</button>
    <button class="fb" data-cat="FASHION STYLE">FASHION STYLE</button>
    <button class="fb" data-cat="MI DINASTIA">MI DINASTÍA</button>
    <input type="text" class="buscar" id="buscar" placeholder="Buscar artículos...">
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="sidebar" id="sidebar">
  <div class="sh">
    <h2>TU CARRITO</h2>
    <button class="sc" id="closeCart">&times;</button>
  </div>
  <div class="citems" id="citems">
    <p class="empty-cart">Tu carrito está vacío</p>
  </div>
  <div class="sfooter">
    <div class="stotal"><span>Total:</span><span id="stotal">€0.00</span></div>
    <button class="scheckout" onclick="location.href='metodo-pago.html'">PROCEDER AL PAGO</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const PRODUCTOS = [
  {i:1,  n:"Camiseta Cosmos Basic",           p:9.99,   c:"MODA",         d:"Algodón 100%, logo bordado en gold. Corte clásico unisex.",              e:"👕"},
  {i:2,  n:"Gorra Snapback AXEL",             p:14.99,  c:"MODA",         d:"Ajustable, bordado 3D del ojo cósmico ORIONIX.",                          e:"🧢"},
  {i:3,  n:"Calcetines Premium Pack x3",      p:7.99,   c:"MODA",         d:"Microfibra transpirable, refuerzo dorado en tobillo.",                    e:"🧦"},
  {i:4,  n:"Libreta Kabalion A5",             p:12.99,  c:"MODA",         d:"Tapa dura negra, papel de 100g, cierre elástico dorado.",                 e:"📓"},
  {i:5,  n:"Llavero Metálico Sefirot",        p:8.99,   c:"MODA",         d:"Aleación zinc, grabado láser del árbol de la vida.",                      e:"🔑"},
  {i:6,  n:"Taza Térmica Nebula",             p:18.99,  c:"MODA",         d:"Acero inoxidable, doble pared, mantiene calor 6 horas.",                  e:"☕"},
  {i:7,  n:"Pañuelo Bolsillo Seda",           p:15.99,  c:"MODA",         d:"Estampado cosmos, perfecto para blazer y trajes.",                        e:"🎀"},
  {i:8,  n:"Bolígrafo Lujo Black Gold",       p:22.99,  c:"MODA",         d:"Cuerpo mate, detalles en oro de 18k, recarga incluida.",                  e:"🖋️"},
  {i:9,  n:"Parche Termoadhesivo ORIONIX",    p:5.99,   c:"MODA",         d:"Bordado de alta densidad, aplica con plancha en 30 seg.",                 e:"🛡️"},
  {i:10, n:"Mochila Canvas Minimalista",      p:29.99,  c:"MODA",         d:"Lona resistente al agua, compartimento laptop 15 pulgadas.",              e:"🎒"},
  {i:11, n:"Sudadera Imperio Gold",           p:49.99,  c:"FASHION STYLE",d:"Corte oversized, hilo dorado en costuras, forro interior.",               e:"👕"},
  {i:12, n:"Cartera Slim RFID Chesed",        p:39.99,  c:"FASHION STYLE",d:"Cuero genuino, protección antirrobo, 6 ranuras tarjeta.",                 e:"💳"},
  {i:13, n:"Gafas Sol Polarizadas Netzach",   p:59.99,  c:"FASHION STYLE",d:"Montura acetato negro, lentes UV400, estuche incluido.",                  e:"🕶️"},
  {i:14, n:"Mochila Urbana Binah",            p:79.99,  c:"FASHION STYLE",d:"Cuero sintético premium, múltiples compartimentos, antirrobo.",           e:"🎒"},
  {i:15, n:"Perfume Cosmos Noir 100ml",       p:89.99,  c:"FASHION STYLE",d:"Notas de ámbar, oud y madera de cedro. Larga duración.",                  e:"🧴"},
  {i:16, n:"Cinturón Cuero Reversible",       p:45.99,  c:"FASHION STYLE",d:"Negro y marrón reversible, hebilla mate con logo ORIONIX.",               e:"👔"},
  {i:17, n:"Zapatillas Cosmos Limited",       p:129.99, c:"FASHION STYLE",d:"Suela con glow ultravioleta, edición numerada 500 pares.",                e:"👟"},
  {i:18, n:"Chaqueta Bomber Negra",           p:99.99,  c:"FASHION STYLE",d:"Forro interior con mapa estelar, cierre YKK japonés.",                    e:"🧥"},
  {i:19, n:"Reloj Smartwatch Elite",          p:149.99, c:"FASHION STYLE",d:"Monitor cardíaco, GPS, correa de silicona negra premium.",                e:"⌚"},
  {i:20, n:"Set Regalo Caballero ORIONIX",    p:119.99, c:"FASHION STYLE",d:"Cartera, cinturón y llavero en caja de madera grabada.",                  e:"🎁"},
  {i:21, n:"Reloj Automático Kether",         p:299.99, c:"MI DINASTIA",  d:"Movimiento suizo ETA, caja acero inoxidable, cristal zafiro.",             e:"⌚"},
  {i:22, n:"Anillo Titanio Negro Oro",        p:149.99, c:"MI DINASTIA",  d:"Acero quirúrgico, baño de oro 18k, diseño geométrico.",                   e:"💍"},
  {i:23, n:"Bolso Cuero Italiano Malkuth",    p:350.00, c:"MI DINASTIA",  d:"Hecho a mano en Florencia, herrajes dorados, forro cosmos.",              e:"👜"},
  {i:24, n:"Chaqueta Cuero Sintético Elite",  p:189.99, c:"MI DINASTIA",  d:"Corte slim, costuras reforzadas a mano, estilo motociclista.",             e:"🧥"},
  {i:25, n:"Gemelos Traje Black Gold",        p:79.99,  c:"MI DINASTIA",  d:"Ónix negro y borde dorado 18k, caja de terciopelo negro.",                e:"👔"},
  {i:26, n:"Maletín Ejecutivo Cuero",         p:249.99, c:"MI DINASTIA",  d:"Cuero genuino, combinación seguridad, compartimento laptop 17.",          e:"💼"},
  {i:27, n:"Zapatos Oxford Premium",          p:159.99, c:"MI DINASTIA",  d:"Cuero pulido italiano, suela de goma antideslizante.",                    e:"👞"},
  {i:28, n:"Pulsera Cuero Trenzado",          p:89.99,  c:"MI DINASTIA",  d:"Cuero negro trenzado a mano, cierre magnético de acero.",                 e:"📿"},
  {i:29, n:"Caja Fuerte Portátil Lujo",       p:199.99, c:"MI DINASTIA",  d:"Para relojes y joyas, cerradura biométrica, fibra de carbono.",           e:"🔒"},
  {i:30, n:"Set Decantador Whisky Gold",      p:179.99, c:"MI DINASTIA",  d:"Cristal soplado a mano, base con grabado ORIONIX, 6 vasos.",              e:"🥃"}
];

const ESTILOS = {
  "MODA":         {cls:"cimg-moda",     lbl:"MODA"},
  "FASHION STYLE":{cls:"cimg-fashion",  lbl:"FASHION"},
  "MI DINASTIA":  {cls:"cimg-dinastia", lbl:"DINASTÍA"}
};

let filtroActual = "TODOS";
let busquedaActual = "";
let carrito = JSON.parse(localStorage.getItem("orionix_carrito") || "[]");

function renderGrid() {
  const grid = document.getElementById("grid");
  const q = busquedaActual.toLowerCase();
  const filtrados = PRODUCTOS.filter(p => {
    const matchCat = filtroActual === "TODOS" || p.c === filtroActual;
    const matchQ   = !q || p.n.toLowerCase().includes(q) || p.d.toLowerCase().includes(q);
    return matchCat && matchQ;
  });
  document.getElementById("cTotal").textContent = filtrados.length;
  if (!filtrados.length) {
    grid.innerHTML = '<div class="vacio">No se encontraron artículos</div>';
    return;
  }
  grid.innerHTML = filtrados.map(p => {
    const st = ESTILOS[p.c] || ESTILOS["MODA"];
    return `
    <div class="card">
      <div class="cimg ${st.cls}">
        <span style="font-size:3.8rem">${p.e}</span>
        <span class="cat-tag">${st.lbl}</span>
      </div>
      <div class="cinfo">
        <div class="ccat">${p.c}</div>
        <div class="cnombre">${p.n}</div>
        <div class="cdesc">${p.d}</div>
        <div class="cpio">
          <span class="cprecio">€${p.p.toFixed(2)}</span>
          <button class="cadd" onclick="addCart(${p.i})">+ AÑADIR</button>
        </div>
      </div>
    </div>`;
  }).join("");
}

function addCart(id) {
  const prod = PRODUCTOS.find(p => p.i === id);
  if (!prod) return;
  const exist = carrito.find(x => x.i === id);
  if (exist) { exist.q++; }
  else { carrito.push({i:prod.i, n:prod.n, p:prod.p, e:prod.e, q:1}); }
  saveCart();
  showToast("✓ " + prod.n + " añadido");
  renderCart();
}

function removeCart(id) {
  carrito = carrito.filter(x => x.i !== id);
  saveCart(); renderCart();
}

function changeQty(id, delta) {
  const item = carrito.find(x => x.i === id);
  if (!item) return;
  item.q += delta;
  if (item.q < 1) { removeCart(id); return; }
  saveCart(); renderCart();
}

function saveCart() {
  localStorage.setItem("orionix_carrito", JSON.stringify(carrito));
  document.getElementById("badge").textContent = carrito.reduce((s,x)=>s+x.q,0);
}

function renderCart() {
  const el = document.getElementById("citems");
  if (!carrito.length) {
    el.innerHTML = '<p class="empty-cart">Tu carrito está vacío</p>';
    document.getElementById("stotal").textContent = "€0.00";
    return;
  }
  el.innerHTML = carrito.map(x => `
    <div class="citem">
      <div class="citem-img">${x.e}</div>
      <div class="citem-info">
        <div class="citem-n">${x.n}</div>
        <div class="citem-p">€${(x.p * x.q).toFixed(2)}</div>
        <div class="citem-ctrl">
          <button onclick="changeQty(${x.i},-1)">−</button>
          <span>${x.q}</span>
          <button onclick="changeQty(${x.i},1)">+</button>
          <button class="brem" onclick="removeCart(${x.i})">quitar</button>
        </div>
      </div>
    </div>`).join("");
  const total = carrito.reduce((s,x)=>s+x.p*x.q,0);
  document.getElementById("stotal").textContent = "€" + total.toFixed(2);
}

function toggleCart() {
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("on");
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}

document.querySelectorAll(".fb").forEach(btn => {
  btn.addEventListener("click", function() {
    document.querySelectorAll(".fb").forEach(b=>b.classList.remove("on"));
    this.classList.add("on");
    filtroActual = this.dataset.cat;
    renderGrid();
  });
});

document.getElementById("buscar").addEventListener("input", function() {
  busquedaActual = this.value;
  renderGrid();
});

document.getElementById("cartBtn").addEventListener("click", toggleCart);
document.getElementById("closeCart").addEventListener("click", toggleCart);
document.getElementById("overlay").addEventListener("click", toggleCart);

(function() {
  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  let W, H, stars = [];
  function resize() { W=cv.width=window.innerWidth; H=cv.height=window.innerHeight; }
  function init() {
    stars = Array.from({length:160},()=>({
      x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*1.2+.2, a:Math.random(), da:(Math.random()-.5)*.005
    }));
  }
  function draw() {
    ctx.clearRect(0,0,W,H);
    stars.forEach(s=>{
      s.a+=s.da;
      if(s.a<=0||s.a>=1) s.da*=-1;
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(232,200,106,${s.a*0.7})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener("resize",()=>{resize();init();});
  resize(); init(); draw();
})();

// INIT
const params = new URLSearchParams(window.location.search);
const cat = params.get('cat');
if(cat) {
  const cDec = decodeURIComponent(cat).toUpperCase();
  if(cDec.includes('MODA')) { filtroActual = "MODA"; document.querySelector('[data-cat="MODA"]').classList.add('on'); document.querySelector('[data-cat="TODOS"]').classList.remove('on'); }
  else if(cDec.includes('FASHION')) { filtroActual = "FASHION STYLE"; document.querySelector('[data-cat="FASHION STYLE"]').classList.add('on'); document.querySelector('[data-cat="TODOS"]').classList.remove('on'); }
  else if(cDec.includes('DINAS')) { filtroActual = "MI DINASTIA"; document.querySelector('[data-cat="MI DINASTIA"]').classList.add('on'); document.querySelector('[data-cat="TODOS"]').classList.remove('on'); }
}
saveCart();
renderCart();
renderGrid();
</script>
</body>
</html>
