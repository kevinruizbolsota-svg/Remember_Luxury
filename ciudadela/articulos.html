<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>ORIONIX - Catalogo</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0d;--gold:#e8c86a;--gold2:#f5e0a0;--gold3:#b89a40;--txt:#f0e8d0;--pur:#6a3d9a;--card:rgba(14,13,20,0.96);--bor:rgba(232,200,106,0.18)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:'Cormorant Garamond',serif;min-height:100vh}
canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
nav{position:sticky;top:0;z-index:100;background:rgba(11,11,13,0.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--bor);padding:14px 28px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Cinzel',serif;font-size:1.3rem;color:var(--gold);text-decoration:none;letter-spacing:4px}
.nav-links{display:flex;gap:20px}
.nav-links a{color:var(--txt);text-decoration:none;font-size:0.85rem;letter-spacing:1px;opacity:.7;transition:.2s}
.nav-links a:hover{opacity:1;color:var(--gold)}
.cart-btn{position:relative;background:transparent;border:1px solid var(--gold);color:var(--gold);padding:8px 18px;border-radius:6px;cursor:pointer;font-family:'Cinzel',serif;font-size:0.75rem;letter-spacing:2px;transition:.2s}
.cart-btn:hover{background:rgba(232,200,106,.1)}
.badge{position:absolute;top:-8px;right:-8px;background:var(--pur);color:#fff;font-size:.65rem;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}
@media(max-width:680px){.nav-links{display:none}}
.wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:36px 20px 60px}
.bc{font-size:.8rem;color:var(--gold3);letter-spacing:2px;margin-bottom:28px}
.bc a{color:var(--gold);text-decoration:none}
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:28px}
.fb{padding:9px 18px;background:transparent;border:1px solid var(--bor);color:var(--txt);border-radius:6px;cursor:pointer;font-family:'Cinzel',serif;font-size:.75rem;letter-spacing:1.5px;transition:.25s;text-transform:uppercase}
.fb:hover,.fb.on{background:var(--gold);color:#0b0b0d;border-color:var(--gold)}
.buscador{flex:1;min-width:180px;padding:9px 14px;background:rgba(14,13,20,.9);border:1px solid var(--bor);border-radius:6px;color:var(--txt);font-family:'Cormorant Garamond',serif;font-size:.95rem;outline:none}
.buscador:focus{border-color:rgba(232,200,106,.5)}
.buscador::placeholder{color:rgba(240,232,208,.35)}
.conteo{font-size:.8rem;color:rgba(240,232,208,.5);letter-spacing:1px;margin-bottom:18px;font-style:italic}
.conteo span{color:var(--gold);font-family:'Cinzel',serif}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--bor);border-radius:10px;overflow:hidden;transition:.28s;display:flex;flex-direction:column}
.card:hover{border-color:rgba(232,200,106,.45);transform:translateY(-4px);box-shadow:0 10px 32px rgba(0,0,0,.5)}
.cimg{width:100%;height:210px;display:flex;align-items:center;justify-content:center;font-size:3.5rem;background:linear-gradient(135deg,rgba(106,61,154,.12),rgba(232,200,106,.06));position:relative;overflow:hidden}
.cbadge{position:absolute;top:8px;left:8px;font-family:'Cinzel',serif;font-size:.55rem;letter-spacing:1.5px;padding:4px 9px;border-radius:3px;font-weight:700;text-transform:uppercase}
.moda-b{background:rgba(232,200,106,.18);color:#e8c86a}
.fashion-b{background:rgba(156,39,176,.18);color:#ce93d8}
.dinastia-b{background:rgba(255,215,0,.12);color:#ffd700}
.cinfo{padding:16px;flex:1;display:flex;flex-direction:column}
.ccat{font-size:.65rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:5px;opacity:.6}
.cnombre{font-family:'Cinzel',serif;font-size:.9rem;color:var(--gold);margin-bottom:7px;line-height:1.3}
.cdesc{font-size:.82rem;color:rgba(240,232,208,.55);line-height:1.45;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-style:italic}
.cpie{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.cprecio{font-family:'Cinzel',serif;font-size:1.15rem;color:var(--gold2);font-weight:600}
.cadd{background:var(--gold);color:#0b0b0d;border:none;padding:8px 16px;border-radius:5px;font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:1.5px;cursor:pointer;transition:.2s;font-weight:700}

.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:rgba(240,232,208,.35)}

.sidebar{position:fixed;top:0;right:-420px;width:400px;height:100vh;background:#0d0d11;border-left:1px solid var(--gold);z-index:200;padding:28px;transition:.4s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.sidebar.open{right:0}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;border-bottom:1px solid var(--bor);padding-bottom:14px}
.sh h2{font-family:'Cinzel',serif;color:var(--gold);font-size:1.1rem;letter-spacing:3px}
.cerrar{background:transparent;border:none;color:var(--txt);font-size:1.6rem;cursor:pointer;line-height:1}
.citems{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.citems::-webkit-scrollbar{width:3px}
.citems::-webkit-scrollbar-thumb{background:rgba(232,200,106,.3)}
.citem{display:flex;gap:12px;background:rgba(255,255,255,.03);padding:10px;border-radius:8px;border:1px solid var(--bor)}
.citem-img{width:55px;height:55px;background:rgba(106,61,154,.15);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0}
.citem-info{flex:1;min-width:0}
.citem-n{font-family:'Cinzel',serif;font-size:.78rem;color:var(--gold);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citem-p{color:var(--gold2);font-size:.85rem;margin-bottom:6px}
.citem-ctrl{display:flex;align-items:center;gap:8px}
.citem-ctrl button{width:22px;height:22px;background:rgba(255,255,255,.06);border:1px solid var(--bor);color:var(--txt);border-radius:4px;cursor:pointer;font-size:.85rem}
.citem-ctrl span{font-size:.85rem;min-width:18px;text-align:center}
.brem{background:transparent;border:none;color:#f87171;font-size:.7rem;cursor:pointer;margin-left:auto}
.sfooter{border-top:1px solid var(--bor);padding-top:18px;margin-top:16px}
.stotal{display:flex;justify-content:space-between;font-family:'Cinzel',serif;font-size:1.15rem;color:var(--gold);margin-bottom:18px}
.scheckout{width:100%;padding:13px;background:var(--gold);color:#0b0b0d;border:none;border-radius:7px;font-family:'Cinzel',serif;font-size:.85rem;letter-spacing:2px;cursor:pointer;font-weight:700;transition:.2s}
.scheckout:hover{background:var(--gold2);box-shadow:0 0 20px rgba(232,200,106,.3)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:150;display:none;backdrop-filter:blur(2px)}
.overlay.on{display:block}
.toast{position:fixed;bottom:24px;right:24px;background:rgba(14,13,20,.97);border:1px solid var(--gold);color:var(--gold);padding:12px 22px;border-radius:8px;font-family:'Cinzel',serif;font-size:.78rem;letter-spacing:2px;z-index:300;transform:translateY(80px);opacity:0;transition:.3s}
.toast.on{transform:translateY(0);opacity:1}
@media(max-width:500px){.sidebar{width:100%;right:-100%}}
</style>
</head>

var ICONS = {shirts:"👕",hats:"🧢",socks:"🧦",notebook:"📓",key:"🔑 cup:"☕",cloth:"🎀",pen:"🖊",patch:"🛡",bag:"🎒",hoodie:"👕",wallet:"💳",glasses:"🕶",backpack:"🎒",perfume:"🧴",belt:"🟤",shoes:"👟",jacket:"🧥",watch:"⌚",gift:"🎁",luxury_watch:"⌚",ring:"💍",handbag:"👜",leather:"🧥",cufflinks:"👔",briefcase:"💼",oxford:"👞",bracelet:"📿",safe:"🔒",whisky:"🥃"};
var BADGECLS={"MODA":"moda-b","FASHION STYLE":"fashion-b","MI DINASTIA":"dinastia-b"};
var CATCOLOR={"MODA":"rgba(232,200,106,.12)","FASHION STYLE":"rgba(156,39,176,.12)","MI DINASTIA":"rgba(255,215,0,.08)"};
var filtro="TODOS",busqueda="",carrito=JSON.parse(localStorage.getItem("orxCart")||"[]");
function getLista(){var l=PRODS;if(filtro!=="TODOS")l=l.filter(function(p){return p.c===filtro;});if(busqueda.trim()!==""){var q=busqueda.toLowerCase();l=l.filter(function(p){return p.n.toLowerCase().indexOf(q)>=0||p.d.toLowerCase().indexOf(q)>=0;});}return l;}
function render(){var l=getLista(),g=document.getElementById("grid"),c=document.getElementById("conteo");c.innerHTML="Mstrando <span>"+l.length+"</span> producto"+(l.length!==1?"s":"")+(filtro!=="TODOS"?" en <span>"+filtro+"</span>":"");if(l.length===0){g.innerHTML='<div class="empty"><div class="ei">🌌</div><p>No se encontraron productos</p></div>';return;}var h="";for(var i=0;i<l.length;i++){var p=l[i],icon=ICO[[p.e]||"🛍",b=BADGECLS[p.c]||"moda-b",bg=CATCOLOR[p.c]||"";h+='<div class="card"><div class="cimg" style="background:linear-gradient(135deg,'+bg+',rgba(11,11,13,.5))"><span style="font-size:3.2rem">'+icon+'</span><span class="cbadge '+b+'">'+p.c+'</span></div><div class="cinfo"><div class="ccat">'+p.c+'</div><div class="cnombre">'+p.n+'</div><div class="cdesc">'+p.d+'</div><div class="cpie"><span class="cprecio">&euro;'+p.p.toFixed(2)+'</span><button class="cadd" onclick="addCart('+p.id+')">+ Anadir</button></div></div></div>';}g.innerHTML=h;}

(function(){var c=document.getElementById("cv"),ctx=c.getContext("2d");function rs{}addEventListener("resize",r);var st=[];for(var i=0;i<150;i++st.push({x:Math.random(),y:Math.random(),r:Math.random()*.9+.2,a:Math.random(),da:(Math.random()-.5)*.004});(function loop(){ctx.clearRect(0,0,c.width,c.height);for(var i=0;i<st.length;i++){var s=st[i];s.a=Math.max(.05,Math.min(.7,3.a+s.da));if(s.a<=.05||s.a>=.7)s.da*=-1;ctx.globalAlpha=s.a*.5;ctx.fillStyle="#e8c86a";ctx.beginPath();ctx.arc(s.x*c.width,s.y*(.height,s.r,0,6.28);ctx.fill();}requestAnimationFrame(loop);})();})();
(var params=new URLSearchParams(location.search),cat=params.get("cat");if(cat){cat=cat.replace(/\+/g," ").toUpperCase().trim();if(cat==="MODA"||cat==="FASHION STYLE"||cat==="MI DINASTIA"){filtro=cat;var btns=document.querySelectorAll(".fb");for(var i=0;i<btns.length;i++){var f=btns[i].getAttribute("data-f");btns[i].classList.toggle("on",f===cat);}}}render();updateCartUI();
