<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORIONIX · Catálogo</title>
<style>
  :root {
    --bg: #0b0b0d;
    --gold: #e8c86a;
    --gold-light: #f5e0a0;
    --gold-dark: #b89a40;
    --text: #f0e8d0;
    --purple: #6a3d9a;
    --card-bg: #13131a;
    --border: rgba(232,200,106,0.15);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Georgia', serif; min-height: 100vh; }

  /* NAV */
  nav {
    background: rgba(11,11,13,0.95);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
  }
  .nav-logo { font-family: 'Georgia', serif; font-size: 18px; color: var(--gold); letter-spacing: 3px; text-decoration: none; }
  .nav-links { display: flex; gap: 20px; align-items: center; }
  .nav-links a { color: var(--text); text-decoration: none; font-size: 13px; opacity: 0.7; transition: opacity 0.2s; }
  .nav-links a:hover { opacity: 1; color: var(--gold); }
  .cart-btn {
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    color: #0b0b0d;
    border: none;
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .cart-count {
    background: #0b0b0d;
    color: var(--gold);
    width: 20px; height: 20px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: bold;
  }

  /* HERO */
  .hero {
    text-align: center;
    padding: 48px 24px 32px;
    border-bottom: 1px solid var(--border);
  }
  .hero h1 { font-size: 32px; color: var(--gold); letter-spacing: 4px; margin-bottom: 8px; }
  .hero p { opacity: 0.6; font-size: 14px; }

  /* CONTROLES */
  .controls {
    padding: 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    max-width: 1400px;
    margin: 0 auto;
  }
  .search-bar {
    flex: 1;
    min-width: 220px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 10px 18px;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  .search-bar:focus { border-color: var(--gold); }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-btn {
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-btn:hover, .filter-btn.active {
    background: var(--gold);
    color: #0b0b0d;
    border-color: var(--gold);
    font-weight: bold;
  }
  .result-count { color: var(--gold); font-size: 13px; opacity: 0.8; white-space: nowrap; }

  /* GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
    padding: 24px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: transform 0.2s, border-color 0.2s;
    cursor: pointer;
  }
  .card:hover { transform: translateY(-4px); border-color: rgba(232,200,106,0.4); }
  .card-img { width: 100%; height: 200px; object-fit: cover; background: #1a1a2e; }
  .card-body { padding: 14px; }
  .card-cat {
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--gold-dark);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .card-name { font-size: 14px; color: var(--text); margin-bottom: 6px; line-height: 1.4; }
  .card-desc { font-size: 12px; opacity: 0.55; margin-bottom: 12px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-footer { display: flex; align-items: center; justify-content: space-between; }
  .card-price { font-size: 18px; color: var(--gold); font-weight: bold; }
  .add-btn {
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    color: #0b0b0d;
    border: none;
    padding: 7px 14px;
    border-radius: 16px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .add-btn:hover { opacity: 0.85; }

  /* PAGINACION */
  .pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    padding: 32px 24px;
  }
  .page-btn {
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text);
    width: 38px; height: 38px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .page-btn:hover, .page-btn.active {
    background: var(--gold);
    color: #0b0b0d;
    border-color: var(--gold);
    font-weight: bold;
  }
  .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* LOADER */
  .loader {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 80px;
    flex-direction: column;
    gap: 16px;
  }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader p { color: var(--gold); opacity: 0.7; font-size: 13px; letter-spacing: 2px; }

  /* CARRITO LATERAL */
  .cart-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    display: none;
  }
  .cart-overlay.open { display: block; }
  .cart-panel {
    position: fixed;
    right: 0; top: 0; bottom: 0;
    width: 360px;
    background: #0f0f15;
    border-left: 1px solid var(--border);
    z-index: 201;
    transform: translateX(100%);
    transition: transform 0.3s ease;
    display: flex;
    flex-direction: column;
  }
  .cart-panel.open { transform: translateX(0); }
  .cart-header {
    padding: 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .cart-header h3 { color: var(--gold); letter-spacing: 2px; }
  .close-cart { background: none; border: none; color: var(--text); font-size: 22px; cursor: pointer; opacity: 0.6; }
  .close-cart:hover { opacity: 1; }
  .cart-items { flex: 1; overflow-y: auto; padding: 16px; }
  .cart-item {
    display: flex;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    align-items: center;
  }
  .cart-item img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; }
  .cart-item-info { flex: 1; }
  .cart-item-name { font-size: 13px; margin-bottom: 4px; }
  .cart-item-price { color: var(--gold); font-size: 14px; font-weight: bold; }
  .remove-item { background: none; border: none; color: var(--text); opacity: 0.4; cursor: pointer; font-size: 18px; }
  .remove-item:hover { opacity: 1; color: #ff4444; }
  .cart-footer { padding: 20px; border-top: 1px solid var(--border); }
  .cart-total { display: flex; justify-content: space-between; margin-bottom: 16px; font-size: 16px; }
  .cart-total span:last-child { color: var(--gold); font-weight: bold; font-size: 20px; }
  .checkout-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    color: #0b0b0d;
    border: none;
    padding: 14px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    letter-spacing: 1px;
  }
  .empty-cart { text-align: center; padding: 40px; opacity: 0.5; }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--gold);
    color: #0b0b0d;
    padding: 12px 24px;
    border-radius: 24px;
    font-weight: bold;
    font-size: 13px;
    z-index: 999;
    transition: transform 0.3s ease;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 600px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; padding: 12px; }
    .cart-panel { width: 100%; }
    nav { padding: 0 12px; }
    .hero h1 { font-size: 22px; }
  }
</style>
</head>
<body>

<nav>
  <a href="hub.html" class="nav-logo">⬡ ORIONIX</a>
  <div class="nav-links">
    <a href="hub.html">Inicio</a>
    <a href="tienda.html">Tienda</a>
    <a href="agentes.html">Agentes</a>
    <button class="cart-btn" onclick="toggleCart()">
      🛒 Carrito
      <span class="cart-count" id="cartCount">0</span>
    </button>
  </div>
</nav>

<div class="hero">
  <h1>CATÁLOGO ORIONIX</h1>
  <p id="heroSub">Cargando colección...</p>
</div>

<div class="controls">
  <input type="text" class="search-bar" id="searchInput" placeholder="🔍 Buscar productos..." oninput="onSearch()">
  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('todos', this)">Todos</button>
    <button class="filter-btn" onclick="setFilter('MODA', this)">Moda</button>
    <button class="filter-btn" onclick="setFilter('FASHION STYLE', this)">Fashion Style</button>
    <button class="filter-btn" onclick="setFilter('MI DINASTIA', this)">Mi Dinastía</button>
  </div>
  <span class="result-count" id="resultCount"></span>
</div>

<div id="grid" class="grid"></div>
<div class="pagination" id="pagination"></div>

<!-- CARRITO -->
<div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
<div class="cart-panel" id="cartPanel">
  <div class="cart-header">
    <h3>CARRITO</h3>
    <button class="close-cart" onclick="toggleCart()">✕</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-footer">
    <div class="cart-total">
      <span>Total</span>
      <span id="cartTotal">€0.00</span>
    </div>
    <button class="checkout-btn" onclick="goCheckout()">FINALIZAR COMPRA →</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://lkevinruizl.app.n8n.cloud/webhook/orionix-tienda';
const PER_PAGE = 40;

let allProducts = [];
let filtered = [];
let currentFilter = 'todos';
let currentSearch = '';
let currentPage = 1;
let cart = JSON.parse(localStorage.getItem('orionix_cart') || '[]');

// CARGAR PRODUCTOS
async function loadProducts() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '<div class="loader"><div class="spinner"></div><p>CARGANDO CATÁLOGO...</p></div>';
  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accion: 'catalogo', limite: 500 })
    });
    const data = await res.json();
    // Acepta array directo o { productos: [...] }
    allProducts = Array.isArray(data) ? data : (data.productos || data.data || []);
    allProducts = allProducts.filter(p => p.activo !== false);
    document.getElementById('heroSub').textContent = allProducts.length + ' productos en colección';
    applyFilters();
  } catch(e) {
    grid.innerHTML = '<div class="loader"><p style="color:#ff4444">Error cargando catálogo. Reintentando...</p></div>';
    // Fallback: reintentar en 3s
    setTimeout(loadProducts, 3000);
  }
}

function applyFilters() {
  const q = currentSearch.toLowerCase();
  filtered = allProducts.filter(p => {
    const matchCat = currentFilter === 'todos' || p.categoria === currentFilter;
    const matchQ = !q || p.nombre.toLowerCase().includes(q) || (p.descripcion||'').toLowerCase().includes(q);
    return matchCat && matchQ;
  });
  currentPage = 1;
  renderPage();
}

function renderPage() {
  const start = (currentPage - 1) * PER_PAGE;
  const page = filtered.slice(start, start + PER_PAGE);
  const grid = document.getElementById('grid');

  document.getElementById('resultCount').textContent = filtered.length + ' productos';

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="loader"><p>Sin resultados para esta búsqueda.</p></div>';
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  grid.innerHTML = page.map(p => `
    <div class="card" onclick="void(0)">
      <img class="card-img" src="${p.imagen_url || 'https://picsum.photos/seed/'+p.id+'/400/400'}" alt="${p.nombre}" loading="lazy" onerror="this.src='https://picsum.photos/seed/product/400/400'">
      <div class="card-body">
        <div class="card-cat">${p.categoria || ''}</div>
        <div class="card-name">${p.nombre}</div>
        <div class="card-desc">${p.descripcion || ''}</div>
        <div class="card-footer">
          <span class="card-price">€${parseFloat(p.precio || 0).toFixed(2)}</span>
          <button class="add-btn" onclick="addToCart(${JSON.stringify(p).replace(/"/g, '&quot;')})">+ Añadir</button>
        </div>
      </div>
    </div>
  `).join('');

  renderPagination();
  window.scrollTo({ top: 200, behavior: 'smooth' });
}

function renderPagination() {
  const total = Math.ceil(filtered.length / PER_PAGE);
  if (total <= 1) { document.getElementById('pagination').innerHTML = ''; return; }

  let html = `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;
  const start = Math.max(1, currentPage - 2);
  const end = Math.min(total, currentPage + 2);
  if (start > 1) html += `<button class="page-btn" onclick="goPage(1)">1</button>${start>2?'<span style="padding:0 4px;opacity:.4">…</span>':''}`;
  for (let i = start; i <= end; i++) {
    html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
  }
  if (end < total) html += `${end<total-1?'<span style="padding:0 4px;opacity:.4">…</span>':''}<button class="page-btn" onclick="goPage(${total})">${total}</button>`;
  html += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===total?'disabled':''}>›</button>`;
  document.getElementById('pagination').innerHTML = html;
}

function goPage(p) {
  const total = Math.ceil(filtered.length / PER_PAGE);
  if (p < 1 || p > total) return;
  currentPage = p;
  renderPage();
}

function setFilter(cat, btn) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function onSearch() {
  currentSearch = document.getElementById('searchInput').value;
  applyFilters();
}

// CARRITO
function addToCart(p) {
  const existing = cart.find(c => c.id === p.id);
  if (existing) { existing.qty = (existing.qty || 1) + 1; }
  else { cart.push({ ...p, qty: 1 }); }
  saveCart();
  showToast('✓ ' + p.nombre + ' añadido');
}

function removeFromCart(id) {
  cart = cart.filter(c => c.id !== id);
  saveCart();
  renderCart();
}

function saveCart() {
  localStorage.setItem('orionix_cart', JSON.stringify(cart));
  updateCartCount();
  renderCart();
}

function updateCartCount() {
  const total = cart.reduce((s, c) => s + (c.qty || 1), 0);
  document.getElementById('cartCount').textContent = total;
}

function renderCart() {
  const el = document.getElementById('cartItems');
  if (!cart.length) {
    el.innerHTML = '<div class="empty-cart"><p style="font-size:40px">🛒</p><p>Tu carrito está vacío</p></div>';
    document.getElementById('cartTotal').textContent = '€0.00';
    return;
  }
  el.innerHTML = cart.map(c => `
    <div class="cart-item">
      <img src="${c.imagen_url || 'https://picsum.photos/seed/'+c.id+'/100/100'}" alt="${c.nombre}">
      <div class="cart-item-info">
        <div class="cart-item-name">${c.nombre}</div>
        <div class="cart-item-price">€${parseFloat(c.precio).toFixed(2)} × ${c.qty||1}</div>
      </div>
      <button class="remove-item" onclick="removeFromCart(${c.id})">🗑</button>
    </div>
  `).join('');
  const total = cart.reduce((s, c) => s + parseFloat(c.precio) * (c.qty||1), 0);
  document.getElementById('cartTotal').textContent = '€' + total.toFixed(2);
}

function toggleCart() {
  const panel = document.getElementById('cartPanel');
  const overlay = document.getElementById('cartOverlay');
  panel.classList.toggle('open');
  overlay.classList.toggle('open');
  renderCart();
}

function goCheckout() {
  localStorage.setItem('orionix_cart', JSON.stringify(cart));
  window.location.href = 'carrito.html';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// INIT
updateCartCount();
loadProducts();
</script>
</body>
</html>
