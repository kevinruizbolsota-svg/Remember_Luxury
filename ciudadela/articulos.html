<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>REMEMBER LUXURY · Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#c9a84c;--gold2:#e8c86a;--text:#f0ead8;--dim:rgba(240,234,216,.6);--bg:#050a18;--glass:rgba(8,14,30,.75);--gborder:rgba(201,168,76,.18)}
html,body{width:100%;min-height:100vh;overflow-x:hidden}
body{font-family:'Cormorant Garamond',serif;color:var(--text);background:var(--bg)}

/* BG */
.bg{position:fixed;inset:0;z-index:0;
  background:linear-gradient(180deg,rgba(5,10,24,.15) 0%,rgba(5,10,24,.55) 45%,rgba(5,10,24,.92) 100%),
  url('https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=2000&auto=format&fit=crop') center 30%/cover no-repeat fixed}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:900;display:flex;align-items:center;padding:0 32px;height:64px;
  background:rgba(5,10,24,.82);border-bottom:1px solid var(--gborder);backdrop-filter:blur(20px)}
.nav-left{display:flex;align-items:center;gap:28px;flex:1}
.hamburger{display:flex;flex-direction:column;gap:5px;cursor:pointer;padding:4px}
.hamburger span{display:block;width:22px;height:2px;background:var(--dim);transition:.2s}
.hamburger:hover span{background:var(--gold)}
.nav-links{display:flex;gap:6px}
.nl{font-family:'Cinzel',serif;font-size:.56rem;letter-spacing:.15em;color:var(--dim);text-decoration:none;padding:8px 14px;border-radius:6px;transition:.2s;text-transform:uppercase}
.nl:hover,.nl.on{color:var(--gold)}
.nl.on{border-bottom:1px solid var(--gold);border-radius:0}
.nav-center{position:absolute;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
.brand-crown{font-size:1.1rem;color:var(--gold);display:block;margin-bottom:2px}
.brand-name{font-family:'Cinzel',serif;font-size:.85rem;font-weight:900;letter-spacing:.3em;color:var(--gold);display:block}
.brand-line{display:flex;align-items:center;gap:6px;justify-content:center;margin-top:1px}
.brand-line span{display:block;height:1px;width:28px;background:var(--gold);opacity:.6}
.brand-line p{font-family:'Cinzel',serif;font-size:.42rem;letter-spacing:.35em;color:var(--gold);opacity:.8}
.nav-right{flex:1;display:flex;justify-content:flex-end;align-items:center;gap:16px}
.search-icon{color:var(--dim);cursor:pointer;font-size:1.1rem;transition:.2s}
.search-icon:hover{color:var(--gold)}
.cart-pill{display:flex;align-items:center;gap:6px;background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.25);padding:5px 14px;border-radius:20px;cursor:pointer;transition:.2s;text-decoration:none}
.cart-pill:hover{background:rgba(201,168,76,.22)}
.cart-pill span{font-family:'Cinzel',serif;font-size:.5rem;letter-spacing:.1em;color:var(--gold)}
.cart-count{background:var(--gold);color:#050a18;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:900;font-family:'Cinzel',serif}

/* HERO */
.hero{position:relative;z-index:1;padding:120px 60px 60px;max-width:600px}
.hero-tag{font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.3em;color:var(--gold);margin-bottom:14px;text-transform:uppercase}
.hero-title{font-family:'Cinzel',serif;font-size:clamp(2.8rem,6vw,5rem);font-weight:900;letter-spacing:.1em;color:#fff;line-height:1;margin-bottom:8px}
.hero-line{width:48px;height:2px;background:var(--gold);margin:16px 0 20px}
.hero-desc{font-size:1.05rem;color:var(--dim);line-height:1.6;max-width:380px;margin-bottom:32px}
.hero-btn{display:inline-flex;align-items:center;gap:10px;padding:12px 28px;border:1px solid var(--gold);color:var(--text);font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;cursor:pointer;background:transparent;transition:.25s}
.hero-btn:hover{background:rgba(201,168,76,.12)}

/* FILTER BAR */
.filter-bar{position:relative;z-index:1;padding:0 60px 28px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filter-label{font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.15em;color:var(--dim);text-transform:uppercase}
.filter-chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.12em;color:var(--gold);background:transparent;border:none;cursor:pointer;padding:4px 0;border-bottom:1px solid transparent;transition:.2s;text-transform:uppercase}
.chip.active{border-bottom-color:var(--gold)}
.chip:hover{color:var(--gold2)}
.chip-sep{color:var(--dim);font-size:.7rem;opacity:.4}
.search-bar{margin-left:auto;display:flex;align-items:center;gap:8px}
.search-input{background:rgba(8,14,30,.6);border:1px solid var(--gborder);padding:7px 16px;color:var(--text);font-family:'Cormorant Garamond',serif;font-size:.9rem;outline:none;border-radius:4px;width:220px;transition:.2s}
.search-input:focus{border-color:rgba(201,168,76,.4)}
.search-input::placeholder{opacity:.35}

/* GRID */
.wrap{position:relative;z-index:1;padding:0 60px 80px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.hero{padding:100px 24px 40px}.filter-bar,.wrap{padding-left:24px;padding-right:24px}.nav-links{display:none}}
@media(max-width:460px){.grid{grid-template-columns:1fr}}

/* CARD */
.card{position:relative;background:#0a0f1e;border-radius:8px;overflow:hidden;cursor:pointer;transition:transform .3s,box-shadow .3s}
.card:hover{transform:translateY(-6px);box-shadow:0 20px 50px rgba(0,0,0,.7),0 0 20px rgba(201,168,76,.1)}
.card-img{width:100%;height:240px;object-fit:cover;display:block;transition:transform .5s}
.card:hover .card-img{transform:scale(1.04)}
.card-body{padding:16px 18px 20px}
.card-cat{font-family:'Cinzel',serif;font-size:.5rem;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;margin-bottom:10px}
.card-name{font-size:1.15rem;font-weight:600;color:#fff;line-height:1.3;margin-bottom:10px}
.card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.card-price{font-family:'Cinzel',serif;font-size:1rem;color:var(--gold);font-weight:700}
.card-add{background:transparent;border:1px solid rgba(201,168,76,.35);color:var(--gold);padding:6px 14px;font-family:'Cinzel',serif;font-size:.5rem;letter-spacing:.1em;cursor:pointer;transition:.2s;text-transform:uppercase;border-radius:3px}
.card-add:hover{background:rgba(201,168,76,.15)}
.card-badge{position:absolute;top:12px;left:12px;background:var(--gold);color:#050a18;font-family:'Cinzel',serif;font-size:.45rem;letter-spacing:.1em;padding:3px 10px;border-radius:2px;text-transform:uppercase;font-weight:700}

/* EMPTY / LOADING */
.state{grid-column:1/-1;text-align:center;padding:80px 24px;color:var(--dim)}
.spinner{width:36px;height:36px;border:2px solid rgba(201,168,76,.2);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 20px}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOAST */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(100px);background:rgba(5,10,24,.96);border:1px solid rgba(201,168,76,.35);color:var(--gold);font-family:'Cinzel',serif;font-size:.56rem;letter-spacing:.12em;padding:12px 28px;border-radius:8px;z-index:9999;transition:transform .35s;max-width:90vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="bg"></div>

<nav>
  <div class="nav-left">
    <div class="hamburger"><span></span><span></span><span></span></div>
    <div class="nav-links">
      <a href="hub.html" class="nl">Inicio</a>
      <a href="articulos.html" class="nl on">Artículos</a>
      <a href="articulos.html" class="nl">Categorías</a>
      <a href="admin.html" class="nl">Admin</a>
    </div>
  </div>
  <div class="nav-center">
    <span class="brand-crown">♛</span>
    <span class="brand-name">REMEMBER</span>
    <div class="brand-line"><span></span><p>LUXURY</p><span></span></div>
  </div>
  <div class="nav-right">
    <span class="search-icon">🔍</span>
    <a href="carrito.html" class="cart-pill">
      <span>CARRITO</span>
      <div class="cart-count" id="cartCount">0</div>
    </a>
  </div>
</nav>

<section class="hero">
  <div class="hero-tag">Catálogo</div>
  <h1 class="hero-title" id="heroTitle">FASHION<br>STYLE</h1>
  <div class="hero-line"></div>
  <p class="hero-desc">Descubre lo último en moda masculina, tendencias y guías para elevar tu imagen al siguiente nivel.</p>
  <button class="hero-btn" onclick="filtrar('TODOS')">VER TODOS LOS ARTÍCULOS</button>
</section>

<div class="filter-bar">
  <span class="filter-label">Filtrando por:</span>
  <div class="filter-chips">
    <button class="chip active" data-cat="TODOS" onclick="filtrar('TODOS')">Todos</button>
    <span class="chip-sep">·</span>
    <button class="chip" data-cat="MODA" onclick="filtrar('MODA')">Moda</button>
    <span class="chip-sep">·</span>
    <button class="chip" data-cat="FASHION STYLE" onclick="filtrar('FASHION STYLE')">Fashion Style</button>
    <span class="chip-sep">·</span>
    <button class="chip" data-cat="MI DINASTIA" onclick="filtrar('MI DINASTIA')">Mi Dinastía</button>
  </div>
  <div class="search-bar">
    <input type="text" class="search-input" id="searchInput" placeholder="Buscar producto..." oninput="buscar(this.value)">
  </div>
</div>

<div class="wrap">
  <div class="grid" id="grid">
    <div class="state"><div class="spinner"></div>Cargando catálogo...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://lkevinruizl.app.n8n.cloud/webhook/orionix-tienda';
let todos = [], filtroActual = 'TODOS', busqueda = '';

// Imágenes de moda premium por categoría
const IMGS_MODA = [
  'https://images.unsplash.com/photo-1576566588028-4147f3842f27?q=80&w=800&auto=format&fit=crop',
  'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?q=80&w=800&auto=format&fit=crop',
  'https://images.unsplash.com/photo-1489987707025-afc232f7ea0f?q=80&w=800&auto=format&fit=crop',
  'https://images.unsplash.com/photo-1562157873-818bc0726f68?q=80&w=800&auto=format&fit=crop',
  'https://images.unsplash.com/photo-1591047139829-d91aecb6caea?q=80&w=800&auto=format&fit=crop',
];
const IMGS_FASHION = [
  'https://images.unsplash.com/photo-1617127365659-c47fa864d8bc?q=80&w=800&auto=format&fit=crop',
  'https://images.unsplash.com/photo-1495105787522-5334e3ffa0ef?q=80&w=800&auto=format&fit=crop',
  'https://images.unsplash.com/photo-1507679799987-c73779587ccf?q=80&w=800&auto=format&fit=crop',
  'https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?q=80&w=800&auto=format&fit=crop',
  'https://images.unsplash.com/photo-1488161628813-04466f872be2?q=80&w=800&auto=format&fit=crop',
];
const IMGS_DINASTIA = [
  'https://images.unsplash.com/photo-1523170335258-f5ed11844a49?q=80&w=800&auto=format&fit=crop',
  'https://images.unsplash.com/photo-1594938298603-c8148c4dae35?q=80&w=800&auto=format&fit=crop',
  'https://images.unsplash.com/photo-1548036328-c9fa89d128fa?q=80&w=800&auto=format&fit=crop',
  'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?q=80&w=800&auto=format&fit=crop',
  'https://images.unsplash.com/photo-1491553895911-0055eca6402d?q=80&w=800&auto=format&fit=crop',
];

function getImg(p, idx) {
  if (p.imagen_url && p.imagen_url.startsWith('http')) return p.imagen_url;
  const cat = (p.categoria || '').toUpperCase();
  if (cat.includes('DINASTIA')) return IMGS_DINASTIA[idx % IMGS_DINASTIA.length];
  if (cat.includes('FASHION')) return IMGS_FASHION[idx % IMGS_FASHION.length];
  return IMGS_MODA[idx % IMGS_MODA.length];
}

function getCart() { try { return JSON.parse(localStorage.getItem('orionix_cart')||'[]'); } catch(e){return[];} }
function saveCart(c) { localStorage.setItem('orionix_cart', JSON.stringify(c)); }
function updateCart() {
  const c = getCart();
  document.getElementById('cartCount').textContent = c.reduce((s,i)=>s+(i.cantidad||1),0);
}
function addCart(p) {
  const cart = getCart();
  const ex = cart.find(i=>i.id===p.id);
  if(ex) ex.cantidad=(ex.cantidad||1)+1; else cart.push({...p,cantidad:1});
  saveCart(cart); updateCart();
  toast('✦ Añadido al carrito');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'), 2500);
}

function filtrar(cat) {
  filtroActual = cat;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active', c.dataset.cat===cat));
  const titles = {'TODOS':'CATÁLOGO','MODA':'MODA','FASHION STYLE':'FASHION STYLE','MI DINASTIA':'MI DINASTÍA'};
  document.getElementById('heroTitle').innerHTML = (titles[cat]||cat).replace(' ','\n').replace('\n','<br>');
  render();
}

function buscar(q) { busqueda = q.toLowerCase(); render(); }

function render() {
  const grid = document.getElementById('grid');
  let arr = todos;
  if (filtroActual !== 'TODOS') arr = arr.filter(p=>(p.categoria||'').toUpperCase()===filtroActual.toUpperCase());
  if (busqueda) arr = arr.filter(p=>
    (p.nombre||'').toLowerCase().includes(busqueda)||
    (p.descripcion||'').toLowerCase().includes(busqueda)
  );
  if (!arr.length) {
    grid.innerHTML = '<div class="state">No hay productos en esta categoría.</div>';
    return;
  }
  grid.innerHTML = '';
  arr.forEach((p, i) => {
    const precio = parseFloat(p.precio||0).toFixed(2);
    const img = getImg(p, i);
    const cat = (p.categoria||'').toUpperCase();
    const esNuevo = i < 4;
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      ${esNuevo ? '<div class="card-badge">Nuevo</div>' : ''}
      <img class="card-img" src="${img}" alt="${p.nombre||''}" loading="lazy"
        onerror="this.src='https://images.unsplash.com/photo-1617127365659-c47fa864d8bc?q=80&w=800'">
      <div class="card-body">
        <div class="card-cat">${cat}</div>
        <div class="card-name">${p.nombre||'Producto'}</div>
        <div class="card-footer">
          <span class="card-price">€${precio}</span>
          <button class="card-add">+ Añadir</button>
        </div>
      </div>
    `;
    div.querySelector('.card-add').addEventListener('click', e=>{
      e.stopPropagation();
      addCart({id:p.id||p.nombre, nombre:p.nombre, precio, categoria:cat, imagen:img});
    });
    grid.appendChild(div);
  });
}

async function cargar() {
  try {
    const r = await fetch(API, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accion:'catalogo'})});
    const d = await r.json();
    todos = Array.isArray(d) ? d : (d.productos||d.data||[]);
    if (!todos.length) throw new Error('vacío');
  } catch(e) {
    // Fallback productos de ejemplo
    todos = [
      {id:1,nombre:'Camiseta Cosmos ORIONIX',precio:'9.99',categoria:'MODA',descripcion:'Algodón premium'},
      {id:2,nombre:'Gorra Lujo Urbano',precio:'14.99',categoria:'MODA',descripcion:'Streetwear premium'},
      {id:3,nombre:'Camiseta Básica Élite',precio:'19.90',categoria:'MODA',descripcion:'Corte entallado'},
      {id:4,nombre:'Sudadera Imperio',precio:'34.99',categoria:'MODA',descripcion:'Fleece suave'},
      {id:5,nombre:'Camisa Oxford Elegancia',precio:'49.99',categoria:'FASHION STYLE',descripcion:'Para ocasiones especiales'},
      {id:6,nombre:'Blazer Slim Moderno',precio:'89.99',categoria:'FASHION STYLE',descripcion:'Corte urbano'},
      {id:7,nombre:'Trousers Elite London',precio:'79.99',categoria:'FASHION STYLE',descripcion:'Pantalón de lujo'},
      {id:8,nombre:'Corbata Seda Imperial',precio:'59.99',categoria:'FASHION STYLE',descripcion:'100% seda italiana'},
      {id:9,nombre:'Reloj Maestro Dorado',precio:'299.99',categoria:'MI DINASTIA',descripcion:'Acero inoxidable'},
      {id:10,nombre:'Traje Ejecutivo Élite',precio:'499.99',categoria:'MI DINASTIA',descripcion:'Lana italiana'},
      {id:11,nombre:'Zapatos Oxford Piel',precio:'199.99',categoria:'MI DINASTIA',descripcion:'Piel genuina'},
      {id:12,nombre:'Maletín Ejecutivo',precio:'349.99',categoria:'MI DINASTIA',descripcion:'Cuero premium'},
    ];
  }
  render();
}

updateCart();
cargar();
</script>
</body>
</html>
