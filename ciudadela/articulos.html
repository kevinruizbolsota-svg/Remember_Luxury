<style>
:root{--bg:#0b0b0d;--gold:#e8c86a;--gold2:#f5e0a0;--gold3:#b89a40;--txt:#f0e8d0;--pur:#6a3d9a;--card:#12121a;--bor:rgba(232,200,106,0.2)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:'Cormorant Garamond',serif;min-height:100vh}
canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
nav{position:sticky;top:0;z-index:100;background:rgba(11,11,13,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--bor);padding:14px 28px;display:flex;justify-content:space-between;aolign-items:center}
.logo{font-family:'Cinzel',serif;font-size:1.4rem;color:var(--gold);text-decoration:none;letter-spacing:3px}
.nav-links{display:flex;gap:22px}
.nav-links a{color:var(--txt);text-decoration:none;font-size:.9rem;letter-spacing:1px;transition:color .3s}
.nav-links a:hover{color:var(--gold)}
.cart-btn{position:relative;background:transparent;border:1px solid var(--gold);color:var(--gold);padding:8px 16px;border-radius:8px;cursor:pointer;font-family:'Cinzel',serif;font-size:.8rem;letter-spacing:2px}
.cbadge{position:absolute;top:-8px;right:-8px;background:var(--pur);color:#fff;font-size:.7rem;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}
.wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:36px 20px 60px}
.bc{color:var(--gold3);font-size:.85rem;letter-spacing:2px;margin-bottom:26px}
.bc a{color:var(--gold);text-decoration:none}
h1[data-title]{font-family:'Cinzel',serif;font-size:2.4rem;color:var(--gold);letter-spacing:5px;margin-bottom:8px;text-shadow:0 0 28px rgba(232,200,106,.4)}
.sub{color:var(--gold2);font-style:italic;letter-spacing:2px;margin-bottom:26px}
.stats{display:flex;gap:20px;margin-bottom:26px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--bor);border-radius:10px;padding:13px 22px;text-align:center}
.stat-n{font-family:'Cinzel',serif;font-size:1.8rem;color:var(--gold)}
.stat-l{font-size:.75rem;color:var(--gold3);letter-spacing:2px;text-transform:uppercase}
.filtros{display:flex;gap:12px;margin-bottom:26px;flex-wrap:wrap;align-items:center}
.fb{padding:9px 18px;background:transparent;border:1px solid var(--bor);color:var(--txt);border-radius:8px;cursor:pointer;font-family:'Cinzel',serif;font-size:.78rem;letter-spacing:1px;transition:all .3s}
.fb:hover,.fb.on{background:var(--gold);color:#0b0b0d;border-color:var(--gold);box-shadow:0 0 12px rgba(232,200,106,.3)}
.buscar{flex:1;min-width:180px;padding:9px 14px;background:var(--card);border:1px solid var(--bor);border-radius:8px;color:var(--txt);font-family:inherit;font-size:.95rem;outline:none}
.buscar:focus{border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--bor);border-radius:12px;overflow:hidden;transition:all .3q}
.card:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 8px 28px rgba(0,0,0,.5)}
.cimg{width:100%;height:200px;display:flex;align-items:center;justify-content:center;font-size:3.8rem;position:relative}
.cimg-moda{background:linear-gradient(135deg,rgba(232,200,106,.15),#1a1a22)}
.cimg-fashion{\ackground:linear-gradient(135deg,rgba(156,39,176,.18),#1a1a22)}
.cimg-dinastia{background:linear-gradient(135deg,rgba(255,215,0,.12),#1a1a22)}
.cbadge2{position:absolute;top:8px;left:8px;background:var(--pur);color:#fff;font-size:.62rem;padding:3px 8px;border-radius:4px;font-family:'Cinzel',serif;letter-spacing:1px}
.cinfo{padding:18px}
.ccat{color:var(--gold3);font-size:.72rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
.cnombre{font-family:'Cinzel',serif;font-size:1rem;color:var(--gold);margin-bottom:7px;line-height:1.3}
.cdesc{font-size:.88rem;color:#a89f8d;margin-bottom:14px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cpio{display:flex;justify-content:space-between;align-items:center}
.cprecio{font-size:1.25rem;color:var(--gold2);font-weight:600}
.cadd{background:var(--gold);color:#0b0b0d;border:none;padding:8px 14px;border-radius:6px;font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:1px;cursor:pointer;transition:all .2s}
.cadd:hover{box-shadow:0 0 12px rgba(232,200,106,.4);transform:scale(1.05)}
.sidebar{position:fixed;top:0;right:-400px;width:370px;height:100vh;background:#0e0e12;border-left:1px solid var(--gold);z-index:200;padding:28px;transition:right .4s ease;display:flex;flex-direction:column}
.sidebar.open{right:0}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;border-bottom:1px solid var(--bor);padding-bottom:14px}
.sh h2{font-family:'Cinzel',serif;color:var(--gold);font-size:1.1rem;letter-spacing:2px}
.sc{background:transparent;border:none;color:var(--txt);font-size:1.6rem;cursor:pointer}
.citems{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.citem{display:flex;gap:12px;background:rgba(255,255,255,.03);padding:10px;border-radius:8px;border:1px solid var(--bor)}
.citem-img{width:56px;height:56px;background:#1a1a22;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0}
.citem-info{flex:1}
.citem-n{font-family:'Cinzel',serif;font-size:.82rem;color:var(--gold);margin-bottom:3px}
.citem-p{color:var(--gold2);font-size:.88rem}
.citem-ctrl{display:flex;align-items:center;gap:8px;margin-top:7px}
.citem-ctrl button{width:22px;height:22px;background:var(--card);border:1px solid var(--bor);color:var(--txt);border-radius:4px;cursor:pointer}
.citem-ctrl span{font-size:.88rem;min-width:18px;text-align:center}
.brem{background:transparent;border:none;color:#f87171;font-size:.72rem;cursor:pointer;margin-left:auto}
.sfooter{border-top:1px solid var(--bor);padding-top:18px;margin-top:16px}
.stotal{display:flex;justify-content:space-between;font-family:'Cinzel',serif;font-size:1.1rem;color:var(--gold);margin-bottom:18px}
.scheckout{width:100%;padding:13px;background:var(--gold);color:#0b0b0d;border:none;border-radius:8px;font-family:'Cinzel',serif;font-size:.88rem;letter-spacing:2px;cursor:pointer;font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:150;display:none;backdrop-filter:blur(3px)}
.overlay.on{-display:block}
.toast{position:fixed;bottom:28px;right:28px;background:rgba(20,20,26,.97);border:1px solid var(--gold);color:var(--gold);padding:12px 22px;border-radius:10px;font-family:'Cinzel',serif;font-size:.82rem;letter-spacing:2px;z-index:300;transform:translateY(100px);opacity:0;transition:all .3s ease}
.toast.show{transform:translateY(0);opacity:1}
@media(max-width:768px){.nav-links{=isplay:none}.sidebar{width:100%;right:-100%}.grid{grid-template-columns:1fr}}
