<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORIONIX · Catálogo</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0d;--gold:#e8c86a;--gd:#b89a40;--gl:#f5e0a0;--text:#f0e8d0;--dim:rgba(240,232,208,0.5);--b:rgba(232,200,106,0.14);--card:#0f0f14;}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Cormorant Garamond',serif;min-height:100vh}
/* NAV */
nav{background:rgba(11,11,13,.97);border-bottom:1px solid var(--b);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:58px;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
.nav-logo{font-family:'Cinzel',serif;font-size:1rem;color:var(--gold);letter-spacing:.25em;text-decoration:none;text-shadow:0 0 14px rgba(232,200,106,.3)}
.nav-links{display:flex;gap:20px;align-items:center}
.nav-links a{color:var(--dim);text-decoration:none;font-size:.8rem;letter-spacing:.08em;transition:color .2s}
.nav-links a:hover{color:var(--gold)}
.cart-btn{background:linear-gradient(135deg,var(--gold),var(--gd));color:#0b0b0d;border:none;padding:8px 18px;border-radius:20px;font-family:'Cinzel',serif;font-size:.7rem;font-weight:700;letter-spacing:.1em;cursor:pointer;display:flex;align-items:center;gap:8px}
.cart-count{background:#0b0b0d;color:var(--gold);width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700}
/* HERO */
.hero{text-align:center;padding:48px 24px 28px;border-bottom:1px solid var(--b)}
.hero h1{font-family:'Cinzel',serif;font-size:2rem;color:var(--gold);letter-spacing:.3em;margin-bottom:8px;text-shadow:0 0 30px rgba(232,200,106,.2)}
.hero p{color:var(--dim);font-size:.9rem;font-style:italic;letter-spacing:.05em}
/* CONTROLES */
.controls{padding:20px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--b);max-width:1400px;margin:0 auto}
.search-bar{flex:1;min-width:200px;background:var(--card);border:1px solid var(--b);border-radius:24px;padding:10px 18px;color:var(--text);font-family:'Cormorant Garamond',serif;font-size:.95rem;outline:none;transition:border .2s}
.search-bar:focus{border-color:rgba(232,200,106,.4)}
.search-bar::placeholder{color:var(--dim)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fb{padding:7px 14px;border-radius:20px;border:1px solid var(--b);background:transparent;color:var(--dim);font-family:'Cinzel',serif;font-size:.55rem;letter-spacing:.1em;cursor:pointer;transition:all .2s;white-space:nowrap}
.fb:hover,.fb.on{background:var(--gold);color:#0b0b0d;border-color:var(--gold);font-weight:700}
.result-count{color:var(--dim);font-size:.8rem;white-space:nowrap}
/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;padding:24px;max-width:1400px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--b);border-radius:12px;overflow:hidden;transition:transform .2s,border-color .2s;cursor:pointer}
.card:hover{transform:translateY(-4px);border-color:rgba(232,200,106,.35)}
.card-img{width:100%;height:190px;object-fit:cover;background:#1a1a2e}
.card-body{padding:14px}
.card-cat{font-family:'Cinzel',serif;font-size:.45rem;letter-spacing:.2em;color:var(--gd);text-transform:uppercase;margin-bottom:6px}
.card-name{font-size:.95rem;color:var(--text);margin-bottom:5px;line-height:1.35}
.card-desc{font-size:.78rem;color:var(--dim);margin-bottom:12px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-footer{display:flex;align-items:center;justify-content:space-between}
.card-price{font-size:1.2rem;color:var(--gold);font-weight:600}
.add-btn{background:linear-gradient(135deg,var(--gold),var(--gd));color:#0b0b0d;border:none;padding:7px 13px;border-radius:14px;font-family:'Cinzel',serif;font-size:.55rem;font-weight:700;letter-spacing:.08em;cursor:pointer;transition:opacity .2s}
.add-btn:hover{opacity:.85}
/* PAGINACION */
.pagination{display:flex;justify-content:center;align-items:center;gap:6px;padding:30px 24px}
.pg{background:var(--card);border:1px solid var(--b);color:var(--text);width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center;transition:all .2s}
.pg:hover,.pg.on{background:var(--gold);color:#0b0b0d;border-color:var(--gold);font-weight:700}
.pg:disabled{opacity:.3;cursor:default}
/* LOADER */
.loader{display:flex;justify-content:center;align-items:center;padding:80px;flex-direction:column;gap:16px}
.spinner{width:40px;height:40px;border:3px solid var(--b);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader p{color:var(--gold);opacity:.7;font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.15em}
.error-msg{color:#ff6b6b;font-family:'Cinzel',serif;font-size:.8rem;letter-spacing:.1em;text-align:center;padding:60px 24px}
/* CARRITO */
.cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:none}
.cart-overlay.open{display:block}
.cart-panel{position:fixed;right:0;top:0;bottom:0;width:360px;background:#0c0c11;border-left:1px solid var(--b);z-index:201;transform:translateX(100%);transition:transform .3s ease;display:flex;flex-direction:column}
.cart-panel.open{transform:translateX(0)}
.cart-header{padding:20px;border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between}
.cart-header h3{font-family:'Cinzel',serif;color:var(--gold);letter-spacing:.15em;font-size:.9rem}
.close-cart{background:none;border:none;color:var(--dim);font-size:22px;cursor:pointer;line-height:1}
.close-cart:hover{color:var(--text)}
.cart-items{flex:1;overflow-y:auto;padding:16px}
.cart-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--b);align-items:center}
.cart-item img{width:54px;height:54px;object-fit:cover;border-radius:8px}
.ci-info{flex:1}
.ci-name{font-size:.85rem;margin-bottom:4px;line-height:1.3}
.ci-price{color:var(--gold);font-size:.95rem;font-weight:600}
.remove-item{background:none;border:none;color:var(--dim);opacity:.5;cursor:pointer;font-size:18px;padding:4px}
.remove-item:hover{opacity:1;color:#ff4444}
.cart-footer{padding:20px;border-top:1px solid var(--b)}
.cart-total{display:flex;justify-content:space-between;margin-bottom:16px;font-size:1rem}
.cart-total span:last-child{color:var(--gold);font-weight:700;font-size:1.3rem}
.checkout-btn{width:100%;background:linear-gradient(135deg,var(--gold),var(--gd));color:#0b0b0d;border:none;padding:14px;border-radius:10px;font-family:'Cinzel',serif;font-size:.8rem;font-weight:700;letter-spacing:.15em;cursor:pointer}
.checkout-btn:hover{opacity:.9}
.empty-cart{text-align:center;padding:40px;color:var(--dim);font-style:italic}
/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(14,13,20,.98);border:1px solid var(--b);border-radius:8px;padding:10px 20px;font-size:.82rem;color:var(--text);z-index:9999;opacity:0;transition:all .28s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:600px){.nav-links{display:none}.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}.cart-panel{width:100%}}
</style>
</head>
<body>
<nav>
  <a href="hub.html" class="nav-logo">ORIONIX</a>
  <div class="nav-links">
    <a href="hub.html">Hub</a>
    <a href="tienda.html">Tienda</a>
    <a href="agentes.html">Agentes</a>
    <a href="carrito.html">Carrito</a>
  </div>
  <button class="cart-btn" onclick="toggleCart()">
    🛒 Carrito <span class="cart-count" id="cartCount">0</span>
  </button>
</nav>

<div class="hero">
  <h1>CATÁLOGO</h1>
  <p id="heroSub">Cargando colección...</p>
</div>

<div class="controls">
  <input class="search-bar" id="searchInput" type="text" placeholder="Buscar producto...">
  <div class="filters" id="filters">
    <button class="fb on" data-cat="TODOS">TODOS</button>
    <button class="fb" data-cat="MODA">MODA</button>
    <button class="fb" data-cat="FASHION STYLE">FASHION</button>
    <button class="fb" data-cat="MI DINASTIA">MI DINASTÍA</button>
    <button class="fb" data-cat="DIGITAL">DIGITAL</button>
    <button class="fb" data-cat="HOGAR">HOGAR</button>
    <button class="fb" data-cat="TECH">TECH</button>
    <button class="fb" data-cat="BIENESTAR">BIENESTAR</button>
    <button class="fb" data-cat="VIAJE">VIAJE</button>
    <button class="fb" data-cat="MASCOTAS">MASCOTAS</button>
  </div>
  <span class="result-count" id="resultCount"></span>
</div>

<div id="grid" class="grid">
  <div class="loader"><div class="spinner"></div><p>CARGANDO CATÁLOGO...</p></div>
</div>
<div id="pagination" class="pagination"></div>

<!-- CARRITO -->
<div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
<div class="cart-panel" id="cartPanel">
  <div class="cart-header">
    <h3>TU CARRITO</h3>
    <button class="close-cart" onclick="toggleCart()">✕</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-footer">
    <div class="cart-total"><span>Total</span><span id="cartTotal">€0.00</span></div>
    <button class="checkout-btn" onclick="location.href='carrito.html'">PROCEDER AL PAGO →</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://lkevinruizl.app.n8n.cloud/webhook/orionix-tienda';
const PER_PAGE = 36;
let allProducts = [];
let filtered = [];
let currentCat = 'TODOS';
let currentSearch = '';
let currentPage = 1;
let cart = [];
try { cart = JSON.parse(localStorage.getItem('orionix_cart') || '[]'); } catch(e){}

// CARGAR
async function loadProducts() {
  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accion: 'catalogo', limite: 500 })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    allProducts = data.productos || data.data || (Array.isArray(data) ? data : []);
    allProducts = allProducts.filter(p => p.activo !== false);
    document.getElementById('heroSub').textContent = allProducts.length + ' productos en colección';
    applyFilters();
  } catch(e) {
    document.getElementById('grid').innerHTML = '<div class="loader"><p class="error-msg">⚠️ Error cargando catálogo — reintentando...</p></div>';
    setTimeout(loadProducts, 4000);
  }
}

function applyFilters() {
  const q = currentSearch.toLowerCase().trim();
  filtered = allProducts.filter(p => {
    const cat = currentCat === 'TODOS' || p.categoria === currentCat;
    const search = !q || (p.nombre||'').toLowerCase().includes(q) || (p.descripcion||'').toLowerCase().includes(q) || (p.categoria||'').toLowerCase().includes(q);
    return cat && search;
  });
  currentPage = 1;
  renderPage();
}

function renderPage() {
  const start = (currentPage - 1) * PER_PAGE;
  const page = filtered.slice(start, start + PER_PAGE);
  const grid = document.getElementById('grid');
  document.getElementById('resultCount').textContent = filtered.length + ' productos';

  if (!filtered.length) {
    grid.innerHTML = '<div class="loader"><p>Sin resultados.</p></div>';
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  grid.innerHTML = page.map(p => `
    <div class="card" onclick="">
      <img class="card-img" src="${p.imagen_url || 'https://picsum.photos/seed/'+p.id+'/400/400'}" alt="${esc(p.nombre)}" loading="lazy" onerror="this.src='https://picsum.photos/seed/default/400/400'">
      <div class="card-body">
        <div class="card-cat">${esc(p.categoria)}</div>
        <div class="card-name">${esc(p.nombre)}</div>
        <div class="card-desc">${esc(p.descripcion||'')}</div>
        <div class="card-footer">
          <span class="card-price">€${Number(p.precio).toFixed(2)}</span>
          <button class="add-btn" onclick="addCart(${JSON.stringify(p).replace(/"/g,'&quot;')})">+ AÑADIR</button>
        </div>
      </div>
    </div>
  `).join('');

  renderPagination();
}

function renderPagination() {
  const total = Math.ceil(filtered.length / PER_PAGE);
  if (total <= 1) { document.getElementById('pagination').innerHTML = ''; return; }
  let html = '';
  const start = Math.max(1, currentPage - 2);
  const end = Math.min(total, currentPage + 2);
  if (currentPage > 1) html += `<button class="pg" onclick="goPage(${currentPage-1})">‹</button>`;
  if (start > 1) html += `<button class="pg" onclick="goPage(1)">1</button>${start > 2 ? '<span style="color:var(--dim);padding:0 4px">…</span>' : ''}`;
  for (let i = start; i <= end; i++) html += `<button class="pg ${i===currentPage?'on':''}" onclick="goPage(${i})">${i}</button>`;
  if (end < total) html += `${end < total-1 ? '<span style="color:var(--dim);padding:0 4px">…</span>' : ''}<button class="pg" onclick="goPage(${total})">${total}</button>`;
  if (currentPage < total) html += `<button class="pg" onclick="goPage(${currentPage+1})">›</button>`;
  document.getElementById('pagination').innerHTML = html;
}

function goPage(n) {
  currentPage = n;
  renderPage();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// FILTROS
document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('.fb');
  if (!btn) return;
  document.querySelectorAll('.fb').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  currentCat = btn.dataset.cat;
  applyFilters();
});

document.getElementById('searchInput').addEventListener('input', e => {
  currentSearch = e.target.value;
  applyFilters();
});

// CARRITO
function addCart(p) {
  const existing = cart.find(i => i.id === p.id);
  if (existing) { existing.qty = (existing.qty||1) + 1; }
  else { cart.push({...p, qty: 1}); }
  saveCart();
  toast('✦ ' + p.nombre + ' añadido');
  updateCartUI();
}

function removeCart(id) {
  cart = cart.filter(i => i.id !== id);
  saveCart();
  updateCartUI();
}

function saveCart() {
  try { localStorage.setItem('orionix_cart', JSON.stringify(cart)); } catch(e){}
}

function updateCartUI() {
  const count = cart.reduce((s, i) => s + (i.qty||1), 0);
  document.getElementById('cartCount').textContent = count;
  const items = document.getElementById('cartItems');
  if (!cart.length) {
    items.innerHTML = '<div class="empty-cart">Tu carrito está vacío</div>';
    document.getElementById('cartTotal').textContent = '€0.00';
    return;
  }
  items.innerHTML = cart.map(i => `
    <div class="cart-item">
      <img src="${esc(i.imagen_url||'https://picsum.photos/seed/'+i.id+'/80/80')}" alt="${esc(i.nombre)}" onerror="this.src='https://picsum.photos/seed/default/80/80'">
      <div class="ci-info">
        <div class="ci-name">${esc(i.nombre)}</div>
        <div class="ci-price">€${Number(i.precio).toFixed(2)} × ${i.qty||1}</div>
      </div>
      <button class="remove-item" onclick="removeCart(${i.id})">✕</button>
    </div>
  `).join('');
  const total = cart.reduce((s, i) => s + Number(i.precio) * (i.qty||1), 0);
  document.getElementById('cartTotal').textContent = '€' + total.toFixed(2);
}

function toggleCart() {
  document.getElementById('cartOverlay').classList.toggle('open');
  document.getElementById('cartPanel').classList.toggle('open');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2600);
}

// INIT
updateCartUI();
loadProducts();
</script>
</body>
</html>
