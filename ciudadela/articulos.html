<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORIONIX · Tienda</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0b0b0d;--gold:#e8c86a;--gold-light:#f5e0a0;--gold-dark:#b89a40;
  --text:#f0e8d0;--purple:#6a3d9a;--card:#111116;--border:#2a2a3a
}
body{background:var(--bg);color:var(--text);font-family:'Cormorant Garamond',Georgia,serif;min-height:100vh}
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap');

/* ── HEADER ── */
header{
  background:linear-gradient(135deg,#0a0a0c 0%,#111116 100%);
  border-bottom:1px solid var(--border);
  padding:16px 24px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;backdrop-filter:blur(8px)
}
.logo{font-family:'Cinzel',serif;font-size:1.2rem;color:var(--gold);letter-spacing:2px;text-decoration:none}
.nav-links{display:flex;gap:20px}
.nav-links a{color:var(--text);text-decoration:none;font-size:.9rem;opacity:.75;transition:opacity .2s}
.nav-links a:hover{opacity:1;color:var(--gold)}
.cart-btn{
  background:linear-gradient(135deg,var(--gold-dark),var(--gold));
  color:#000;border:none;padding:8px 18px;border-radius:8px;
  font-family:'Cinzel',serif;font-size:.85rem;cursor:pointer;
  text-decoration:none;display:flex;align-items:center;gap:6px
}
.cart-count{
  background:#000;color:var(--gold);border-radius:50%;
  width:20px;height:20px;display:flex;align-items:center;justify-content:center;
  font-size:.75rem;font-weight:700
}

/* ── HERO ── */
.hero{
  padding:60px 24px 40px;text-align:center;
  background:radial-gradient(ellipse at 50% 0%,rgba(232,200,106,.08) 0%,transparent 70%)
}
.hero h1{font-family:'Cinzel',serif;font-size:clamp(1.8rem,4vw,3rem);color:var(--gold);letter-spacing:3px}
.hero p{color:var(--text);opacity:.7;margin-top:10px;font-size:1.05rem}

/* ── FILTROS ── */
.filters{
  display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
  padding:0 24px 32px
}
.filter-btn{
  padding:8px 22px;border-radius:50px;border:1px solid var(--border);
  background:transparent;color:var(--text);cursor:pointer;
  font-family:'Cinzel',serif;font-size:.82rem;letter-spacing:1px;transition:all .2s
}
.filter-btn:hover,.filter-btn.active{
  background:linear-gradient(135deg,var(--gold-dark),var(--gold));
  color:#000;border-color:var(--gold)
}

/* ── GRID ── */
.container{max-width:1400px;margin:0 auto;padding:0 24px 80px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:24px
}

/* ── CARD ── */
.card{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  overflow:hidden;transition:transform .25s,box-shadow .25s;
  display:flex;flex-direction:column
}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 32px rgba(232,200,106,.15)}
.card img{width:100%;height:220px;object-fit:cover;background:#1a1a22}
.card-body{padding:18px;flex:1;display:flex;flex-direction:column;gap:8px}
.card-cat{
  font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:2px;
  color:var(--gold-dark);text-transform:uppercase
}
.card-name{font-size:1.05rem;font-weight:600;color:var(--text);line-height:1.3}
.card-desc{font-size:.88rem;opacity:.65;line-height:1.5;flex:1}
.card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.price{font-family:'Cinzel',serif;font-size:1.2rem;color:var(--gold);font-weight:700}
.add-btn{
  background:linear-gradient(135deg,var(--gold-dark),var(--gold));
  color:#000;border:none;padding:8px 16px;border-radius:8px;
  font-family:'Cinzel',serif;font-size:.8rem;cursor:pointer;transition:opacity .2s
}
.add-btn:hover{opacity:.85}

/* ── BADGE TIPO ── */
.badge{
  display:inline-block;padding:2px 10px;border-radius:50px;
  font-size:.7rem;font-family:'Cinzel',serif;letter-spacing:1px;margin-top:4px
}
.badge-MODA{background:rgba(106,61,154,.3);color:#c084fc;border:1px solid #7c3aed}
.badge-FASHION\ STYLE{background:rgba(232,200,106,.15);color:var(--gold);border:1px solid var(--gold-dark)}
.badge-MI\ DINASTIA{background:rgba(184,154,64,.2);color:#fbbf24;border:1px solid #d97706}

/* ── LOADING / EMPTY ── */
.loading{text-align:center;padding:80px 24px;color:var(--gold);font-family:'Cinzel',serif;letter-spacing:2px}
.empty{text-align:center;padding:80px 24px;opacity:.5}
.spinner{
  width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--gold);
  border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 20px
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:24px;right:24px;
  background:var(--gold);color:#000;
  padding:12px 22px;border-radius:10px;
  font-family:'Cinzel',serif;font-size:.85rem;letter-spacing:1px;
  transform:translateY(100px);opacity:0;transition:all .35s;z-index:999
}
.toast.show{transform:translateY(0);opacity:1}

/* ── MOBILE ── */
@media(max-width:600px){
  .nav-links{display:none}
  .hero h1{font-size:1.6rem}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
  .card img{height:160px}
}
</style>
</head>
<body>

<header>
  <a href="hub.html" class="logo">ORIONIX</a>
  <nav class="nav-links">
    <a href="hub.html">Inicio</a>
    <a href="tienda.html">Tienda</a>
    <a href="nexus.html">Agentes</a>
  </nav>
  <a href="carrito.html" class="cart-btn">
    🛒 Carrito <span class="cart-count" id="cartCount">0</span>
  </a>
</header>

<section class="hero">
  <h1>CATÁLOGO</h1>
  <p>Moda, estilo y lujo — desde lo esencial hasta lo extraordinario</p>
</section>

<div class="filters">
  <button class="filter-btn active" data-cat="TODOS">Todos</button>
  <button class="filter-btn" data-cat="MODA">Moda</button>
  <button class="filter-btn" data-cat="FASHION STYLE">Fashion Style</button>
  <button class="filter-btn" data-cat="MI DINASTIA">Mi Dinastía</button>
</div>

<main class="container">
  <div id="grid" class="grid">
    <div class="loading">
      <div class="spinner"></div>
      Cargando catálogo...
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const TIENDA_URL = 'https://lkevinruizl.app.n8n.cloud/webhook/orionix-tienda';
let todos = [];
let filtroActual = 'TODOS';

// ── CARRITO ──
function getCart() { try { return JSON.parse(localStorage.getItem('orionix_cart') || '[]') } catch(e) { return [] } }
function saveCart(c) { localStorage.setItem('orionix_cart', JSON.stringify(c)) }
function updateCartCount() {
  const c = getCart();
  const total = c.reduce((s,i) => s + (i.cantidad||1), 0);
  document.getElementById('cartCount').textContent = total;
}

function addToCart(p) {
  const cart = getCart();
  const ex = cart.find(i => i.id === p.id);
  if (ex) ex.cantidad = (ex.cantidad||1) + 1;
  else cart.push({...p, cantidad: 1});
  saveCart(cart);
  updateCartCount();
  showToast('✓ Añadido al carrito');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── RENDER ──
function renderCard(p) {
  const cat = (p.categoria || p.category || '').trim();
  const price = parseFloat(p.precio || p.price || 0).toFixed(2);
  const img = p.imagen || p.image || `https://picsum.photos/seed/${p.id || Math.random()}/600/400`;
  const name = p.nombre || p.name || 'Producto';
  const desc = p.descripcion || p.description || '';
  const badgeClass = 'badge-' + cat;

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <img src="${img}" alt="${name}" loading="lazy" onerror="this.src='https://picsum.photos/seed/${encodeURIComponent(name)}/600/400'">
    <div class="card-body">
      <span class="card-cat">${cat}</span>
      <div class="card-name">${name}</div>
      <div class="card-desc">${desc}</div>
      <div class="card-footer">
        <span class="price">€${price}</span>
        <button class="add-btn">+ Añadir</button>
      </div>
    </div>
  `;
  card.querySelector('.add-btn').addEventListener('click', () => addToCart({
    id: p.id || name, nombre: name, precio: price, imagen: img, categoria: cat
  }));
  return card;
}

function renderGrid(productos) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  if (!productos.length) {
    grid.innerHTML = '<div class="empty">No hay productos en esta categoría aún.</div>';
    return;
  }
  productos.forEach(p => grid.appendChild(renderCard(p)));
}

function filtrar(cat) {
  filtroActual = cat;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.cat === cat);
  });
  const result = cat === 'TODOS' ? todos : todos.filter(p => {
    const c = (p.categoria || p.category || '').trim().toUpperCase();
    return c === cat.toUpperCase();
  });
  renderGrid(result);
}

// ── CARGA ──
async function cargarProductos() {
  try {
    const res = await fetch(TIENDA_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accion: 'catalogo' })
    });
    const data = await res.json();

    // Soporta { productos:[...] } o array directo o { data:[...] }
    let prods = [];
    if (Array.isArray(data)) prods = data;
    else if (data.productos) prods = data.productos;
    else if (data.data) prods = data.data;

    if (!prods.length) throw new Error('vacío');

    todos = prods;
    filtrar(filtroActual);
  } catch(e) {
    // Fallback: productos hardcoded de emergencia
    console.warn('API no disponible, usando fallback:', e);
    todos = [
      {id:1,nombre:'Camiseta Cosmos ORIONIX',precio:'9.99',categoria:'MODA',imagen:'https://picsum.photos/seed/101/600/400',descripcion:'Camiseta de algodón premium con diseño cosmos.'},
      {id:2,nombre:'Gorra Lujo Urbano',precio:'14.99',categoria:'MODA',imagen:'https://picsum.photos/seed/102/600/400',descripcion:'Gorra ajustable estilo streetwear premium.'},
      {id:3,nombre:'Camiseta Básica Élite',precio:'19.90',categoria:'MODA',imagen:'https://picsum.photos/seed/103/600/400',descripcion:'Básico elevado, corte entallado.'},
      {id:11,nombre:'Camisa Oxford Elegancia',precio:'49.99',categoria:'FASHION STYLE',imagen:'https://picsum.photos/seed/201/600/400',descripcion:'Camisa de algodón Oxford para ocasiones especiales.'},
      {id:12,nombre:'Blazer Slim Moderno',precio:'89.99',categoria:'FASHION STYLE',imagen:'https://picsum.photos/seed/202/600/400',descripcion:'Blazer de corte slim para el hombre urbano.'},
      {id:21,nombre:'Reloj Maestro Dorado',precio:'299.99',categoria:'MI DINASTIA',imagen:'https://picsum.photos/seed/301/600/400',descripcion:'Reloj de acero inoxidable con acabado dorado.'},
      {id:22,nombre:'Traje Ejecutivo Élite',precio:'499.99',categoria:'MI DINASTIA',imagen:'https://picsum.photos/seed/302/600/400',descripcion:'Traje completo de lana italiana de alta calidad.'}
    ];
    filtrar(filtroActual);
  }
}

// ── FILTROS CLICK ──
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => filtrar(btn.dataset.cat));
});

// ── INIT ──
updateCartCount();
cargarProductos();
</script>
</body>
</html>
