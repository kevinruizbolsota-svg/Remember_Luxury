<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REMEMBER LUXURY · TIENDA</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0d;
    --gold: #e8c86a;
    --gold-light: #f0d080;
    --text: #e9ddc4;
    --border: rgba(232, 200, 106, 0.25);
    --glass: rgba(255, 255, 255, 0.03);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background-color: var(--bg); color: var(--text);
    font-family: 'Cormorant Garamond', serif; min-height: 100vh;
    display: flex; flex-direction: column; overflow-x: hidden;
  }
  canvas { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  
  header {
    position: relative; z-index: 10; padding: 20px 40px;
    border-bottom: 1px solid var(--border); background: rgba(5,5,16,0.95);
    display: flex; justify-content: space-between; align-items: center;
  }
  header h1 { font-family: 'Cinzel', serif; color: var(--gold); font-size: 1.6rem; letter-spacing: 4px; }
  .nav-links { display: flex; gap: 20px; font-family: 'Cinzel', serif; font-size: 0.8rem; letter-spacing: 2px; }
  .nav-links a { color: var(--text); text-decoration: none; transition: 0.3s; }
  .nav-links a:hover { color: var(--gold); }
  
  .hero {
    position: relative; z-index: 10; padding: 50px 20px; text-align: center;
    border-bottom: 1px solid var(--border); background: linear-gradient(180deg, rgba(11,11,13,0.8) 0%, rgba(20,20,25,0.9) 100%);
  }
  .hero h2 { font-family: 'Cinzel', serif; color: var(--gold); font-size: 2.2rem; letter-spacing: 6px; margin-bottom: 10px; }
  
  .catalog-section { position: relative; z-index: 10; padding: 40px 20px; flex: 1; max-width: 900px; margin: 0 auto; width: 100%; }
  
  .product-card {
    background: var(--glass); border: 2px solid var(--gold); border-radius: 12px;
    padding: 30px; display: flex; flex-direction: column; align-items: center; text-align: center;
    box-shadow: 0 10px 40px rgba(232, 200, 106, 0.15);
  }
  
  .product-title { font-family: 'Cinzel', serif; font-size: 1.8rem; color: var(--gold-light); margin-bottom: 15px; letter-spacing: 2px; }
  .product-desc { font-size: 1.1rem; color: rgba(233,221,196,0.85); margin-bottom: 25px; line-height: 1.6; }
  
  .btn-buy {
    display: inline-block; width: 100%; max-width: 400px; padding: 16px 20px;
    background: var(--gold); color: var(--bg);
    font-family: 'Cinzel', serif; font-size: 1rem; letter-spacing: 2px;
    text-decoration: none; border-radius: 6px; font-weight: bold; transition: 0.3s;
    box-shadow: 0 0 20px rgba(232,200,106,0.4); cursor: pointer;
  }
  .btn-buy:hover { background: var(--gold-light); transform: scale(1.02); }
</style>
</head>
<body>

<canvas id="cv"></canvas>

<header>
  <h1>REMEMBER LUXURY</h1>
  <div class="nav-links">
    <a href="articulos.html">TIENDA</a>
    <a href="carrito.html">CARRITO 🛒</a>
    <a href="pago-premium.html">CHECKOUT 💳</a>
  </div>
</header>

<div class="hero">
  <h2>RECOMENDACIÓN DESTACADA</h2>
</div>

<div class="catalog-section">
  <div class="product-card">
    <div class="product-title">CURSO & PROGRAMA OFICIAL</div>
    <div class="product-desc">Accede directamente a la presentación oficial y catálogo exclusivo. Haz clic en el botón de abajo para ser redirigido de forma segura a la plataforma oficial.</div>
    
    <!-- ENLACE EXTERNO CORREGIDO DE HOTMART SIN ERROR 404 -->
    <a href="https://go.hotmart.com/T88810632C" target="_blank" rel="noopener noreferrer" class="btn-buy">
      IR AL CURSO OFICIAL ➔
    </a>
  </div>
</div>

<script>
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  const parts = Array.from({length:40}, () => ({
    x: Math.random()*cv.width, y: Math.random()*cv.height,
    r: Math.random()*1.2+0.3, v: Math.random()*0.35+0.1
  }));
  (function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.fillStyle='rgba(232,200,106,0.35)';
    parts.forEach(p=>{ ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); p.y-=p.v; if(p.y<0)p.y=cv.height; });
    requestAnimationFrame(draw);
  })();
</script>
</body>
</html>
