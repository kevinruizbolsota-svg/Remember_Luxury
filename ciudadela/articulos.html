*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:'Cormorant Garamond',serif;min-height:100vh}

.navbar{position:sticky;top:0;z-index:100;background:rgba(11,11,13,0.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--bor);padding:15px 30px;display:flex;justify-content:space-between;align-items:center}

.cart-badge{position:absolute;top:-8px;right:-8px;background:var(--pur);color:#fff;font-size:0.7rem;width:2px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold}
.wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:40px 20px}
.breadcrumb{color:var(--gold3);font-size:0.85rem;letter-spacing:2px;margin-bottom:3px}
.breadcrumb a{color:var(--gold);text-decoration:none}
header h1{font-size:2.5rem;color:var(--gold);letter-spacing:6px;margin-bottom:10px;text-shadow:0 0 30px rgba(232,200,106,0.4)}
header p{color:var(--gold2);font-style:italic;letter-spacing:2px;margin-bottom:30px}
.contador{display:flex;gap:30px;margin-bottom:30px;flex-wrap:wrap}
.cont-item{background:var(--card);border:1px solid var(--bor);border-radius:10px;padding:15px 25px;text-align:center}
.cont-num{font-family:'Cinzel',serif;font-size:2rem;color:var(--gold);font-weight:700}
.cont-lbl{font-size:0.8rem;color:var(--gold3);letter-spacing:2px;text-transform:uppercase}
