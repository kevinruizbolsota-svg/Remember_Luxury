<!DOCTYPE html>
<html lang="es">
<head>
<script src="orionix-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORIONIX · Noche Mágica & Artículos (1,450)</title>
<link rel="icon" href="../favicon.svg?v=night1450" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #e8c86a;
  --gd: #b89a40;
  --gl: #f5e0a0;
  --text: #f8fafc;
  --dim: rgba(240,245,250,0.65);
  --blue-glow: rgba(56, 189, 248, 0.25);
  --glass-card: rgba(8, 14, 26, 0.75);
  --glass-border: rgba(232, 200, 106, 0.22);
  --glass-panel: rgba(6, 11, 22, 0.85);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Cormorant Garamond',serif;
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  background-color:#05030a;
  background-image:
    radial-gradient(circle at 50% 12%, rgba(232, 200, 106, 0.16), transparent 28%),
    radial-gradient(circle at 8% 55%, rgba(92, 52, 12, 0.24), transparent 34%),
    radial-gradient(circle at 92% 70%, rgba(30, 58, 138, 0.22), transparent 36%),
    linear-gradient(180deg, rgba(5, 3, 10, 0.72), rgba(3, 2, 7, 0.94)),
    url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=2000&auto=format&fit=crop');
  background-size:cover;
  background-position:center;
  background-attachment:fixed !important;
}
body::before {
  content:'';
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  background:radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,0.48) 100%);
}

#fireflies-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

/* NAV SUPERIOR GLASS */
nav {
  position:fixed; top:0; left:0; right:0; height:60px; z-index:900;
  display:flex; align-items:center; padding:0 28px;
  background:rgba(3, 7, 18, 0.88); border-bottom:1px solid var(--glass-border);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
}
.brand {
  font-family:'Cinzel',serif; font-size:1.15rem; font-weight:900; letter-spacing:.25em;
  color:var(--gold); text-decoration:none; margin-right:28px;
  text-shadow: 0 0 20px rgba(232,200,106,0.6);
}
.nav-links { display:flex; gap:6px; flex:1; }
.nl {
  font-family:'Cinzel',serif; font-size:.65rem; letter-spacing:.14em; color:var(--dim);
  text-decoration:none; padding:8px 16px; border-radius:8px; transition:all .25s; text-transform:uppercase;
}
.nl:hover, .nl.on { color:var(--gold); background:rgba(232,200,106,0.1); text-shadow:0 0 10px rgba(232,200,106,0.4); }
.nav-r { display:flex; align-items:center; gap:12px; margin-left:auto; }
.cart-btn {
  display:flex; align-items:center; gap:8px; padding:9px 18px; border:1px solid var(--glass-border);
  border-radius:10px; font-family:'Cinzel',serif; font-size:.68rem; letter-spacing:.12em;
  color:var(--gold); text-decoration:none; transition:all .25s; cursor:pointer;
  background:rgba(30, 58, 138, 0.25); position:relative; backdrop-filter:blur(10px);
}
.cart-btn:hover { background:rgba(232,200,106,0.2); box-shadow:0 0 20px rgba(232,200,106,0.35); border-color:var(--gold); }
.cart-count {
  position:absolute; top:-6px; right:-6px; width:22px; height:22px; border-radius:50%;
  background:var(--gold); color:#030712; font-size:.7rem; font-weight:900;
  display:flex; align-items:center; justify-content:center; font-family:'Cinzel',serif;
}

@media(max-width:850px){ .nav-links { display:none; } }
