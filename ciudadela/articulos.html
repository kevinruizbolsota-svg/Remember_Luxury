<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORIONIX · Artículos</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0b0d;
  --gold: #e8c86a;
  --gd: #b89a40;
  --gl: #f5e0a0;
  --text: #f0e8d0;
  --dim: rgba(240,232,208,0.5);
  --card: #0f0f14;
  --purp: #6a3d9a;
  --b: rgba(232,200,106,0.15);
  --ba: rgba(232,200,106,0.4);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Cormorant Garamond',serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; }
#cv { position:fixed; inset:0; z-index:0; pointer-events:none; }

/* NAV SUPERIOR */
nav {
  position:fixed; top:0; left:0; right:0; height:58px; z-index:900;
  display:flex; align-items:center; padding:0 24px;
  background:rgba(11,11,13,0.96); border-bottom:1px solid var(--b); backdrop-filter:blur(16px);
}
.brand {
  font-family:'Cinzel',serif; font-size:1.05rem; font-weight:900; letter-spacing:.22em;
  color:var(--gold); text-decoration:none; margin-right:24px;
}
.nav-links { display:flex; gap:6px; flex:1; }
.nl {
  font-family:'Cinzel',serif; font-size:.62rem; letter-spacing:.12em; color:var(--dim);
  text-decoration:none; padding:8px 14px; border-radius:6px; transition:all .2s; text-transform:uppercase;
}
.nl:hover, .nl.on { color:var(--gold); background:rgba(232,200,106,0.08); }
.nav-r { display:flex; align-items:center; gap:12px; margin-left:auto; }
.cart-btn {
  display:flex; align-items:center; gap:8px; padding:8px 16px; border:1px solid var(--ba);
  border-radius:8px; font-family:'Cinzel',serif; font-size:.65rem; letter-spacing:.1em;
  color:var(--gold); text-decoration:none; transition:all .25s; cursor:pointer;
  background:rgba(232,200,106,0.05); position:relative;
}
.cart-btn:hover { background:rgba(232,200,106,0.15); box-shadow:0 0 15px rgba(232,200,106,0.25); }
.cart-count {
  position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%;
  background:var(--gold); color:var(--bg); font-size:.65rem; font-weight:900;
  display:flex; align-items:center; justify-content:center; font-family:'Cinzel',serif;
}

@media(max-width:850px){ .nav-links { display:none; } }

.wrap { padding:84px 24px 60px; max-width:1320px; margin:0 auto; position:relative; z-index:1; }

/* HEADER */
.ph { text-align:center; margin-bottom:30px; }
.ph-tag { font-family:'Cinzel',serif; font-size:.65rem; letter-spacing:.3em; color:var(--gold); text-transform:uppercase; margin-bottom:8px; }
.ph-title { font-family:'Cinzel',serif; font-size:clamp(1.8rem,4vw,2.8rem); font-weight:900; color:var(--text); letter-spacing:.15em; margin-bottom:8px; text-shadow:0 0 30px rgba(232,200,106,0.3); }
.ph-sub { font-size:1.1rem; color:var(--dim); font-style:italic; }

/* CONTROLES Y FILTROS */
.filters-wrap {
  background:rgba(15,15,20,0.96); border:1px solid var(--b); border-radius:16px;
  padding:18px 20px; margin-bottom:30px; box-shadow:0 10px 30px rgba(0,0,0,0.5); backdrop-filter:blur(10px);
}
.top-bar { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
.search-box {
  display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.03);
  border:1px solid var(--b); border-radius:10px; padding:10px 16px; flex:1; min-width:260px;
}
.search-box input {
  background:transparent; border:none; outline:none; color:var(--text);
  font-family:'Cormorant Garamond',serif; font-size:1.05rem; width:100%;
}
.search-box input::placeholder { color:var(--dim); }
.sort-select {
  padding:10px 16px; background:rgba(255,255,255,0.03); border:1px solid var(--b);
  border-radius:10px; color:var(--text); font-family:'Cinzel',serif; font-size:.7rem;
  letter-spacing:.08em; outline:none; cursor:pointer;
}
.sort-select option { background:#111; color:#eee; }

.cats-bar { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; scrollbar-width:none; }
.cats-bar::-webkit-scrollbar { display:none; }
.ftab {
  font-family:'Cinzel',serif; font-size:.62rem; letter-spacing:.12em; padding:8px 16px;
  border-radius:20px; border:1px solid var(--b); color:var(--dim); cursor:pointer;
  transition:all .22s; text-transform:uppercase; white-space:nowrap; background:rgba(255,255,255,0.02);
}
.ftab:hover { color:var(--text); border-color:rgba(232,200,106,0.3); }
.ftab.on { color:var(--bg); border-color:var(--gold); background:var(--gold); font-weight:700; box-shadow:0 0 15px rgba(232,200,106,0.3); }

/* GRID PRODUCTOS */
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:20px; }
.card {
  background:var(--card); border:1px solid var(--b); border-radius:14px; overflow:hidden;
  transition:all .35s cubic-bezier(0.175, 0.885, 0.32, 1.275); display:flex; flex-direction:column; position:relative;
}
.card:hover { transform:translateY(-8px); border-color:var(--ba); box-shadow:0 15px 35px rgba(0,0,0,0.7),0 0 20px rgba(232,200,106,0.15); }
.card-img-wrap { position:relative; width:100%; height:200px; overflow:hidden; background:#050508; }
.card-img { width:100%; height:100%; object-fit:cover; transition:transform .5s ease; }
.card:hover .card-img { transform:scale(1.06); }
.card-cat {
  position:absolute; top:10px; left:10px; padding:4px 10px; border-radius:6px;
  font-family:'Cinzel',serif; font-size:.52rem; letter-spacing:.12em; font-weight:700;
  text-transform:uppercase; backdrop-filter:blur(8px); background:rgba(0,0,0,0.75); border:1px solid var(--b); color:var(--gold);
}

.card-body { padding:16px; display:flex; flex-direction:column; flex:1; }
.card-title { font-family:'Cinzel',serif; font-size:.9rem; font-weight:700; color:var(--text); margin-bottom:6px; letter-spacing:.04em; line-height:1.3; }
.card-desc { font-size:.85rem; color:var(--dim); line-height:1.4; margin-bottom:14px; flex:1; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.card-footer { display:flex; align-items:center; justify-content:space-between; border-top:1px solid rgba(232,200,106,0.1); padding-top:12px; margin-top:auto; }
.card-price { font-family:'Cinzel',serif; font-size:1.15rem; font-weight:900; color:var(--gl); }
.btn-buy {
  padding:8px 14px; background:rgba(232,200,106,0.1); border:1px solid var(--ba);
  color:var(--gold); border-radius:6px; font-family:'Cinzel',serif; font-size:.62rem;
  letter-spacing:.1em; cursor:pointer; transition:all .25s; text-transform:uppercase; font-weight:700;
}
.btn-buy:hover { background:var(--gold); color:var(--bg); box-shadow:0 0 15px rgba(232,200,106,0.4); }

/* PAGINACION */
.pag-wrap { display:flex; justify-content:center; align-items:center; gap:12px; margin-top:40px; flex-wrap:wrap; }
.pbtn {
  padding:8px 16px; border:1px solid var(--b); background:rgba(15,15,20,0.96);
  color:var(--text); border-radius:8px; font-family:'Cinzel',serif; font-size:.7rem; cursor:pointer; transition:all .2s;
}
.pbtn:hover:not(:disabled) { border-color:var(--gold); color:var(--gold); }
.pbtn:disabled { opacity:.3; cursor:not-allowed; }
.pinfo { font-family:'Cinzel',serif; font-size:.75rem; color:var(--dim); letter-spacing:.1em; }

/* DRAWER CARRITO */
#cart-drawer {
  position:fixed; top:0; right:-420px; width:100%; max-width:420px; height:100vh;
  background:rgba(12,12,16,0.98); border-left:1px solid var(--ba); backdrop-filter:blur(24px);
  z-index:1000; display:flex; flex-direction:column; transition:right .35s cubic-bezier(0.175, 0.885, 0.32, 1);
  box-shadow:-10px 0 40px rgba(0,0,0,0.8);
}
#cart-drawer.open { right:0; }
.cart-hd { padding:20px; border-bottom:1px solid var(--b); display:flex; justify-content:space-between; align-items:center; }
.cart-hd h3 { font-family:'Cinzel',serif; font-size:1.2rem; color:var(--gold); letter-spacing:.15em; }
.close-cart { background:none; border:none; color:var(--dim); font-size:1.6rem; cursor:pointer; transition:color .2s; }
.close-cart:hover { color:var(--gold); }
.cart-items { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px; }
.cart-item { display:flex; gap:12px; background:rgba(255,255,255,0.02); border:1px solid var(--b); border-radius:10px; padding:10px; align-items:center; }
.cart-item img { width:52px; height:52px; object-fit:cover; border-radius:6px; }
.cart-item-info { flex:1; }
.cart-item-title { font-family:'Cinzel',serif; font-size:.82rem; font-weight:700; color:var(--text); margin-bottom:2px; }
.cart-item-price { font-size:.85rem; color:var(--gl); font-weight:600; }
.cart-item-del { background:none; border:none; color:#ff5555; font-size:1.1rem; cursor:pointer; padding:4px; }
.cart-ft { padding:20px; border-top:1px solid var(--b); background:rgba(0,0,0,0.5); }
.cart-total-row { display:flex; justify-content:space-between; font-family:'Cinzel',serif; font-size:1.05rem; margin-bottom:16px; color:var(--text); }
.cart-total-row span:last-child { color:var(--gold); font-weight:900; }
.btn-checkout {
  width:100%; padding:14px; background:linear-gradient(135deg,var(--gold),var(--gd));
  border:none; border-radius:8px; color:#0b0b0d; font-family:'Cinzel',serif; font-size:.78rem;
  letter-spacing:.15em; font-weight:900; cursor:pointer; transition:all .3s; text-transform:uppercase;
}
.btn-checkout:hover { box-shadow:0 0 25px rgba(232,200,106,0.5); transform:translateY(-2px); }

/* TOAST */
#toast {
  position:fixed; bottom:24px; right:24px; background:rgba(15,15,22,0.96);
  border:1px solid var(--gold); color:var(--text); padding:14px 24px; border-radius:10px;
  font-family:'Cinzel',serif; font-size:.75rem; letter-spacing:.1em; box-shadow:0 10px 30px rgba(0,0,0,0.8),0 0 20px rgba(232,200,106,0.2);
  transform:translateY(100px); opacity:0; transition:all .3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index:2000;
}
#toast.show { transform:translateY(0); opacity:1; }
</style>

function init() {
  const urlParams = new URLSearchParams(window.location.search);
  const catParam = urlParams.get('cat');
  if (catParam) {
    const found = CATEGORIAS.find(c => c.toUpperCase() === catParam.toUpperCase());
    if (found) {
      currentCat = found;
    } else if (catParam.toUpperCase() === 'GLAMUR') {
      currentCat = 'GLAMUR';
    }
  }
  initCategories();
  applyFilterAndSort();
  updateCartUI();
}

function initCategories() {
  const container = document.getElementById('cats-container');
  container.innerHTML = CATEGORIAS.map(cat => 
    '<button class="ftab ' + (cat === currentCat ? 'on' : '') + '" onclick="selectCategory('' + cat + '')">' + cat + '</button>'
  ).join('');
}

function selectCategory(cat) {
  currentCat = cat;
  currentPage = 1;
  document.querySelectorAll('.ftab').forEach(b => {
    b.classList.toggle('on', b.textContent === cat);
  });
  applyFilterAndSort();
}

function onSearch() {
  currentPage = 1;
  applyFilterAndSort();
}

function onSort() {
  applyFilterAndSort();
}

    const desc = (p.descripcion || p.description || '').toLowerCase();
    const sku = (p.sku || '').toLowerCase();
    const matchQuery = !q || name.includes(q) || desc.includes(q) || sku.includes(q);
    return matchCat && matchQuery;
  });

  if (sortMode === 'price-asc') {
    filteredProducts.sort((a, b) => (a.precio || a.price) - (b.precio || b.price));
  } else if (sortMode === 'price-desc') {
    filteredProducts.sort((a, b) => (b.precio || b.price) - (a.precio || a.price));
  } else if (sortMode === 'name') {
    filteredProducts.sort((a, b) => (a.nombre || a.title || '').localeCompare(b.nombre || b.title || ''));
  }

  renderGrid();
  renderPagination();
}

function renderGrid() {
  const grid = document.getElementById('products-grid');
  if (!filteredProducts.length) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px 20px;font-size:1.2rem;color:var(--dim)">No se encontraron artículos en esta categoría.</div>';
    return;
  }

  const start = (currentPage - 1) * PAGE_SIZE;
  const end = Math.min(start + PAGE_SIZE, filteredProducts.length);
  const pageItems = filteredProducts.slice(start, end);

  grid.innerHTML = pageItems.map(p => {
    const title = p.nombre || p.title || 'Artículo';
    const price = Number(p.precio || p.price || 0).toFixed(2);
    const cat = p.categoria || p.category || 'MODA';
    const img = p.imagen_url || p.image || ('https://picsum.photos/seed/' + p.id + '/600/600');
    const desc = p.descripcion || p.description || '';
    const safeData = JSON.stringify({ id: p.id, nombre: title, precio: Number(price), imagen_url: img, categoria: cat }).replace(/"/g, '&quot;');

    return '<div class="card">' +
      '<div class="card-img-wrap">' +
        '<img class="card-img" src="' + img + '" alt="' + title + '" loading="lazy" onerror="this.src='https://picsum.photos/seed/krc/600/600'">' +
        '<div class="card-cat">' + cat + '</div>' +
      '</div>' +
      '<div class="card-body">' +
        '<h3 class="card-title">' + title + '</h3>' +
        '<p class="card-desc">' + desc + '</p>' +
        '<div class="card-footer">' +
          '<div class="card-price">€' + price + '</div>' +
          '<button class="btn-buy" onclick="addToCart(' + safeData + ')">+ Añadir</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function renderPagination() {
  const totalPages = Math.ceil(filteredProducts.length / PAGE_SIZE) || 1;
  document.getElementById('page-info').textContent = 'Página ' + currentPage + ' de ' + totalPages + ' (' + filteredProducts.length + ' productos)';
  document.getElementById('btn-prev').disabled = (currentPage <= 1);
  document.getElementById('btn-next').disabled = (currentPage >= totalPages);
}

function changePage(delta) {
  currentPage += delta;
  window.scrollTo({ top: 180, behavior: 'smooth' });
  renderGrid();
  renderPagination();
}

function addToCart(prod) {
  const existing = cart.find(i => i.id === prod.id);
  if (existing) {
    existing.qty = (existing.qty || 1) + 1;
  } else {
    cart.push({ ...prod, qty: 1 });
  }
  localStorage.setItem('orionix_cart', JSON.stringify(cart));
  updateCartUI();
  showToast('✦ ' + prod.nombre + ' añadido al carrito');
}

function updateCartUI() {
  const badge = document.getElementById('cart-badge');
  const totalQty = cart.reduce((acc, i) => acc + (i.qty || 1), 0);
  if (badge) badge.textContent = totalQty;

  const itemsWrap = document.getElementById('cart-items-wrap');
  if (!itemsWrap) return;

  if (!cart.length) {
    itemsWrap.innerHTML = '<div style="text-align:center;color:var(--dim);padding:40px 0;font-size:1.1rem">Tu carrito está vacío.</div>';
    document.getElementById('cart-total-price').textContent = '€0.00';
    return;
  }

  let total = 0;
  itemsWrap.innerHTML = cart.map((item, idx) => {
    const itemTotal = (item.precio * (item.qty || 1));
    total += itemTotal;
    return '<div class="cart-item">' +
      '<img src="' + item.imagen_url + '" alt="' + item.nombre + '">' +
      '<div class="cart-item-info">' +
        '<div class="cart-item-title">' + item.nombre + '</div>' +
        '<div class="cart-item-price">€' + item.precio.toFixed(2) + ' x ' + (item.qty || 1) + ' = €' + itemTotal.toFixed(2) + '</div>' +
      '</div>' +
      '<button class="cart-item-del" onclick="removeFromCart(' + idx + ')">✕</button>' +
    '</div>';
  }).join('');

  document.getElementById('cart-total-price').textContent = '€' + total.toFixed(2);
}

function removeFromCart(idx) {
  cart.splice(idx, 1);
  localStorage.setItem('orionix_cart', JSON.stringify(cart));
  updateCartUI();
}

function toggleCart() {
  document.getElementById('cart-drawer').classList.toggle('open');
}

function procederPago() {
  if (!cart.length) {
    alert('Tu carrito está vacío.');
    return;
  }
  window.location.href = 'carrito.html';
}

function showToast(text) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = text;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// Canvas cosmos
(function(){
  const c = document.getElementById('cv');
  if (!c) return;
  const ctx = c.getContext('2d');
  function r(){ c.width = innerWidth; c.height = innerHeight; }
  r(); addEventListener('resize', r);
  const s = Array.from({length: 80}, () => ({
    x: Math.random(), y: Math.random(), r: Math.random() * 0.9 + 0.1, a: Math.random(), da: (Math.random() - 0.5) * 0.005
  }));
  function d(){
    ctx.clearRect(0,0,c.width,c.height);
    s.forEach(p => {
      p.a = Math.max(0.03, Math.min(0.75, p.a + p.da));
      if (p.a <= 0.03 || p.a >= 0.75) p.da *= -1;
      ctx.beginPath();
      ctx.arc(p.x * c.width, p.y * c.height, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(232,200,106,' + (p.a * 0.3) + ')';
      ctx.fill();
    });
    requestAnimationFrame(d);
  }
  d();
})();

window.addEventListener('DOMContentLoaded', init);
</script>
