<style>
:root {
  --gold: #e8c86a;
  --gd: #b89a40;
  --gl: #f5e0a0;
  --text: #f8fafc;
  --dim: rgba(240,245,250,0.7);
  --emerald: #10b981;
  --emerald-glow: rgba(16,185,129,0.25);
  --glass-card: rgba(10, 20, 15, 0.72);
  --glass-border: rgba(232, 200, 106, 0.25);
  --glass-panel: rgba(8, 18, 14, 0.85);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Cormorant Garamond',serif;
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  background-color: #06100c;
  background-image: 
    radial-gradient(circle at 50% 0%, rgba(16,185,129,0.15), transparent 60%),
    linear-gradient(rgba(4,10,7,0.75), rgba(4,10,7,0.85)),
    url('https://images.unsplash.com/photo-1511497584788-87676104235f?q=80&w=2000&auto=format&fit=crop');
  background-size: cover;
  background-position: center;
  background-attachment: fixed !important;
}

/* NAV SUPERIOR GLASS */
nav {
  position:fixed; top:0; left:0; right:0; height:60px; z-index:900;
  display:flex; align-items:center; padding:0 28px;
  background:rgba(6,14,10,0.85); border-bottom:1px solid var(--glass-border);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
}
.brand {
  font-family:'Cinzel',serif; font-size:1.15rem; font-weight:900; letter-spacing:.25em;
  color:var(--gold); text-decoration:none; margin-right:28px;
  text-shadow: 0 0 20px rgba(232,200,106,0.5);
}
.nav-links { display:flex; gap:6px; flex:1; }
.nl {
  font-family:'Cinzel',serif; font-size:.65rem; letter-spacing:.14em; color:var(--dim);
  text-decoration:none; padding:8px 16px; border-radius:8px; transition:all .25s; text-transform:uppercase;
}
.nl:hover, .nl.on { color:var(--gold); background:rgba(232,200,106,0.1); text-shadow:0 0 10px rgba(232,200,106,0.4); }
.nav-r { display:flex; align-items:center; gap:12px; margin-left:auto; }
.cart-btn {
  display:flex; align-items:center; gap:8px; padding:9px 18px; border:1px solid var(--glass-border);
  border-radius:10px; font-family:'Cinzel',serif; font-size:.68rem; letter-spacing:.12em;
  color:var(--gold); text-decoration:none; transition:all .25s; cursor:pointer;
  background:rgba(16,185,129,0.1); position:relative; backdrop-filter:blur(10px);
}
.cart-btn:hover { background:rgba(232,200,106,0.2); box-shadow:0 0 20px rgba(232,200,106,0.3); border-color:var(--gold); }
.cart-count {
  position:absolute; top:-6px; right:-6px; width:22px; height:22px; border-radius:50%;
  background:var(--gold); color:#06100c; font-size:.7rem; font-weight:900;
  display:flex; align-items:center; justify-content:center; font-family:'Cinzel',serif;
}

@media(max-width:850px){ .nav-links { display:none; } }

.wrap { padding:90px 24px 70px; max-width:1360px; margin:0 auto; position:relative; z-index:1; }

/* HEADER */
.ph { text-align:center; margin-bottom:36px; }
.ph-tag { font-family:'Cinzel',serif; font-size:.7rem; letter-spacing:.35em; color:var(--emerald); text-transform:uppercase; margin-bottom:10px; text-shadow:0 0 15px var(--emerald); font-weight:700; }
.ph-title { font-family:'Cinzel',serif; font-size:clamp(2rem,4.5vw,3.2rem); font-weight:900; color:var(--text); letter-spacing:.18em; margin-bottom:10px; text-shadow:0 0 35px rgba(232,200,106,0.4); }
.ph-sub { font-size:1.2rem; color:var(--dim); font-style:italic; }

/* CONTROLES Y FILTROS GLASSMORPHISM */
.filters-wrap {
  background:var(--glass-panel); border:1px solid var(--glass-border); border-radius:20px;
  padding:22px 24px; margin-bottom:36px; box-shadow:0 20px 50px rgba(0,0,0,0.6);
  backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
}
.top-bar { display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin-bottom:18px; }
.search-box {
  display:flex; align-items:center; gap:12px; background:rgba(0,0,0,0.35);
  border:1px solid var(--glass-border); border-radius:12px; padding:12px 18px; flex:1; min-width:280px;
}
.search-box input {
  background:transparent; border:none; outline:none; color:var(--text);
  font-family:'Cormorant Garamond',serif; font-size:1.15rem; width:100%;
}
.search-box input::placeholder { color:var(--dim); }
.sort-select {
  padding:12px 18px; background:rgba(0,0,0,0.45); border:1px solid var(--glass-border);
  border-radius:12px; color:var(--text); font-family:'Cinzel',serif; font-size:.72rem;
  letter-spacing:.1em; outline:none; cursor:pointer;
}
.sort-select option { background:#0a1812; color:#eee; }

.cats-bar { display:flex; gap:10px; overflow-x:auto; padding-bottom:8px; scrollbar-width:none; }
.cats-bar::-webkit-scrollbar { display:none; }
.ftab {
  font-family:'Cinzel',serif; font-size:.65rem; letter-spacing:.14em; padding:10px 20px;
  border-radius:30px; border:1px solid var(--glass-border); color:var(--dim); cursor:pointer;
  transition:all .25s; text-transform:uppercase; white-space:nowrap; background:rgba(0,0,0,0.3);
  backdrop-filter:blur(10px);
}
.ftab:hover { color:var(--text); border-color:var(--gold); background:rgba(232,200,106,0.1); }
.ftab.on {
  color:#06100c; border-color:var(--gold); background:linear-gradient(135deg,var(--gold),var(--gl));
  font-weight:900; box-shadow:0 0 20px rgba(232,200,106,0.4);
}

/* GRID PRODUCTOS GLASS */
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:24px; }
.card {
  background:var(--glass-card); border:1px solid var(--glass-border); border-radius:18px;
  overflow:hidden; transition:all .4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  display:flex; flex-direction:column; position:relative;
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  box-shadow:0 15px 35px rgba(0,0,0,0.5);
}
.card:hover {
  transform:translateY(-10px); border-color:var(--gold);
  box-shadow:0 25px 50px rgba(0,0,0,0.75), 0 0 25px rgba(232,200,106,0.25);
}
.card-img-wrap { position:relative; width:100%; height:220px; overflow:hidden; background:rgba(0,0,0,0.3); }
.card-img { width:100%; height:100%; object-fit:cover; transition:transform .6s ease; }
.card:hover .card-img { transform:scale(1.08); }
.card-cat {
  position:absolute; top:12px; left:12px; padding:5px 12px; border-radius:8px;
  font-family:'Cinzel',serif; font-size:.55rem; letter-spacing:.14em; font-weight:700;
  text-transform:uppercase; backdrop-filter:blur(12px); background:rgba(4,12,8,0.85);
  border:1px solid var(--glass-border); color:var(--gold);
}

.card-body { padding:20px; display:flex; flex-direction:column; flex:1; }
.card-title { font-family:'Cinzel',serif; font-size:.95rem; font-weight:700; color:var(--text); margin-bottom:8px; letter-spacing:.05em; line-height:1.3; }
.card-desc { font-size:.9rem; color:var(--dim); line-height:1.45; margin-bottom:16px; flex:1; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.card-footer { display:flex; align-items:center; justify-content:space-between; border-top:1px solid rgba(232,200,106,0.15); padding-top:14px; margin-top:auto; }
.card-price { font-family:'Cinzel',serif; font-size:1.25rem; font-weight:900; color:var(--gl); text-shadow:0 0 10px rgba(232,200,106,0.3); }
.btn-buy {
  padding:9px 16px; background:rgba(232,200,106,0.12); border:1px solid var(--glass-border);
  color:var(--gold); border-radius:8px; font-family:'Cinzel',serif; font-size:.65rem;
  letter-spacing:.12em; cursor:pointer; transition:all .25s; text-transform:uppercase; font-weight:700;
}
.btn-buy:hover { background:var(--gold); color:#06100c; box-shadow:0 0 20px rgba(232,200,106,0.5); }

/* PAGINACION */
.pag-wrap { display:flex; justify-content:center; align-items:center; gap:14px; margin-top:44px; flex-wrap:wrap; }
.pbtn {
  padding:10px 20px; border:1px solid var(--glass-border); background:var(--glass-panel);
  color:var(--text); border-radius:10px; font-family:'Cinzel',serif; font-size:.72rem;
  cursor:pointer; transition:all .2s; backdrop-filter:blur(10px);
}
.pbtn:hover:not(:disabled) { border-color:var(--gold); color:var(--gold); box-shadow:0 0 15px rgba(232,200,106,0.3); }
.pbtn:disabled { opacity:.3; cursor:not-allowed; }
.pinfo { font-family:'Cinzel',serif; font-size:.8rem; color:var(--dim); letter-spacing:.12em; }

/* DRAWER CARRITO */
#cart-drawer {
  position:fixed; top:0; right:-440px; width:100%; max-width:440px; height:100vh;
  background:rgba(6,16,11,0.95); border-left:1px solid var(--glass-border);
  backdrop-filter:blur(30px); -webkit-backdrop-filter:blur(30px);
  z-index:1000; display:flex; flex-direction:column; transition:right .35s cubic-bezier(0.175, 0.885, 0.32, 1);
  box-shadow:-15px 0 50px rgba(0,0,0,0.9);
}
#cart-drawer.open { right:0; }
.cart-hd { padding:24px; border-bottom:1px solid var(--glass-border); display:flex; justify-content:space-between; align-items:center; }
.cart-hd h3 { font-family:'Cinzel',serif; font-size:1.3rem; color:var(--gold); letter-spacing:.18em; }
.close-cart { background:none; border:none; color:var(--dim); font-size:1.8rem; cursor:pointer; transition:color .2s; }
.close-cart:hover { color:var(--gold); }
.cart-items { flex:1; overflow-y:auto; padding:24px; display:flex; flex-direction:column; gap:16px; }
.cart-item { display:flex; gap:14px; background:rgba(255,255,255,0.03); border:1px solid var(--glass-border); border-radius:12px; padding:12px; align-items:center; }
.cart-item img { width:58px; height:58px; object-fit:cover; border-radius:8px; }
.cart-item-info { flex:1; }
.cart-item-title { font-family:'Cinzel',serif; font-size:.86rem; font-weight:700; color:var(--text); margin-bottom:3px; }
.cart-item-price { font-size:.9rem; color:var(--gl); font-weight:600; }
.cart-item-del { background:none; border:none; color:#ff6b6b; font-size:1.2rem; cursor:pointer; padding:4px; }
.cart-ft { padding:24px; border-top:1px solid var(--glass-border); background:rgba(0,0,0,0.6); }
.cart-total-row { display:flex; justify-content:space-between; font-family:'Cinzel',serif; font-size:1.15rem; margin-bottom:18px; color:var(--text); }
.cart-total-row span:last-child { color:var(--gold); font-weight:900; }
.btn-checkout {
  width:100%; padding:16px; background:linear-gradient(135deg,var(--gold),var(--gd));
  border:none; border-radius:10px; color:#06100c; font-family:'Cinzel',serif; font-size:.82rem;
  letter-spacing:.16em; font-weight:900; cursor:pointer; transition:all .3s; text-transform:uppercase;
}
.btn-checkout:hover { box-shadow:0 0 30px rgba(232,200,106,0.6); transform:translateY(-2px); }

/* TOAST */
#toast {
  position:fixed; bottom:24px; right:24px; background:rgba(8,20,14,0.96);
  border:1px solid var(--gold); color:var(--text); padding:16px 28px; border-radius:12px;

  transform:translateY(100px); opacity:0; transition:all .3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index:2000;
}
#toast.show { transform:translateY(0); opacity:1; }
</style>

let filteredProducts = [];
let currentPage = 1;
const PAGE_SIZE = 36;
let currentCat = 'TODOS';
let cart = JSON.parse(localStorage.getItem('orionix_cart') || '[]');

const CATEGORIAS = ['TODOS', 'GLAMUR', 'MODA', 'FASHION STYLE', 'MI DINASTIA', 'DIGITAL', 'HOGAR', 'TECH', 'BIENESTAR', 'VIAJE', 'MASCOTAS'];

function init() {
  const urlParams = new URLSearchParams(window.location.search);
  const catParam = urlParams.get('cat');
  if (catParam) {
    const found = CATEGORIAS.find(c => c.toUpperCase() === catParam.toUpperCase());
    if (found) {
      currentCat = found;
    } else if (catParam.toUpperCase() === 'GLAMUR') {
      currentCat = 'GLAMUR';
    }
  }
  initCategories();
  applyFilterAndSort();
  updateCartUI();
}

function initCategories() {
  const container = document.getElementById('cats-container');
  container.innerHTML = CATEGORIAS.map(cat => {
    const isAct = (cat === currentCat ? 'on' : '');
    return '<button class="ftab ' + isAct + '" data-cat="' + cat + '">' + cat + '</button>';
  }).join('');

  container.querySelectorAll('.ftab').forEach(b => {
    b.addEventListener('click', function() {
      selectCategory(this.getAttribute('data-cat'));
    });
  });
}

function selectCategory(cat) {
  currentCat = cat;
  currentPage = 1;
  document.querySelectorAll('.ftab').forEach(b => {
    b.classList.toggle('on', b.getAttribute('data-cat') === cat);
  });
  applyFilterAndSort();
}

function onSearch() {
  currentPage = 1;
  applyFilterAndSort();
}

function onSort() {
  applyFilterAndSort();
}

function applyFilterAndSort() {
  const q = (document.getElementById('search-input').value || '').toLowerCase().trim();
  const sortMode = document.getElementById('sort-select').value;

  filteredProducts = ALL_PRODUCTS.filter(p => {
    const pCat = (p.categoria || p.category || 'MODA').toUpperCase();
    const matchCat = (currentCat === 'TODOS' || pCat === currentCat.toUpperCase() || (currentCat === 'GLAMUR' && (pCat === 'MODA' || pCat === 'MI DINASTIA' || pCat === 'FASHION STYLE')));
    const name = (p.nombre || p.title || '').toLowerCase();
    const desc = (p.descripcion || p.description || '').toLowerCase();
    const sku = (p.sku || '').toLowerCase();
    const matchQuery = !q || name.includes(q) || desc.includes(q) || sku.includes(q);
    return matchCat && matchQuery;
  });

  if (sortMode === 'price-asc') {
    filteredProducts.sort((a, b) => (a.precio || a.price) - (b.precio || b.price));
  } else if (sortMode === 'price-desc') {
    filteredProducts.sort((a, b) => (b.precio || b.price) - (a.precio || a.price));
  } else if (sortMode === 'name') {
    filteredProducts.sort((a, b) => (a.nombre || a.title || '').localeCompare(b.nombre || b.title || ''));
  }

  renderGrid();
  renderPagination();
}

function renderGrid() {
  const grid = document.getElementById('products-grid');
  if (!filteredProducts.length) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px 20px;font-size:1.2rem;color:var(--dim)">No se encontraron artículos en esta categoría.</div>';
    return;
  }

  const start = (currentPage - 1) * PAGE_SIZE;
  const end = Math.min(start + PAGE_SIZE, filteredProducts.length);
  const pageItems = filteredProducts.slice(start, end);

  grid.innerHTML = pageItems.map((p, idx) => {
    const title = p.nombre || p.title || 'Artículo';
    const price = Number(p.precio || p.price || 0).toFixed(2);
    const cat = p.categoria || p.category || 'MODA';
    const img = p.imagen_url || p.image || ('https://picsum.photos/seed/' + p.id + '/600/600');
    const desc = p.descripcion || p.description || '';

    return '<div class="card">' +
      '<div class="card-img-wrap">' +
        '<img class="card-img" src="' + img + '" alt="' + title + '" loading="lazy" onerror="this.src=\'https://picsum.photos/seed/nature/600/600\'">' +
        '<div class="card-cat">' + cat + '</div>' +
      '</div>' +
      '<div class="card-body">' +
        '<h3 class="card-title">' + title + '</h3>' +
        '<p class="card-desc">' + desc + '</p>' +
        '<div class="card-footer">' +
          '<div class="card-price">€' + price + '</div>' +
          '<button class="btn-buy" data-idx="' + (start + idx) + '">+ Añadir</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');

  grid.querySelectorAll('.btn-buy').forEach(btn => {
    btn.addEventListener('click', function() {
      const idx = parseInt(this.getAttribute('data-idx'));
      addToCart(filteredProducts[idx]);
    });
  });
}

function renderPagination() {
  const totalPages = Math.ceil(filteredProducts.length / PAGE_SIZE) || 1;
  document.getElementById('page-info').textContent = 'Página ' + currentPage + ' de ' + totalPages + ' (' + filteredProducts.length + ' productos)';
  document.getElementById('btn-prev').disabled = (currentPage <= 1);
  document.getElementById('btn-next').disabled = (currentPage >= totalPages);
}

function changePage(delta) {
  currentPage += delta;
  window.scrollTo({ top: 220, behavior: 'smooth' });
  renderGrid();
  renderPagination();
}

function addToCart(prod) {
  const existing = cart.find(i => i.id === prod.id);
  if (existing) {
    existing.qty = (existing.qty || 1) + 1;
  } else {
    cart.push({ ...prod, qty: 1 });
  }
  localStorage.setItem('orionix_cart', JSON.stringify(cart));
  updateCartUI();
  showToast('✦ ' + (prod.nombre || prod.title) + ' añadido al carrito');
}

function updateCartUI() {
  const badge = document.getElementById('cart-badge');
  const totalQty = cart.reduce((acc, i) => acc + (i.qty || 1), 0);
  if (badge) badge.textContent = totalQty;

  const itemsWrap = document.getElementById('cart-items-wrap');
  if (!itemsWrap) return;

  if (!cart.length) {
    itemsWrap.innerHTML = '<div style="text-align:center;color:var(--dim);padding:40px 0;font-size:1.1rem">Tu carrito está vacío.</div>';
    document.getElementById('cart-total-price').textContent = '€0.00';
    return;
  }

  let total = 0;
  itemsWrap.innerHTML = cart.map((item, idx) => {
    const itemTotal = (item.precio * (item.qty || 1));
    total += itemTotal;
    return '<div class="cart-item">' +
      '<img src="' + item.imagen_url + '" alt="' + item.nombre + '">' +
      '<div class="cart-item-info">' +
        '<div class="cart-item-title">' + item.nombre + '</div>' +
        '<div class="cart-item-price">€' + Number(item.precio).toFixed(2) + ' x ' + (item.qty || 1) + ' = €' + itemTotal.toFixed(2) + '</div>' +
      '</div>' +
      '<button class="cart-item-del" data-del="' + idx + '">✕</button>' +
    '</div>';
  }).join('');

  itemsWrap.querySelectorAll('.cart-item-del').forEach(btn => {
    btn.addEventListener('click', function() {
      removeFromCart(parseInt(this.getAttribute('data-del')));
    });
  });

  document.getElementById('cart-total-price').textContent = '€' + total.toFixed(2);
}

function removeFromCart(idx) {
  cart.splice(idx, 1);
  localStorage.setItem('orionix_cart', JSON.stringify(cart));
  updateCartUI();
}

function toggleCart() {
  document.getElementById('cart-drawer').classList.toggle('open');
}

function procederPago() {
  if (!cart.length) {
    alert('Tu carrito está vacío.');
    return;
  }
  window.location.href = 'carrito.html';
}

function showToast(text) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = text;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

window.addEventListener('DOMContentLoaded', init);
</script>
