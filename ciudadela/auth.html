<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ORIONIX · Acceso</title>
<link rel="icon" href="https://raw.githubusercontent.com/kevinruizbolsota-svg/Remember_Luxury/main/ciudadela/unnamed.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--gold:#e8c86a;--light:#f5e0a0;--text:#f0e8d0;--muted:#a69a83;--border:rgba(232,200,106,.18)}*{box-sizing:border-box;margin:0}html,body{min-height:100%;background:#030407;color:var(--text)}body{font-family:'Cormorant Garamond',serif;overflow-x:hidden}.scene{position:fixed;inset:0;z-index:0;background:#030407;overflow:hidden}.scene video{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover;pointer-events:none;filter:saturate(.72) brightness(.58);opacity:.82}.scene:after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 35%,transparent 0,rgba(3,4,7,.18) 38%,rgba(3,4,7,.86) 100%),linear-gradient(180deg,rgba(3,4,7,.28),rgba(3,4,7,.78));pointer-events:none}.stars{position:absolute;inset:0;z-index:1;pointer-events:none;background-image:radial-gradient(circle at 20% 25%,rgba(255,255,255,.5) 0 1px,transparent 1px),radial-gradient(circle at 72% 18%,rgba(232,200,106,.5) 0 1px,transparent 1px),radial-gradient(circle at 84% 68%,rgba(255,255,255,.35) 0 1px,transparent 1px);background-size:220px 220px,310px 310px,390px 390px;opacity:.2}.page{position:relative;z-index:3;min-height:100vh;display:grid;place-items:center;padding:32px}.brand-finale{position:fixed;inset:0;z-index:8;display:grid;place-items:center;pointer-events:none;opacity:0;animation:brandReveal 2.2s ease 6s forwards}.brand-finale div{font-family:Cinzel,serif;font-weight:900;font-size:clamp(3rem,11vw,8rem);letter-spacing:.3em;margin-left:.3em;background:linear-gradient(120deg,#8a6a24,#e8c86a,#fff7ce,#e8c86a,#8a6a24);background-size:240%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 45px rgba(232,200,106,.28);animation:shine 8s linear infinite}.brand-finale small{display:block;text-align:center;margin-top:10px;font:700 .7rem Cinzel,serif;letter-spacing:.55em;color:rgba(245,224,160,.72)}.wrap{width:min(1000px,96vw);display:grid;grid-template-columns:1.05fr .95fr;background:rgba(8,9,13,.68);border:1px solid var(--border);box-shadow:0 30px 100px rgba(0,0,0,.65),0 0 80px rgba(232,200,106,.05);backdrop-filter:blur(18px);border-radius:24px;overflow:hidden}.hero{min-height:640px;padding:58px 44px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;border-right:1px solid var(--border);position:relative}.hero:before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(3,4,7,.7));pointer-events:none}.hero>*{position:relative;z-index:2}.eyebrow{font:700 .62rem Cinzel,serif;letter-spacing:.35em;text-transform:uppercase;color:var(--gold);margin-bottom:16px}.hero h1{font-family:Cinzel,serif;font-size:clamp(2rem,5vw,4.5rem);letter-spacing:.16em;line-height:1.05;background:linear-gradient(120deg,#b58c31,#e8c86a,#fff5c8,#e8c86a);background-size:220%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s linear infinite}.hero p{max-width:450px;margin-top:18px;color:rgba(240,232,208,.68);font-size:1.05rem;line-height:1.65;font-style:italic}.form{padding:54px 46px;display:flex;align-items:center}.card{width:100%;max-width:370px;margin:auto}.title{font-family:Cinzel,serif;font-size:1rem;letter-spacing:.22em;text-transform:uppercase;color:var(--light)}.desc{margin:8px 0 26px;color:var(--muted);font-size:.92rem}.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:26px}.tab{flex:1;padding:11px 8px;text-align:center;font-family:Cinzel,serif;font-size:.5rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}.tab.active{color:var(--gold);border-color:var(--gold)}.panel{display:none}.panel.active{display:block}.field{margin-bottom:18px}.field label{display:block;font-family:Cinzel,serif;font-size:.46rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}.field input{width:100%;padding:13px 14px;background:rgba(255,255,255,.035);border:1px solid var(--border);border-radius:9px;color:var(--text);font:1rem 'Cormorant Garamond',serif;outline:none}.field input:focus{border-color:rgba(232,200,106,.5);box-shadow:0 0 0 2px rgba(232,200,106,.06)}button.primary{width:100%;padding:14px;border:0;border-radius:9px;background:linear-gradient(135deg,#b58c31,#e8c86a,#fff1b6);color:#07070a;font-family:Cinzel,serif;font-size:.56rem;letter-spacing:.18em;font-weight:900;cursor:pointer;box-shadow:0 8px 24px rgba(232,200,106,.15)}button.primary:disabled{opacity:.5;cursor:wait}.msg{display:none;margin-top:16px;padding:11px 13px;border-left:2px solid var(--gold);background:rgba(232,200,106,.05);font-size:.78rem;color:var(--gold)}.msg.show{display:block}.footer{margin-top:24px;text-align:center;font-size:.72rem;color:rgba(166,154,131,.62)}.footer a{color:var(--gold);text-decoration:none}.sound{position:fixed;right:20px;bottom:18px;z-index:6;padding:9px 13px;border:1px solid var(--border);border-radius:999px;background:rgba(5,6,9,.62);color:var(--light);font:700 .52rem Cinzel,serif;letter-spacing:.12em;cursor:pointer;backdrop-filter:blur(10px)}@keyframes shine{to{background-position:240% center}}@keyframes brandReveal{0%{opacity:0;transform:scale(.94);filter:blur(8px)}35%{opacity:1;transform:scale(1);filter:blur(0)}75%{opacity:1}100%{opacity:0;transform:scale(1.04);filter:blur(2px)}}@media(max-width:760px){.page{padding:18px}.wrap{grid-template-columns:1fr}.hero{min-height:390px;padding:38px 28px;border-right:0;border-bottom:1px solid var(--border);justify-content:flex-end}.form{padding:36px 25px}.scene video{object-fit:cover}.brand-finale div{font-size:3.1rem;letter-spacing:.18em;margin-left:.18em}}
</style>
</head>
<body>
<div class="scene" aria-hidden="true"><video id="natureVideo" autoplay muted playsinline loop preload="auto" poster="https://upload.wikimedia.org/wikipedia/commons/thumb/5/56/Relax_nature_scene_%40my_home.webm/1280px-Relax_nature_scene_%40my_home.webm.jpg"><source src="https://upload.wikimedia.org/wikipedia/commons/transcoded/5/56/Relax_nature_scene_%40my_home.webm/Relax_nature_scene_%40my_home.webm.360p.webm" type="video/webm"></video><div class="stars"></div></div>
<div class="brand-finale" aria-hidden="true"><div>ORIONIX<small>EL UNIVERSO DE KRC</small></div></div>
<button class="sound" id="soundBtn">◉ SONIDO</button>
<main class="page"><div class="wrap"><section class="hero"><div class="eyebrow">Un lugar para comenzar</div><h1>ORIONIX</h1><p>Respira. Baja el ruido. Entra al universo y descubre tu próximo mundo.</p></section><section class="form"><div class="card"><div class="title">Acceso al Universo</div><div class="desc">Después de entrar irás directamente a la tienda.</div><div class="tabs"><div class="tab active" data-tab="login">Iniciar sesión</div><div class="tab" data-tab="register">Crear cuenta</div><div class="tab" data-tab="guest">Visitante</div></div><div id="login" class="panel active"><div class="field"><label>Correo electrónico</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Contraseña</label><input id="pass" type="password" autocomplete="current-password"></div><button id="loginBtn" class="primary">ENTRAR A LA TIENDA</button></div><div id="register" class="panel"><div class="field"><label>Nombre</label><input id="name" type="text" autocomplete="name"></div><div class="field"><label>Correo electrónico</label><input id="rEmail" type="email" autocomplete="email"></div><div class="field"><label>Contraseña</label><input id="rPass" type="password" autocomplete="new-password"></div><button id="registerBtn" class="primary">CREAR CUENTA Y ENTRAR</button></div><div id="guest" class="panel"><div class="field"><label>Nombre</label><input id="gName" type="text" placeholder="Visitante"></div><button id="guestBtn" class="primary">ENTRAR COMO VISITANTE</button></div><div id="msg" class="msg"></div><div class="footer"><a href="index.html">Volver a Orionix</a> · <span>El acceso es obligatorio para continuar</span></div></div></section></div></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script>
const CFG={apiKey:'AIzaSyDZoywcYKSy',authDomain:'las-cronicas-de-krc.firebaseapp.com',projectId:'las-cronicas-de-krc',storageBucket:'las-cronicas-de-krc.firebasestorage.app',messagingSenderId:'636206734640',appId:'1:636206734640:web:40c52672294155c6d77cf5'};firebase.initializeApp(CFG);const auth=firebase.auth();
const tabs=document.querySelectorAll('.tab');tabs.forEach(t=>t.onclick=()=>{tabs.forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.getElementById(t.dataset.tab).classList.add('active');msg('')});
function msg(t){const el=document.getElementById('msg');el.textContent=t;el.classList.toggle('show',!!t)}function go(user,role='usuario'){localStorage.setItem('orionix_sesion',JSON.stringify({uid:user?.uid||null,email:user?.email||null,nombre:user?.displayName||document.getElementById('name')?.value||'Visitante',rol:role,ts:Date.now()}));msg('✦ Acceso concedido. Entrando a la tienda…');setTimeout(()=>{const target=sessionStorage.getItem('orionix_redirect_after_login');sessionStorage.removeItem('orionix_redirect_after_login');location.href=target||'tienda.html'},500)}
document.getElementById('loginBtn').onclick=async()=>{const b=document.getElementById('loginBtn'),email=document.getElementById('email').value.trim(),pass=document.getElementById('pass').value;if(!email||!pass)return msg('Completa correo y contraseña.');b.disabled=true;try{const c=await auth.signInWithEmailAndPassword(email,pass);go(c.user)}catch(e){msg(e.code==='auth/invalid-credential'?'Correo o contraseña incorrectos.':'No se pudo iniciar sesión.');b.disabled=false}};
document.getElementById('registerBtn').onclick=async()=>{const b=document.getElementById('registerBtn'),name=document.getElementById('name').value.trim(),email=document.getElementById('rEmail').value.trim(),pass=document.getElementById('rPass').value;if(!name||!email||pass.length<6)return msg('Completa los datos y usa una contraseña de mínimo 6 caracteres.');b.disabled=true;try{const c=await auth.createUserWithEmailAndPassword(email,pass);await c.user.updateProfile({displayName:name});go(c.user)}catch(e){msg('No se pudo crear la cuenta.');b.disabled=false}};
document.getElementById('guestBtn').onclick=()=>{const n=document.getElementById('gName').value.trim()||'Visitante';go({uid:'guest_'+Date.now(),email:'guest@orionix.luxury',displayName:n},'visitante')};
const video=document.getElementById('natureVideo');const soundBtn=document.getElementById('soundBtn');function restartVideo(){video.currentTime=0;video.muted=true;const p=video.play();if(p&&p.catch)p.catch(()=>{});soundBtn.textContent='◉ VIDEO ACTIVO'}window.addEventListener('load',restartVideo);window.addEventListener('pageshow',restartVideo);document.addEventListener('visibilitychange',()=>{if(!document.hidden)restartVideo()});soundBtn.onclick=()=>{video.muted=!video.muted;if(video.muted){soundBtn.textContent='◉ VIDEO ACTIVO'}else{video.play().catch(()=>{video.muted=true});soundBtn.textContent='◉ SONIDO ACTIVO'}};
auth.onAuthStateChanged(user=>{if(user&&!location.search.includes('force=1')){/* evita redirecciones automáticas */}});
</script>
</body></html>
