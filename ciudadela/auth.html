value,pass.value);go(c.user)}catch(e){show('Correo o contraseña incorrectos.')}};document.getElementById('registerBtn').onclick=async()=>{try{const c=await auth.createUserWithEmailAndPassword(rEmail.value,rPass.value);await c.user.updateProfile({displayName:name.value});go(c.user)}catch(e){show('No se pudo crear la cuenta.')}};document.getElementById('guestBtn').onclick=()=>go({uid:'guest_'+Date.now(),displayName:gName.value||'Visitante'},'visitante');document.getElementById('sound').onclick=()=>{iv.muted=!iv.muted;bv.muted=!bv.muted;document.getElementById('sound').textContent=iv.muted?'◉ SONIDO':'◉ SONIDO ACTIVO';iv.play().catch(()=>{});bv.play().catch(()=>{})};</script></body></html>
