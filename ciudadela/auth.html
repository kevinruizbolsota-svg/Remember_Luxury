<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORIONIX · Acceso</title>
<link rel="icon" href="https://raw.githubusercontent.com/kevinruizbolsota-svg/Remember_Luxury/main/ciudadela/unnamed.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#e8c86a; --gd:#b89a40; --gl:#f5e0a0;
  --gold-glow:rgba(232,200,106,0.25);
  --bg:#07070a; --card:rgba(10,10,15,0.88);
  --text:#f0e8d0; --muted:#8a7f68;
  --border:rgba(232,200,106,0.13); --border-hi:rgba(232,200,106,0.42);
  --green:#4ade80; --red:#f87171;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;-webkit-font-smoothing:antialiased}
body{
  font-family:'Cormorant Garamond',Georgia,serif;
  background:var(--bg); color:var(--text);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  min-height:100vh; overflow:hidden;
}

/* ── AURORA ── */
#aurora{position:fixed;inset:0;z-index:0;pointer-events:none}
#stars{position:fixed;inset:0;z-index:1;pointer-events:none}

/* ── WRAP ── */
.wrap{
  position:relative; z-index:10;
  width:min(440px,92vw);
  display:flex; flex-direction:column; align-items:center;
}

/* ── LOGO ── */
.logo{
  font-family:'Cinzel',serif;
  font-size:clamp(1.6rem,5vw,2.4rem);
  font-weight:900; letter-spacing:12px;
  background:linear-gradient(135deg,var(--gd),var(--gold),var(--gl),var(--gold));
  background-size:200% auto;
  -webkit-background-clip:text; background-clip:text; color:transparent;
  animation:shimmer 5s linear infinite;
  margin-bottom:6px; text-align:center;
}
.logo-sub{
  font-family:'Cinzel',serif; font-size:.5rem; letter-spacing:5px;
  color:var(--muted); text-transform:uppercase; margin-bottom:40px; text-align:center;
}
@keyframes shimmer{0%{background-position:0 center}100%{background-position:200% center}}

/* ── CARD ── */
.card{
  background:var(--card);
  border:1px solid var(--border);
  padding:38px 40px 36px;
  backdrop-filter:blur(28px);
  box-shadow:0 0 80px rgba(0,0,0,.9), inset 0 0 50px rgba(232,200,106,.02);
  width:100%;
}

/* ── TABS ── */
.tabs{display:flex; margin-bottom:32px; border-bottom:1px solid var(--border)}
.tab{
  flex:1; padding:13px 8px; text-align:center; cursor:pointer;
  font-family:'Cinzel',serif; font-size:.5rem; letter-spacing:3px; text-transform:uppercase;
  color:var(--muted); border-bottom:2px solid transparent; position:relative; bottom:-1px;
  transition:all .3s;
}
.tab:hover{color:var(--gl)}
.tab.active{color:var(--gold); border-bottom-color:var(--gold); text-shadow:0 0 16px var(--gold-glow)}

/* ── PANELS ── */
.panel{display:none}
.panel.active{display:block; animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ── FIELD GROUP ── */
.fg{margin-bottom:20px}
.fg label{
  display:block; font-family:'Cinzel',serif;
  font-size:.46rem; letter-spacing:3px; text-transform:uppercase;
  color:var(--gd); margin-bottom:8px;
}
.fg input{
  width:100%; background:rgba(0,0,0,.4);
  border:1px solid var(--border); color:var(--text);
  padding:13px 16px; font-family:'Cormorant Garamond',serif; font-size:1rem;
  outline:none; transition:all .3s;
}
.fg input::placeholder{color:rgba(138,127,104,.3)}
.fg input:focus{
  border-color:var(--border-hi);
  background:rgba(232,200,106,.025);
  box-shadow:0 0 0 1px rgba(232,200,106,.07), 0 0 20px rgba(232,200,106,.05);
}

/* ── BUTTON GOLD ── */
.btn-gold{
  width:100%; padding:15px;
  background:linear-gradient(135deg,var(--gd),var(--gold),var(--gl));
  background-size:200% auto;
  border:none; color:#07070a;
  font-family:'Cinzel',serif; font-size:.58rem; letter-spacing:4px; text-transform:uppercase;
  cursor:pointer; margin-bottom:18px;
  transition:background-position .4s, box-shadow .3s;
  position:relative; overflow:hidden;
}
.btn-gold:hover{background-position:right center; box-shadow:0 0 28px rgba(232,200,106,.2)}
.btn-gold:disabled{opacity:.4; cursor:not-allowed}

/* ── DIVIDER ── */
.divider{
  display:flex; align-items:center; gap:14px; margin:18px 0;
  font-family:'Cinzel',serif; font-size:.44rem; letter-spacing:3px;
  color:var(--muted); text-transform:uppercase;
}
.divider::before,.divider::after{
  content:''; flex:1; height:1px;
  background:linear-gradient(90deg,transparent,var(--border),transparent);
}

/* ── BUTTON GOOGLE ── */
.btn-google{
  width:100%; padding:13px 18px;
  background:transparent; color:var(--text);
  border:1px solid var(--border);
  font-family:'Cormorant Garamond',serif; font-size:1rem;
  cursor:pointer; display:flex; align-items:center; justify-content:center; gap:12px;
  transition:all .3s;
}
.btn-google:hover{border-color:var(--border-hi); background:rgba(232,200,106,.04); box-shadow:0 0 18px rgba(232,200,106,.08)}
.g-icon{width:20px; height:20px; flex-shrink:0}

/* ── MESSAGE ── */
#msg{
  margin-top:16px; padding:12px 16px;
  font-family:'Cinzel',serif; font-size:.5rem; letter-spacing:2px; text-transform:uppercase;
  display:none; animation:fadeUp .3s ease;
}
.msg-ok  {background:rgba(74,222,128,.06);border:1px solid rgba(74,222,128,.25);color:var(--green)}
.msg-err {background:rgba(248,113,113,.06);border:1px solid rgba(248,113,113,.25);color:var(--red)}

/* ── SPINNER ── */
.spinner{
  display:inline-block; width:14px; height:14px; margin-right:8px;
  border:2px solid rgba(7,7,10,.3); border-top-color:#07070a;
  border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── FOOTER ── */
.footer{
  margin-top:22px; text-align:center;
  font-family:'Cinzel',serif; font-size:.44rem; letter-spacing:2px;
  color:rgba(138,127,104,.4);
}
.footer a{color:var(--muted); text-decoration:none; transition:color .2s}
.footer a:hover{color:var(--gold)}

/* ── HAIRLINE ── */
.hairline{width:60px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 auto 36px}
</style>
</head>
<body>

<canvas id="aurora"></canvas>
<canvas id="stars"></canvas>

<div class="wrap">
  <div class="logo">ORIONIX</div>
  <div class="logo-sub">Sistema de Acceso · La Ciudadela</div>
  <div class="hairline"></div>

  <div class="card">

    <div class="tabs">
      <div class="tab active" id="tab-login" onclick="switchTab('login')">Acceder</div>
      <div class="tab" id="tab-reg" onclick="switchTab('register')">Registrarse</div>
    </div>

    <!-- LOGIN -->
    <div id="panel-login" class="panel active">
      <div class="fg">
        <label>Correo electrónico</label>
        <input type="email" id="lEmail" placeholder="tu@correo.com" onkeypress="if(event.key==='Enter')doLogin()">
      </div>
      <div class="fg">
        <label>Contraseña</label>
        <input type="password" id="lPass" placeholder="••••••••" onkeypress="if(event.key==='Enter')doLogin()">
      </div>
      <button class="btn-gold" id="btnLogin" onclick="doLogin()">Iniciar Sesión</button>
      <div class="divider">O continúa con</div>
      <button class="btn-google" onclick="doGoogle()">
        <svg class="g-icon" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.35-8.16 2.35-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Continuar con Google
      </button>
    </div>

    <!-- REGISTER -->
    <div id="panel-register" class="panel">
      <div class="fg">
        <label>Nombre</label>
        <input type="text" id="rName" placeholder="Tu nombre o alias">
      </div>
      <div class="fg">
        <label>Correo electrónico</label>
        <input type="email" id="rEmail" placeholder="tu@correo.com">
      </div>
      <div class="fg">
        <label>Contraseña</label>
        <input type="password" id="rPass" placeholder="Mín. 6 caracteres" onkeypress="if(event.key==='Enter')doRegister()">
      </div>
      <button class="btn-gold" id="btnReg" onclick="doRegister()">Crear Cuenta</button>
      <div class="divider">O regístrate con</div>
      <button class="btn-google" onclick="doGoogle()">
        <svg class="g-icon" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.35-8.16 2.35-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Registrarse con Google
      </button>
    </div>

    <div id="msg"></div>
  </div>

  <div class="footer">
    ORIONIX MAISON © 2026 &nbsp;·&nbsp;
    <a href="hub.html">Volver al Hub</a>
  </div>
</div>

<!-- AURORA + STARS -->
<script>
(function(){
  const c=document.getElementById('aurora'),ctx=c.getContext('2d');
  let W,H,t=0;
  const bands=[
    {y:.15,a:.065,fA:.00055,fB:.0013,sA:2.8,sB:1.9,alpha:.18,rgb:'232,200,106',w:.16},
    {y:.35,a:.045,fA:.0009,fB:.002,sA:3.5,sB:2.4,alpha:.10,rgb:'245,224,160',w:.13},
    {y:.55,a:.06,fA:.0004,fB:.0011,sA:2.2,sB:1.5,alpha:.06,rgb:'184,154,64',w:.18},
  ];
  function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}
  function wy(x,b,t){return b.y*H+Math.sin(x*b.fA+t*b.sA)*b.a*H+Math.sin(x*b.fB+t*b.sB+1.3)*b.a*H*.45}
  function draw(b,t){
    const bH=b.w*H,pts=[];
    for(let x=0;x<=W;x+=3)pts.push({x,y:wy(x,b,t)});
    ctx.beginPath();ctx.moveTo(0,pts[0].y);
    pts.forEach(p=>ctx.lineTo(p.x,p.y));
    for(let i=pts.length-1;i>=0;i--)ctx.lineTo(pts[i].x,pts[i].y+bH);
    ctx.closePath();
    const mid=pts[Math.floor(pts.length/2)].y+bH*.5;
    const g=ctx.createLinearGradient(0,mid-bH,0,mid+bH);
    g.addColorStop(0,`rgba(${b.rgb},0)`);g.addColorStop(.5,`rgba(${b.rgb},${b.alpha})`);g.addColorStop(1,`rgba(${b.rgb},0)`);
    ctx.fillStyle=g;ctx.fill();
    ctx.beginPath();ctx.moveTo(0,pts[0].y);pts.forEach(p=>ctx.lineTo(p.x,p.y));
    ctx.strokeStyle=`rgba(${b.rgb},${b.alpha*1.8})`;ctx.lineWidth=1;ctx.shadowColor=`rgba(${b.rgb},.7)`;ctx.shadowBlur=12;ctx.stroke();ctx.shadowBlur=0;
  }
  let last=0;
  function loop(ts){const dt=(ts-last)/1000;last=ts;t+=dt*.5;ctx.clearRect(0,0,W,H);bands.forEach(b=>draw(b,t));requestAnimationFrame(loop)}
  window.addEventListener('resize',resize);resize();requestAnimationFrame(loop);
})();
(function(){
  const c=document.getElementById('stars'),ctx=c.getContext('2d');let stars=[];
  function resize(){c.width=window.innerWidth;c.height=window.innerHeight;stars=[];const n=Math.floor(c.width*c.height/6000);for(let i=0;i<n;i++)stars.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1+.2,a:Math.random()*.5+.1,s:Math.random()*.0005+.0002,p:Math.random()*Math.PI*2});}
  function draw(ts){ctx.clearRect(0,0,c.width,c.height);stars.forEach(s=>{const a=s.a*(.65+.35*Math.sin(ts*s.s+s.p));ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(240,232,208,${a.toFixed(3)})`;ctx.fill();});requestAnimationFrame(draw);}
  window.addEventListener('resize',resize);resize();requestAnimationFrame(draw);
})();
</script>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
const FIREBASE_CFG = {
  apiKey:            'AIzaSyDZoywcYKSBrAk_iwSMN4rnw7goLSltj7A',
  authDomain:        'las-cronicas-de-krc.firebaseapp.com',
  projectId:         'las-cronicas-de-krc',
  storageBucket:     'las-cronicas-de-krc.firebasestorage.app',
  messagingSenderId: '636206734640',
  appId:             '1:636206734640:web:40c52672294155c6d77cf5',
};

const ADMIN_EMAIL = 'kevin.ruiz.bolsota@gmail.com';

if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CFG);
const auth = firebase.auth();

/* ── Si ya está logueado → redirigir ── */
auth.onAuthStateChanged(user => {
  if (user) goHome(user);
});

/* ── Destino post-login ── */
function goHome(user) {
  const params = new URLSearchParams(window.location.search);
  const returnTo = params.get('return');
  if (returnTo && returnTo !== '/ciudadela/auth.html') {
    window.location.href = decodeURIComponent(returnTo);
  } else {
    // Admin → hub, usuario normal → hub también
    window.location.href = 'hub.html';
  }
}

/* ── TABS ── */
function switchTab(t) {
  ['login','register'].forEach(x => {
    document.getElementById('tab-'+(x==='login'?'login':'reg')).classList.toggle('active', x===t);
    document.getElementById('panel-'+x).classList.toggle('active', x===t);
  });
  showMsg('','');
}

/* ── MSG ── */
function showMsg(text, type) {
  const el = document.getElementById('msg');
  if (!text) { el.style.display='none'; return; }
  el.innerHTML = text;
  el.className = type === 'ok' ? 'msg-ok' : 'msg-err';
  el.style.display = 'block';
}

function setLoading(btnId, loading, label) {
  const b = document.getElementById(btnId);
  b.disabled = loading;
  b.innerHTML = loading ? `<span class="spinner"></span>Procesando...` : label;
}

/* ── FIREBASE ERROR MESSAGES ── */
function firebaseErr(code) {
  const map = {
    'auth/user-not-found':       'No existe una cuenta con ese correo.',
    'auth/wrong-password':       'Contraseña incorrecta. Inténtalo de nuevo.',
    'auth/invalid-credential':   'Correo o contraseña incorrectos.',
    'auth/email-already-in-use': 'Ya existe una cuenta con ese correo.',
    'auth/weak-password':        'La contraseña debe tener al menos 6 caracteres.',
    'auth/invalid-email':        'El correo no tiene un formato válido.',
    'auth/popup-blocked':        'El navegador bloqueó el popup. Permite popups para este sitio.',
    'auth/popup-closed-by-user': 'Cerraste la ventana de Google. Inténtalo de nuevo.',
    'auth/unauthorized-domain':  '⚠️ Dominio no autorizado en Firebase. Ve a Firebase Console → Authentication → Settings → Authorized domains y añade: kevinruizbolsota-svg.github.io',
  };
  return map[code] || `Error: ${code}`;
}

/* ── LOGIN EMAIL ── */
async function doLogin() {
  const email = document.getElementById('lEmail').value.trim();
  const pass  = document.getElementById('lPass').value;
  if (!email || !pass) { showMsg('Completa todos los campos.', 'err'); return; }

  setLoading('btnLogin', true, 'Iniciar Sesión');
  try {
    const cred = await auth.signInWithEmailAndPassword(email, pass);
    showMsg('✦ Acceso concedido. Redirigiendo...', 'ok');
    setTimeout(() => goHome(cred.user), 800);
  } catch(e) {
    showMsg(firebaseErr(e.code), 'err');
  }
  setLoading('btnLogin', false, 'Iniciar Sesión');
}

/* ── REGISTER ── */
async function doRegister() {
  const name  = document.getElementById('rName').value.trim();
  const email = document.getElementById('rEmail').value.trim();
  const pass  = document.getElementById('rPass').value;
  if (!name || !email || !pass) { showMsg('Completa todos los campos.', 'err'); return; }

  setLoading('btnReg', true, 'Crear Cuenta');
  try {
    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    await cred.user.updateProfile({ displayName: name });
    showMsg('✦ Cuenta creada. Bienvenido a ORIONIX.', 'ok');
    setTimeout(() => goHome(cred.user), 900);
  } catch(e) {
    showMsg(firebaseErr(e.code), 'err');
  }
  setLoading('btnReg', false, 'Crear Cuenta');
}

/* ── GOOGLE ── */
async function doGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  try {
    const cred = await auth.signInWithPopup(provider);
    showMsg('✦ Acceso con Google concedido. Redirigiendo...', 'ok');
    setTimeout(() => goHome(cred.user), 800);
  } catch(e) {
    showMsg(firebaseErr(e.code), 'err');
  }
}
</script>
</body>
</html>
