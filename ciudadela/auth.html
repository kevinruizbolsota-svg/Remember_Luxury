<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ORIONIX · Acceso</title>
<link rel="icon" href="https://raw.githubusercontent.com/kevinruizbolsota-svg/Remember_Luxury/main/ciudadela/unnamed.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070a;--bg2:#0d0d12;--gold:#e8c86a;--light:#f5e0a0;--text:#f0e8d0;--muted:#7a7060;--border:rgba(232,200,106,.16)}*{box-sizing:border-box;margin:0}body{min-height:100vh;background:radial-gradient(circle at 30% 30%,#151522 0,#07070a 55%,#030307 100%);color:var(--text);font-family:'Cormorant Garamond',serif;display:grid;place-items:center;overflow:auto}body:before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle at 20% 30%,rgba(232,200,106,.18) 0 1px,transparent 1px),radial-gradient(circle at 75% 20%,rgba(255,255,255,.18) 0 1px,transparent 1px),radial-gradient(circle at 55% 75%,rgba(255,255,255,.1) 0 1px,transparent 1px);background-size:180px 180px,240px 240px,320px 320px;opacity:.35;pointer-events:none}.wrap{width:min(920px,92vw);display:grid;grid-template-columns:1fr 1fr;background:rgba(13,13,18,.9);border:1px solid var(--border);box-shadow:0 30px 100px rgba(0,0,0,.55);backdrop-filter:blur(18px);border-radius:18px;overflow:hidden}.hero{min-height:620px;padding:58px 42px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border-right:1px solid var(--border);background:radial-gradient(circle at 50% 42%,rgba(232,200,106,.08),transparent 58%)}.eye{width:120px;height:120px;margin-bottom:26px;filter:drop-shadow(0 0 28px rgba(232,200,106,.2))}.eye svg{width:100%;height:100%}.brand{font-family:Cinzel,serif;font-size:clamp(2rem,5vw,4rem);letter-spacing:.22em;font-weight:900;background:linear-gradient(120deg,#8a6a24,#e8c86a,#fff5c8,#e8c86a,#8a6a24);background-size:240%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s linear infinite}.sub{margin-top:10px;font-family:Cinzel,serif;letter-spacing:.32em;color:rgba(245,224,160,.72);font-size:.82rem}.tag{margin-top:30px;max-width:360px;color:rgba(240,232,208,.55);line-height:1.7;font-size:1rem;font-style:italic}.form{padding:54px 44px;display:flex;align-items:center}.card{width:100%;max-width:360px;margin:auto}.title{font-family:Cinzel,serif;font-size:1rem;letter-spacing:.22em;text-transform:uppercase;color:var(--light)}.desc{margin:8px 0 26px;color:var(--muted);font-size:.92rem}.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:26px}.tab{flex:1;padding:11px 8px;text-align:center;font-family:Cinzel,serif;font-size:.5rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}.tab.active{color:var(--gold);border-color:var(--gold)}.panel{display:none}.panel.active{display:block}.field{margin-bottom:18px}.field label{display:block;font-family:Cinzel,serif;font-size:.46rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}.field input{width:100%;padding:13px 14px;background:rgba(255,255,255,.035);border:1px solid var(--border);border-radius:9px;color:var(--text);font:1rem 'Cormorant Garamond',serif;outline:none}.field input:focus{border-color:rgba(232,200,106,.5);box-shadow:0 0 0 2px rgba(232,200,106,.06)}button.primary{width:100%;padding:14px;border:0;border-radius:9px;background:linear-gradient(135deg,#b58c31,#e8c86a,#fff1b6);color:#07070a;font-family:Cinzel,serif;font-size:.56rem;letter-spacing:.18em;font-weight:900;cursor:pointer;box-shadow:0 8px 24px rgba(232,200,106,.15)}button.primary:disabled{opacity:.5;cursor:wait}.msg{display:none;margin-top:16px;padding:11px 13px;border-left:2px solid var(--gold);background:rgba(232,200,106,.05);font-size:.78rem;color:var(--gold)}.msg.show{display:block}.footer{margin-top:24px;text-align:center;font-size:.72rem;color:rgba(122,112,96,.55)}.footer a{color:var(--gold);text-decoration:none}@keyframes shine{to{background-position:240% center}}@media(max-width:760px){.wrap{grid-template-columns:1fr}.hero{min-height:auto;padding:42px 24px;border-right:0;border-bottom:1px solid var(--border)}.form{padding:36px 24px}.eye{width:88px;height:88px}.brand{font-size:2.2rem}.sub{font-size:.68rem;letter-spacing:.22em}.tag{margin-top:18px;font-size:.92rem}}
</style>
</head>
<body>
<div class="wrap"><section class="hero"><div class="eye"><svg viewBox="0 0 120 120" fill="none"><ellipse cx="60" cy="60" rx="48" ry="30" stroke="#e8c86a" stroke-width="1.4"/><ellipse cx="60" cy="60" rx="22" ry="22" stroke="#f5e0a0"/><circle cx="60" cy="60" r="7" fill="#fff5c8"/><path d="M60 5v16M60 99v16M5 60h16M99 60h16" stroke="#e8c86a" opacity=".55"/><circle cx="91" cy="36" r="2.2" fill="#e8c86a"/><circle cx="29" cy="84" r="2.2" fill="#e8c86a"/></svg></div><div class="brand">ORIONIX</div><div class="sub">EL UNIVERSO DE KRC</div><p class="tag">Entra, descubre y encuentra tu próximo mundo.</p></section><section class="form"><div class="card"><div class="title">Acceso al Universo</div><div class="desc">Después de entrar irás directamente a la tienda.</div><div class="tabs"><div class="tab active" data-tab="login">Iniciar sesión</div><div class="tab" data-tab="register">Crear cuenta</div><div class="tab" data-tab="guest">Visitante</div></div><div id="login" class="panel active"><div class="field"><label>Correo electrónico</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Contraseña</label><input id="pass" type="password" autocomplete="current-password"></div><button id="loginBtn" class="primary">ENTRAR A LA TIENDA</button></div><div id="register" class="panel"><div class="field"><label>Nombre</label><input id="name" type="text" autocomplete="name"></div><div class="field"><label>Correo electrónico</label><input id="rEmail" type="email" autocomplete="email"></div><div class="field"><label>Contraseña</label><input id="rPass" type="password" autocomplete="new-password"></div><button id="registerBtn" class="primary">CREAR CUENTA Y ENTRAR</button></div><div id="guest" class="panel"><div class="field"><label>Nombre</label><input id="gName" type="text" placeholder="Visitante"></div><button id="guestBtn" class="primary">ENTRAR COMO VISITANTE</button></div><div id="msg" class="msg"></div><div class="footer"><a href="index.html">Volver a Orionix</a> · <a href="tienda.html">Continuar sin cuenta</a></div></div></section></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script>
const CFG={apiKey:'AIzaSyDZoywcYKSBrAk_iwSMN4rnw7goLSltj7A',authDomain:'las-cronicas-de-krc.firebaseapp.com',projectId:'las-cronicas-de-krc',storageBucket:'las-cronicas-de-krc.firebasestorage.app',messagingSenderId:'636206734640',appId:'1:636206734640:web:40c52672294155c6d77cf5'};firebase.initializeApp(CFG);const auth=firebase.auth();
const tabs=document.querySelectorAll('.tab');tabs.forEach(t=>t.onclick=()=>{tabs.forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.getElementById(t.dataset.tab).classList.add('active');msg('')});
function msg(t){const el=document.getElementById('msg');el.textContent=t;el.classList.toggle('show',!!t)}function go(user,role='usuario'){localStorage.setItem('orionix_sesion',JSON.stringify({uid:user?.uid||null,email:user?.email||null,nombre:user?.displayName||document.getElementById('name')?.value||'Visitante',rol:role,ts:Date.now()}));msg('✦ Acceso concedido. Entrando a la tienda…');setTimeout(()=>location.href='tienda.html',500)}
document.getElementById('loginBtn').onclick=async()=>{const b=document.getElementById('loginBtn');const email=document.getElementById('email').value.trim(),pass=document.getElementById('pass').value;if(!email||!pass)return msg('Completa correo y contraseña.');b.disabled=true;try{const c=await auth.signInWithEmailAndPassword(email,pass);go(c.user)}catch(e){msg(e.code==='auth/invalid-credential'?'Correo o contraseña incorrectos.':'No se pudo iniciar sesión.');b.disabled=false}};
document.getElementById('registerBtn').onclick=async()=>{const b=document.getElementById('registerBtn');const name=document.getElementById('name').value.trim(),email=document.getElementById('rEmail').value.trim(),pass=document.getElementById('rPass').value;if(!name||!email||pass.length<6)return msg('Completa los datos y usa una contraseña de mínimo 6 caracteres.');b.disabled=true;try{const c=await auth.createUserWithEmailAndPassword(email,pass);await c.user.updateProfile({displayName:name});go(c.user)}catch(e){msg('No se pudo crear la cuenta.');b.disabled=false}};
document.getElementById('guestBtn').onclick=()=>{ const n = document.getElementById('gName').value.trim() || 'Visitante'; go({uid:'guest_'+Date.now(), email:'guest@orionix.luxury', displayName:n}, 'visitante'); };
auth.onAuthStateChanged(user=>{if(user&&!location.search.includes('force=1')){/* no redirect automático: evita bucles/blank pages */}});
</script>
</body></html>
