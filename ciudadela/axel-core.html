<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AXEL — Core Conversacional</title>
<style>
:root{--bg:#07080d;--panel:#101722;--line:#2b3850;--gold:#e8c86a;--text:#edf1f7;--muted:#8994aa;--ok:#65e6a0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#1b2945,#07080d 52%);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:1050px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{font-weight:900;letter-spacing:5px}.brand span{color:var(--gold)}.status{color:var(--ok);border:1px solid #31553f;border-radius:99px;padding:7px 12px;font-size:11px}.panel{background:linear-gradient(180deg,#111722,#0d1119);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 18px 60px #0008}.head{padding:15px 17px;border-bottom:1px solid var(--line);font-weight:800}.chat{height:760px;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:18px}.msg{max-width:84%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;margin-bottom:11px;white-space:pre-wrap;overflow-wrap:anywhere;background:#121824}.msg.axel{border-color:#5b4d29;background:#17150f}.who{font-size:10px;color:var(--gold);letter-spacing:1px;font-weight:900;margin-bottom:5px}.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}textarea{flex:1;height:58px;resize:none;background:#080b11;border:1px solid var(--line);border-radius:10px;color:#fff;padding:13px;outline:0}textarea:focus{border-color:var(--gold)}button{border:1px solid var(--gold);background:#17130a;color:var(--gold);border-radius:10px;padding:0 18px;cursor:pointer;font-weight:800}button:disabled{opacity:.45}.meta{padding:0 13px 9px;color:var(--muted);font-size:10px}.typing{color:var(--gold);font-size:12px}.chips{padding:10px 12px;display:flex;gap:7px;flex-wrap:wrap;border-top:1px solid var(--line)}.chip{padding:7px 10px;border:1px solid var(--line);border-radius:99px;color:var(--muted);cursor:pointer}.chip:hover{color:var(--text);border-color:var(--gold)}
</style></head>
<body><div class="app"><header class="top"><div class="brand">AX<span>EL</span> · CORE</div><div class="status">● CONVERSACIÓN ACTIVA</div></header>
<section class="panel chat"><div class="head">AXEL <span style="color:var(--muted);font-weight:400">· canal principal</span></div><div id="messages" class="messages"></div><div id="meta" class="meta">Contexto local activo · memoria persistente en este navegador</div><div class="chips"><span class="chip" data-p="¿Qué recuerdas de nuestro proyecto?">Proyecto</span><span class="chip" data-p="Ayúdame a mejorar la tienda">Tienda</span><span class="chip" data-p="¿Qué podemos construir ahora?">Siguiente paso</span><span class="chip" data-p="Recuerda que quiero que AXEL sea más natural">Guardar recuerdo</span></div><div class="composer"><textarea id="input" placeholder="Habla con AXEL…"></textarea><button id="send">ENVIAR</button></div></section></div>
<script>
(()=>{
const $=s=>document.querySelector(s);const box=$('#messages');const input=$('#input');const send=$('#send');
let history=JSON.parse(localStorage.getItem('axelHistory')||'[]');let memories=JSON.parse(localStorage.getItem('axelMem')||'[]');let busy=false;
function save(){localStorage.setItem('axelHistory',JSON.stringify(history.slice(-24)));localStorage.setItem('axelMem',JSON.stringify(memories.slice(-50)))}
function add(role,text){const d=document.createElement('div');d.className='msg '+(role==='AXEL'?'axel':'');const w=document.createElement('div');w.className='who';w.textContent=role;const b=document.createElement('div');b.textContent=text;d.append(w,b);box.appendChild(d);box.scrollTop=box.scrollHeight}
function seed(){if(history.length){history.forEach(x=>add(x.role,x.text));return}add('AXEL','Hola, parce. Soy AXEL. Ya estoy aquí. Puedo conversar contigo, mantener contexto local y ayudarte a convertir ideas en acciones.\n\nNo voy a fingir que tengo acceso a algo que todavía no está conectado: si una capacidad no está disponible, te lo voy a decir.');history=[{role:'AXEL',text:'Hola, parce. Soy AXEL.'}];save()}
function context(){let recent=history.slice(-8).map(x=>x.role+': '+x.text).join('\n');let mem=memories.length?'Recuerdos: '+memories.slice(-8).join(' | '):'Sin recuerdos guardados.';return {recent,mem}}
function answer(q){const t=q.toLowerCase().trim();const c=context();
if(/^(hola|holi|hey|hello)\b/.test(t))return 'Hola, parce 😎. Estoy contigo. Cuéntame qué quieres hacer y lo aterrizamos juntos.';
if(t.includes('qué recuerdas')||t.includes('que recuerdas')||t.includes('recuerdas de'))return memories.length?'Sí. Tengo estos recuerdos locales: '+memories.slice(-6).join(' · ')+'. Además, conservo los últimos mensajes de esta conversación en este navegador.':'Todavía no has guardado recuerdos explícitos. Sí conservo el contexto reciente de esta conversación en este navegador.';
if(t.startsWith('recuerda')||t.startsWith('recuerda que')){let m=q.replace(/^recuerda(?: que)?/i,'').trim();if(m){memories.push(m);save();return 'Listo. Lo guardé como recuerdo local: “'+m+'”. A partir de ahora lo tendré en cuenta en esta conversación.'}return 'Claro. Dime exactamente qué quieres que recuerde.'}
if(t.includes('tienda')||t.includes('checkout'))return 'Sí. La tienda es una de las piezas principales de Remember Luxury. Si quieres mejorarla, puedo ayudarte a definir el flujo completo: producto → carrito → checkout → confirmación. Y si algo todavía no está conectado a AWIN, prefiero decirlo antes que inventar datos.';
if(t.includes('guardian')||t.includes('seguridad'))return 'Guardian debe funcionar como una capa de protección, no como un adorno visual. La regla correcta es: diagnosticar primero, registrar lo ocurrido y exigir permiso explícito para acciones sensibles.';
if(t.includes('axel')&&(t.includes('quién')||t.includes('que eres')||t.includes('qué eres')))return 'Soy el núcleo conversacional del Workbench. Mi objetivo es entender lo que quieres, conservar contexto y ayudarte a convertirlo en trabajo concreto. Este modo todavía usa un motor local; la conexión a un modelo remoto será el siguiente salto.';
if(t.includes('fase'))return 'Estamos en FASE 3/5 — Construcción. El foco actual es convertir AXEL de una interfaz con respuestas prefijadas en un núcleo conversacional con contexto y memoria.';
if(t.includes('siguiente')||t.includes('ahora')||t.includes('qué hacemos'))return 'Yo haría el siguiente bloque así: 1) conversación natural, 2) memoria contextual, 3) conexión a un modelo real, y 4) herramientas para que AXEL pueda actuar con permisos. Así no construimos otra maqueta aislada.';
if(t.includes('gracias'))return 'De una, parce. Seguimos. 🔥';
if(t.includes('?'))return 'Sí, te sigo. Por el contexto que tengo, puedo ayudarte a resolverlo paso a paso. Si la pregunta depende de datos que todavía no están conectados, te lo voy a marcar claramente en vez de inventar una respuesta.';
return 'Entiendo la idea. Por ahora puedo razonar sobre el contexto que tenemos en esta conversación y ayudarte a convertirlo en una acción concreta. Si quieres que AXEL tenga conocimiento externo y respuestas generativas completas, el siguiente paso es conectar este núcleo a un modelo de IA real.'}
async function sendMessage(){if(busy)return;let q=input.value.trim();if(!q)return;busy=true;send.disabled=true;input.value='';add('TÚ',q);history.push({role:'TÚ',text:q});save();$('#meta').innerHTML='<span class="typing">AXEL está pensando…</span>';await new Promise(r=>setTimeout(r,350));let a=answer(q);add('AXEL',a);history.push({role:'AXEL',text:a});save();$('#meta').textContent='Contexto local activo · '+history.length+' mensajes · '+memories.length+' recuerdos';busy=false;send.disabled=false;input.focus()}
send.addEventListener('click',sendMessage);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{input.value=c.dataset.p;input.focus()});seed();input.focus();
})();
</script></body></html>
