<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AXEL · IMÁGENES</title><style>body{margin:0;background:radial-gradient(circle at 50% 0,#241d3c,#050507 60%);color:#f5f2ea;font-family:Inter,system-ui;padding:28px}.wrap{max-width:900px;margin:auto}.gold{color:#e8cf86;letter-spacing:4px;font-size:11px}.panel{margin-top:20px;padding:20px;border:1px solid #ffffff18;border-radius:20px;background:#ffffff06;backdrop-filter:blur(20px)}textarea{width:100%;min-height:130px;background:#08090e;color:#fff;border:1px solid #ffffff18;border-radius:12px;padding:14px;box-sizing:border-box;font:inherit}.row{display:flex;gap:10px;margin-top:12px}.btn{flex:1;padding:13px;border-radius:12px;border:1px solid #e8cf8650;background:#e8cf8612;color:#e8cf86;font-weight:800;cursor:pointer}.btn:hover{filter:brightness(1.2)}#result{margin-top:18px;text-align:center}.result{max-width:100%;border-radius:16px;border:1px solid #ffffff18}.mut{color:#999;line-height:1.5}.diag{font-size:12px;color:#999;margin-top:12px;white-space:pre-wrap}@media(max-width:600px){.row{flex-direction:column}}</style></head><body><div class="wrap"><div class="gold">ORIONIX · AXEL</div><h1>AXEL IMÁGENES</h1><p class="mut">Modo creativo conectado al backend real de AXEL. Prueba los motores configurados en Supabase y usa automáticamente el primero que responda.</p><div class="panel"><textarea id="prompt" placeholder="Describe la imagen que quieres crear..."></textarea><div class="row"><button class="btn" id="create">✦ CREAR IMAGEN</button><button class="btn" id="diag">⚡ PROBAR MOTORES</button></div><div id="diagOut" class="diag">Sin diagnóstico todavía.</div><div id="result"></div></div><p><a href="axel-studio.html" style="color:#e8cf86">← Volver a AXEL STUDIO</a></p></div><script>const API='https://bedixienygfeqtadzeng.supabase.co/functions/v1/axel-ai',prompt=document.querySelector('#prompt'),result=document.querySelector('#result'),diagOut=document.querySelector('#diagOut');async function call(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(body),cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.message||j.error||`HTTP ${r.status}`);return j}diag.onclick=async()=>{diagOut.textContent='Probando FAL → OpenAI Image...';try{const j=await call({action:'test_image_keys'});diagOut.textContent=(j.results||[]).map(x=>`${x.provider} · ${x.slot||'—'} · ${x.model||'—'} · ${x.state}${x.detail?' · '+x.detail:''}`).join('\n')||'Sin proveedores configurados.'}catch(e){diagOut.textContent='ERROR: '+e.message}};create.onclick=async()=>{const p=prompt.value.trim();if(!p){prompt.focus();return}create.disabled=true;create.textContent='CREANDO...';result.innerHTML='<p class="mut">AXEL está creando tu imagen...</p>';try{const j=await call({action:'generate_image',prompt:p,image_size:'square_hd',size:'1024x1024',quality:'low'});if(!j.imageUrl)throw Error('El motor respondió sin URL de imagen.');result.innerHTML=`<img class="result" src="${j.imageUrl}" alt="Imagen generada por AXEL"><p class="mut">${j.provider} · ${j.model}</p>`}catch(e){result.innerHTML=`<p style="color:#ff8080">${e.message}</p>`}finally{create.disabled=false;create.textContent='✦ CREAR IMAGEN'}};</script></body></html>
