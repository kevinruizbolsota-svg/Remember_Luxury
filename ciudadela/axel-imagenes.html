<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AXEL IMÁGENES · ORIONIX</title><style>body{margin:0;background:#05060b;color:#f5f2ea;font:15px system-ui;min-height:100vh}main{max-width:900px;margin:auto;padding:50px 20px}h1{font-size:60px;color:#e8cf86}.panel{background:#0c0e18;border:1px solid #ffffff18;border-radius:18px;padding:20px}textarea{width:100%;min-height:120px;background:#07080d;color:#fff;border:1px solid #ffffff18;border-radius:12px;padding:12px;box-sizing:border-box}button{margin-top:10px;padding:12px 16px;border-radius:10px;border:1px solid #e8cf86;color:#e8cf86;background:#e8cf8612;cursor:pointer}#status{color:#9fa2b1;margin:12px 0}.diag{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{padding:12px;border:1px solid #ffffff16;border-radius:10px}.ok{color:#79e2ac}.bad{color:#ff8080}.shot{margin-top:15px}.shot img{width:100%;border-radius:12px}@media(max-width:600px){h1{font-size:40px}.diag{grid-template-columns:1fr}}</style></head><body><main><p style="color:#e8cf86;letter-spacing:4px">ORIONIX · AXEL VISUAL INTELLIGENCE</p><h1>AXEL IMÁGENES</h1><div class="panel"><textarea id="prompt" placeholder="Describe la imagen que quieres crear..."></textarea><br><button id="generate">✦ CREAR IMAGEN</button> <button id="diagnose">⚡ PROBAR MOTORES</button><div id="status">Probando disponibilidad...</div></div><div class="panel" style="margin-top:15px"><h3>DIAGNÓSTICO</h3><div class="diag" id="diag"></div></div><div class="panel" style="margin-top:15px"><h3>RESULTADO</h3><div id="result">Aquí aparecerá la imagen.</div></div><p><a style="color:#e8cf86" href="axel-studio.html">← Volver a AXEL STUDIO</a></p></main><script>const API='https://bedixienygfeqtadzeng.supabase.co/functions/v1/axel-image',q=s=>document.querySelector(s);async function call(b){let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b),cache:'no-store'}),t=await r.text(),j={};try{j=JSON.parse(t)}catch{}if(!r.ok)throw Error(j.message||j.error||t);return j}function show(j){q('#diag').innerHTML=(j.results||[]).map(x=>`<div class="item"><b>${x.provider}</b><br>${x.slot||'—'} · ${x.model||'—'}<br><span class="${x.state==='OK'?'ok':'bad'}">${x.state}</span><br><small>${x.detail||''}</small></div>`).join('')}async function diag(){q('#status').textContent='Probando primero FAL y luego OpenAI...';try{let j=await call({action:'diagnostics'});show(j);let x=(j.results||[]).find(x=>x.state==='OK');q('#status').textContent=x?'✓ Motor disponible: '+x.provider+' · '+x.model:'No hay motor visual disponible.'}catch(e){q('#status').textContent='Error: '+e.message}}async function gen(){let p=q('#prompt').value.trim();if(!p)return;q('#generate').disabled=true;q('#status').textContent='AXEL está creando...';try{let j=await call({action:'generate',prompt:p});if(!j.ok)throw Error('No hay proveedor de imágenes disponible.');q('#result').innerHTML=`<div class="shot"><img src="${j.url}" alt="Imagen creada por AXEL"><small>${j.provider} · ${j.model}</small></div>`;q('#status').textContent='✓ Imagen creada por '+j.provider}catch(e){q('#status').textContent=e.message}finally{q('#generate').disabled=false}}q('#diagnose').onclick=diag;q('#generate').onclick=gen;diag();</script></body></html>
