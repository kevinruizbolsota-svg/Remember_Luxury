<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXEL STUDIO · GENERADOR DE IMÁGENES</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #07070a; --gold: #e8c86a; --purple: #7b2fbe; --text: #e9ddc4; --border: rgba(232, 200, 106, 0.2); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Cormorant Garamond', serif; min-height: 100vh; display: flex; flex-direction: column; }
  header { padding: 20px 40px; border-bottom: 1px solid var(--border); background: rgba(5,5,10,0.9); display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-family: 'Cinzel', serif; color: var(--gold); font-size: 1.5rem; letter-spacing: 4px; }
  .chat-box { flex: 1; max-width: 900px; width: 100%; margin: 0 auto; padding: 30px 20px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
  .msg { padding: 15px 20px; border-radius: 8px; max-width: 85%; line-height: 1.6; }
  .msg.user { align-self: flex-end; background: rgba(232,200,106,0.15); border: 1px solid var(--gold); }
  .msg.axel { align-self: flex-start; background: rgba(123,47,190,0.15); border: 1px solid var(--purple); }
  .msg img { width: 100%; max-width: 500px; border-radius: 8px; margin-top: 10px; border: 1px solid var(--gold); }
  .input-area { padding: 20px; border-top: 1px solid var(--border); background: rgba(5,5,10,0.95); display: flex; gap: 15px; max-width: 900px; margin: 0 auto; width: 100%; }
  input { flex: 1; padding: 12px; background: rgba(0,0,0,0.6); border: 1px solid var(--border); color: var(--text); font-family: inherit; font-size: 1rem; border-radius: 4px; }
  button { padding: 12px 25px; background: var(--gold); color: var(--bg); border: none; font-family: 'Cinzel', serif; font-weight: bold; cursor: pointer; border-radius: 4px; }
</style>
</head>
<body>

<header>
  <h1>🔮 AXEL STUDIO</h1>
  <div style="font-family:'Cinzel'; font-size:0.8rem; color:var(--gold);">MODO IMAGEN ACTIVO</div>
</header>

<div class="chat-box" id="chat">
  <div class="msg axel">
    <strong>AXEL:</strong> Hola mi amor. Estoy listo para crear las imágenes que quieras. Escribe lo que te imaginas abajo (ej: <em>"Un león de oro en un universo cósmico"</em>).
  </div>
</div>

<div class="input-area">
  <input type="text" id="prompt" placeholder="Describe la imagen que quieres generar..." onkeypress="if(event.key==='Enter') generarImagen()">
  <button onclick="generarImagen()">CREAR 🎨</button>
</div>

<script>
  async function generarImagen() {
    const input = document.getElementById('prompt');
    const text = input.value.trim();
    if(!text) return;

    const chat = document.getElementById('chat');
    chat.innerHTML += `<div class="msg user"><strong>TÚ:</strong> Crea una imagen de: ${text}</div>`;
    input.value = '';

    const tempId = 'temp-' + Date.now();
    chat.innerHTML += `<div class="msg axel" id="${tempId}"><strong>AXEL:</strong> 🎨 Generando tu imagen con FAL AI... (si falla, pasaré automáticamente a Pollinations)...</div>`;
    chat.scrollTop = chat.scrollHeight;

    try {
      // 1️⃣ INTENTO 1: FAL AI (vía Backend de Supabase con FAL_API_KEY_6)
      const resFAL = await fetch('https://bedixienygfeqtadzeng.supabase.co/functions/v1/axel-image', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: text, key_name: 'FAL_API_KEY_6' })
      });
      
      const dataFAL = await resFAL.json();

      if(resFAL.ok && dataFAL.image_url) {
        document.getElementById(tempId).innerHTML = `<strong>AXEL:</strong> ¡Aquí tienes tu imagen (Motor FAL AI)! ✨<br><img src="${dataFAL.image_url}" alt="Imagen Generada">`;
        return;
      }
      
      throw new Error("FAL no respondió o sin saldo, pasando a Pollinations...");

    } catch(err) {
      console.log(err.message);
      document.getElementById(tempId).innerHTML = `<strong>AXEL:</strong> ⚡ Motor FAL en reserva. Generando imagen con Pollinations AI...`;

      // 2️⃣ INTENTO 2: POLLINATIONS (FALLBACK DIRECTO E INMORTAL)
      const encodedPrompt = encodeURIComponent(text + ", ultra realistic, 8k, cosmic luxury aesthetic");
      const pollinationUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=1024&height=1024&nologo=true&seed=${Math.floor(Math.random()*10000)}`;

      setTimeout(() => {
        document.getElementById(tempId).innerHTML = `<strong>AXEL:</strong> ¡Aquí tienes tu imagen! ✨<br><img src="${pollinationUrl}" alt="Imagen Generada">`;
        chat.scrollTop = chat.scrollHeight;
      }, 1000);
    }
  }
</script>
</body>
</html>
