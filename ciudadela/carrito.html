<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Remember Luxury — Tu selección</title><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet"><style>:root{--bg:#070708;--gold:#e7c76a;--soft:#f5e8c2;--muted:#9d978b;--line:rgba(231,199,106,.16)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#211d12,#070708 55%);color:var(--soft);font-family:'Cormorant Garamond',serif;min-height:100vh}header{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5vw;background:rgba(7,7,8,.86);backdrop-filter:blur(18px);position:sticky;top:0;z-index:5}.brand{font:800 14px Cinzel;letter-spacing:.22em;color:var(--gold)}header a{color:var(--muted);font:600 10px Cinzel;letter-spacing:.15em;text-decoration:none;text-transform:uppercase}.wrap{max-width:1100px;margin:auto;padding:70px 24px}.ey{font:600 10px Cinzel;letter-spacing:.32em;color:var(--gold)}h1{font:400 clamp(44px,7vw,76px);line-height:.95;margin:12px 0 40px}.empty,.item{background:rgba(16,15,18,.9);border:1px solid var(--line);padding:28px}.empty{text-align:center;color:var(--muted);font-size:18px}.item{display:grid;grid-template-columns:120px 1fr auto;gap:24px;align-items:center}.thumb{width:120px;height:140px;background:linear-gradient(145deg,#181714,#090909);border:1px solid var(--line);display:grid;place-items:center;font:9px Cinzel;color:var(--muted);text-align:center}.name{font-size:28px}.meta{color:var(--muted);font-size:16px;margin-top:6px}.price{font:600 16px Cinzel;color:var(--soft);margin-top:12px}.cta{display:inline-block;margin-top:26px;padding:16px 26px;background:linear-gradient(100deg,#cda949,#f1d47c,#c29c3d);color:#080706;text-decoration:none;font:700 10px Cinzel;letter-spacing:.18em;text-transform:uppercase}.remove{background:none;border:0;color:#7f786c;font:10px Cinzel;letter-spacing:.12em;cursor:pointer;margin-top:14px}@media(max-width:700px){.item{grid-template-columns:80px 1fr}.thumb{width:80px;height:100px}.item>div:last-child{grid-column:1/-1}.name{font-size:23px}}</style></head><body><header><div class="brand">REMEMBER LUXURY</div><a href="articulos.html">← Continuar descubriendo</a></header><main class="wrap"><div class="ey">CURATED SELECTION</div><h1>Tu selección.</h1><div id="list"></div></main><script>const list=document.getElementById('list');let cart=[];try{cart=JSON.parse(localStorage.getItem('orx_cart')||localStorage.getItem('cart')||'[]')}catch(e){}function render(){if(!Array.isArray(cart)||!cart.length){list.innerHTML='<div class="empty">Tu selección está esperando una pieza especial.<br><a class="cta" href="articulos.html">Explorar la colección →</a></div>';return}list.innerHTML=cart.map((p,i)=>{const id=p.id||p.sku||i;const name=p.name||p.nombre||p.title||'Pieza seleccionada';const price=p.price??p.precio??'';const merchant=p.merchant||p.tienda||p.store||'Proveedor';const u=p.affiliate_url||p.affiliateUrl||p.url||p.link||'';const qs=new URLSearchParams({name,merchant,price:String(price),affiliate_url:u});return `<article class="item"><div class="thumb">REMEMBER<br>LUXURY</div><div><div class="name">${esc(name)}</div><div class="meta">${esc(merchant)}</div><div class="price">${esc(String(price))}</div><button class="remove" onclick="removeItem(${i})">RETIRAR PIEZA</button></div><div><a class="cta" href="pago-premium.html?${qs.toString()}">Revisar compra →</a></div></article>`}).join('')}function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c))}function removeItem(i){cart.splice(i,1);localStorage.setItem('orx_cart',JSON.stringify(cart));render()}render();</script></body></html>
