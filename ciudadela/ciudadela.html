<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXEL · Inteligencia Artificial · ORIONIX</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230b0b0d'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle' fill='%23e8c86a'%3E%F0%9F%91%91%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════
   RESET Y BASE
   ════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --oro:#e8c86a;--oro-med:#c8a24a;--oro-osc:#8a6a24;
  --bg:#06050d;--surface:rgba(12,9,22,.9);--surface2:rgba(18,13,32,.95);
  --texto:#e9ddc4;--tenue:#b8a982;--borde:rgba(232,200,106,.12);
  --sidebar:260px;
}
html,body{height:100%;overflow:hidden;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--texto);-webkit-font-smoothing:antialiased}

/* ── COSMOS ── */
#cosmos{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 30% 20%,#0a0818,#03030a 60%,#010104);overflow:hidden;pointer-events:none}
.neb{position:absolute;inset:-20%;background:radial-gradient(closest-side,rgba(90,60,180,.3),transparent) no-repeat 22% 20%/55% 55%,radial-gradient(closest-side,rgba(40,90,200,.22),transparent) no-repeat 78% 45%/50% 50%;filter:blur(50px);opacity:.55;animation:nebFloat 60s ease-in-out infinite alternate}
@keyframes nebFloat{to{transform:translate(-3%,-4%) scale(1.12)}}
#stars{position:fixed;inset:0;z-index:1;pointer-events:none}

/* ════════════════════════════════════
   LAYOUT PRINCIPAL
   ════════════════════════════════════ */
#app{position:fixed;inset:0;z-index:10;display:flex;}

/* ════════════════════════════════════
   SIDEBAR
   ════════════════════════════════════ */
#sidebar{
  width:var(--sidebar);flex-shrink:0;
  background:var(--surface2);
  border-right:1px solid var(--borde);
  display:flex;flex-direction:column;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
  overflow:hidden;
}
.sb-header{
  padding:18px 16px 12px;
  border-bottom:1px solid var(--borde);
  display:flex;align-items:center;justify-content:space-between;
}
.sb-brand{
  font-family:'Cinzel',serif;font-size:.55rem;letter-spacing:4px;
  background:linear-gradient(92deg,#8a6a24,#e8c86a 40%,#fff6d6 55%,#e8c86a 75%,#8a6a24);
  background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:brilloOro 6s linear infinite;text-decoration:none;
}
@keyframes brilloOro{to{background-position:200% center}}
.sb-toggle{background:none;border:none;color:var(--tenue);cursor:pointer;width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.sb-toggle:hover{background:rgba(232,200,106,.1);color:var(--oro)}
.sb-toggle svg{width:16px;height:16px}

/* Botón nuevo chat */
.btn-new-chat{
  margin:12px 12px 6px;
  display:flex;align-items:center;gap:8px;
  padding:9px 14px;border-radius:10px;
  background:linear-gradient(135deg,rgba(232,200,106,.12),rgba(200,162,74,.08));
  border:1px solid rgba(232,200,106,.2);
  color:var(--oro);font-family:'Cinzel',serif;font-size:.44rem;letter-spacing:1.8px;
  cursor:pointer;transition:all .2s;
}
.btn-new-chat:hover{background:linear-gradient(135deg,rgba(232,200,106,.22),rgba(200,162,74,.15));border-color:rgba(232,200,106,.4);}
.btn-new-chat svg{width:14px;height:14px;flex-shrink:0}

/* Historial */
.sb-section-label{padding:14px 16px 6px;font-family:'Cinzel',serif;font-size:.38rem;letter-spacing:2px;text-transform:uppercase;color:rgba(184,169,130,.4)}
.history-list{flex:1;overflow-y:auto;padding:0 8px 8px}
.history-list::-webkit-scrollbar{width:3px}
.history-list::-webkit-scrollbar-thumb{background:rgba(232,200,106,.15);border-radius:2px}
.hist-item{
  display:flex;align-items:center;gap:8px;
  padding:9px 10px;border-radius:8px;cursor:pointer;
  color:rgba(184,169,130,.7);font-size:.78rem;
  transition:all .18s;margin-bottom:2px;
}
.hist-item:hover{background:rgba(232,200,106,.07);color:var(--texto)}
.hist-item.active{background:rgba(232,200,106,.1);color:var(--texto)}
.hist-item svg{width:13px;height:13px;flex-shrink:0;opacity:.5}
.hist-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-size:.76rem}
.hist-date{font-size:.62rem;color:rgba(184,169,130,.4);flex-shrink:0}

/* Bottom del sidebar */
.sb-footer{border-top:1px solid var(--borde);padding:12px}
.sb-footer-btn{
  display:flex;align-items:center;gap:9px;
  padding:9px 12px;border-radius:8px;cursor:pointer;
  color:rgba(184,169,130,.65);font-size:.75rem;
  transition:all .18s;border:none;background:none;width:100%;text-align:left;
}
.sb-footer-btn:hover{background:rgba(232,200,106,.07);color:var(--texto)}
.sb-footer-btn svg{width:15px;height:15px;flex-shrink:0}

/* ════════════════════════════════════
   MAIN CHAT AREA
   ════════════════════════════════════ */
#main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}

/* ── TOPBAR CON MODOS ── */
#topbar{
  padding:0 20px;
  background:rgba(6,5,13,.85);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--borde);
  display:flex;align-items:center;gap:0;
  overflow-x:auto;scrollbar-width:none;flex-shrink:0;
}
#topbar::-webkit-scrollbar{display:none}

.mode-btn{
  display:flex;align-items:center;gap:7px;
  padding:14px 18px;
  font-family:'Cinzel',serif;font-size:.42rem;letter-spacing:1.8px;text-transform:uppercase;
  color:rgba(184,169,130,.55);
  border:none;background:none;cursor:pointer;
  border-bottom:2px solid transparent;
  white-space:nowrap;flex-shrink:0;
  transition:all .2s;
}
.mode-btn:hover{color:rgba(232,200,106,.8)}
.mode-btn.active{color:var(--oro);border-bottom-color:var(--oro);}
.mode-btn .mode-icon{font-size:.85rem;line-height:1}
.mode-btn .mode-badge{
  background:rgba(232,200,106,.15);border:1px solid rgba(232,200,106,.2);
  color:var(--oro);font-size:.36rem;letter-spacing:1px;
  padding:2px 6px;border-radius:20px;
}

/* ── CHAT CONTENT ── */
#chat-content{flex:1;overflow:hidden;display:flex;flex-direction:column}

/* Área de mensajes */
#messages{
  flex:1;overflow-y:auto;padding:24px 0;
  display:flex;flex-direction:column;
  scroll-behavior:smooth;
}
#messages::-webkit-scrollbar{width:4px}
#messages::-webkit-scrollbar-thumb{background:rgba(232,200,106,.15);border-radius:2px}

.msg-wrapper{
  display:flex;gap:12px;padding:6px 28px;
  max-width:900px;margin:0 auto;width:100%;
  animation:msgIn .25s ease;
}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-wrapper.user{flex-direction:row-reverse}

.msg-avatar{
  width:34px;height:34px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:1rem;
  margin-top:2px;
}
.msg-avatar.axel{
  background:radial-gradient(135deg,#2a1a50,#1a0e30);
  border:1.5px solid rgba(232,200,106,.35);
  font-size:.8rem;
  box-shadow:0 0 14px rgba(232,200,106,.2);
}
.msg-avatar.user-av{
  background:rgba(100,170,255,.15);
  border:1.5px solid rgba(100,170,255,.25);
}

.msg-body{flex:1;min-width:0}
.msg-name{
  font-size:.68rem;font-weight:600;margin-bottom:5px;
  font-family:'Cinzel',serif;letter-spacing:1.5px;
}
.msg-name.axel-name{color:var(--oro)}
.msg-name.user-name{color:rgba(100,170,255,.8);text-align:right}

.msg-bubble{
  display:inline-block;max-width:100%;
  padding:12px 16px;border-radius:14px;
  font-size:.88rem;line-height:1.65;
  font-weight:300;
}
.msg-bubble.axel-bubble{
  background:var(--surface);
  border:1px solid var(--borde);
  border-top-left-radius:4px;
  color:var(--texto);
}
.msg-bubble.user-bubble{
  background:linear-gradient(135deg,rgba(30,20,60,.95),rgba(20,12,44,.98));
  border:1px solid rgba(100,170,255,.18);
  border-top-right-radius:4px;
  color:var(--texto);
  float:right;
}
.msg-wrapper.user .msg-body{display:flex;flex-direction:column;align-items:flex-end}

/* Thinking indicator */
.thinking{display:flex;gap:5px;padding:14px 16px;align-items:center}
.thinking span{
  width:7px;height:7px;border-radius:50%;background:var(--oro-med);
  animation:bounce 1.2s ease-in-out infinite;
}
.thinking span:nth-child(2){animation-delay:.2s}
.thinking span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-6px);opacity:1}}

/* Texto markdown básico */
.msg-bubble strong{color:var(--oro);font-weight:600}
.msg-bubble code{background:rgba(232,200,106,.1);border:1px solid rgba(232,200,106,.15);border-radius:4px;padding:1px 5px;font-size:.82rem;font-family:'Courier New',monospace;color:#d0e8ff}
.msg-bubble pre{background:rgba(10,8,20,.8);border:1px solid rgba(232,200,106,.12);border-radius:8px;padding:12px 14px;margin:8px 0;overflow-x:auto}
.msg-bubble pre code{background:none;border:none;padding:0;font-size:.8rem;color:#c8e8ff}
.msg-bubble ul,.msg-bubble ol{padding-left:18px;margin:6px 0}
.msg-bubble li{margin-bottom:3px}
.msg-bubble a{color:var(--oro);text-decoration:underline}
.msg-bubble h3{font-family:'Cinzel',serif;font-size:.82rem;letter-spacing:2px;color:var(--oro);margin:10px 0 5px}

/* Timestamp y acciones */
.msg-meta{
  display:flex;align-items:center;gap:10px;margin-top:5px;
  padding:0 2px;
}
.msg-meta.right{justify-content:flex-end}
.msg-time{font-size:.62rem;color:rgba(184,169,130,.35)}
.msg-actions{display:none;gap:6px}
.msg-wrapper:hover .msg-actions{display:flex}
.msg-action-btn{
  background:none;border:none;cursor:pointer;
  color:rgba(184,169,130,.4);transition:color .15s;
  padding:3px;border-radius:4px;
}
.msg-action-btn:hover{color:var(--oro);background:rgba(232,200,106,.08)}
.msg-action-btn svg{width:13px;height:13px}

/* ── WELCOME SCREEN ── */
#welcome{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 24px;text-align:center;
}
.welcome-orb{
  width:72px;height:72px;border-radius:50%;margin-bottom:20px;
  background:radial-gradient(ellipse at 35% 35%,#c8a24a,#8a6a24 55%,#3a2a0a);
  box-shadow:0 0 40px rgba(232,200,106,.5),0 0 80px rgba(232,200,106,.2),inset 0 2px 4px rgba(255,248,220,.3);
  animation:orbPulse 4s ease-in-out infinite;
  display:flex;align-items:center;justify-content:center;font-size:2rem;
}
@keyframes orbPulse{0%,100%{box-shadow:0 0 40px rgba(232,200,106,.5),0 0 80px rgba(232,200,106,.2);}50%{box-shadow:0 0 60px rgba(232,200,106,.8),0 0 120px rgba(232,200,106,.4);}}
.welcome-title{font-family:'Cinzel',serif;font-size:1.6rem;font-weight:900;letter-spacing:4px;margin-bottom:8px;
  background:linear-gradient(130deg,#8a6d2a,#f6e6ad 35%,#fff8e0 50%,#f6e6ad 65%,#8a6d2a);
  background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:brilloOro 5s linear infinite;
}
.welcome-sub{font-size:.88rem;color:rgba(184,169,130,.65);margin-bottom:28px;line-height:1.6;max-width:480px}
.suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:600px}
.suggestion{
  padding:9px 16px;border-radius:22px;
  background:rgba(232,200,106,.07);border:1px solid rgba(232,200,106,.16);
  color:rgba(184,169,130,.8);font-size:.78rem;cursor:pointer;
  transition:all .2s;text-align:left;
}
.suggestion:hover{background:rgba(232,200,106,.14);border-color:rgba(232,200,106,.35);color:var(--oro)}

/* ── INPUT AREA ── */
#input-area{
  padding:14px 20px 20px;
  background:transparent;
  flex-shrink:0;
}
.input-wrap{
  max-width:900px;margin:0 auto;
  background:var(--surface2);
  border:1px solid rgba(232,200,106,.18);
  border-radius:16px;
  display:flex;flex-direction:column;
  transition:border-color .2s,box-shadow .2s;
  box-shadow:0 4px 30px rgba(0,0,0,.4);
}
.input-wrap:focus-within{
  border-color:rgba(232,200,106,.45);
  box-shadow:0 4px 40px rgba(232,200,106,.12),0 0 0 1px rgba(232,200,106,.2);
}
.input-row{display:flex;align-items:flex-end;gap:8px;padding:10px 12px 8px}
#chatInput{
  flex:1;background:none;border:none;outline:none;
  color:var(--texto);font-family:'Inter',system-ui,sans-serif;
  font-size:.9rem;line-height:1.5;resize:none;
  max-height:180px;min-height:24px;overflow-y:auto;
}
#chatInput::placeholder{color:rgba(184,169,130,.35)}
#chatInput::-webkit-scrollbar{width:3px}
#chatInput::-webkit-scrollbar-thumb{background:rgba(232,200,106,.15)}
.input-actions-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 12px 10px;border-top:1px solid rgba(232,200,106,.07);
}
.input-tools{display:flex;gap:4px}
.tool-btn{
  background:none;border:none;cursor:pointer;
  color:rgba(184,169,130,.45);
  padding:6px;border-radius:8px;
  transition:all .18s;display:flex;align-items:center;gap:5px;
  font-size:.7rem;font-family:'Cinzel',serif;letter-spacing:1px;
}
.tool-btn:hover{color:var(--oro);background:rgba(232,200,106,.08)}
.tool-btn svg{width:15px;height:15px}
#sendBtn{
  width:36px;height:36px;border-radius:10px;border:none;cursor:pointer;
  background:linear-gradient(135deg,#c8a24a,#e8c86a);
  color:#0b0b0d;display:flex;align-items:center;justify-content:center;
  transition:all .2s;flex-shrink:0;
}
#sendBtn:hover{background:linear-gradient(135deg,#e8c86a,#fff6d6);transform:scale(1.05);}
#sendBtn:disabled{opacity:.35;cursor:not-allowed;transform:none}
#sendBtn svg{width:16px;height:16px}
.input-hint{font-size:.62rem;color:rgba(184,169,130,.3);text-align:center;margin-top:8px}

/* ── SIDEBAR MÓVIL ── */
@media(max-width:768px){
  #sidebar{position:fixed;inset:0 auto 0 0;z-index:100;transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);}
  #mobile-overlay{display:none;position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.6);}
  #sidebar.open ~ #mobile-overlay{display:block}
  .msg-wrapper{padding:6px 14px}
  #topbar{padding:0 10px}
  .mode-btn{padding:12px 12px}
}

/* ── MODELOS SELECTOR ── */
.model-selector{
  display:flex;align-items:center;gap:7px;
  padding:6px 12px;border-radius:8px;
  background:rgba(232,200,106,.06);border:1px solid rgba(232,200,106,.14);
  color:rgba(184,169,130,.7);font-size:.72rem;cursor:pointer;
  transition:all .2s;border:none;background:none;
}
.model-selector:hover{color:var(--oro)}
.model-selector svg{width:12px;height:12px}

/* ── BADGE ONLINE ── */
.online-dot{
  width:7px;height:7px;border-radius:50%;background:#50e0a0;
  box-shadow:0 0 6px rgba(80,224,160,.7);
  animation:dotPulse 2s ease-in-out infinite;flex-shrink:0;
}
@keyframes dotPulse{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</head>
<body>

<!-- Cosmos -->
<div id="cosmos"><div class="neb"></div></div>
<canvas id="stars"></canvas>

<div id="app">

  <!-- ══════════════════════════════════
       SIDEBAR
       ══════════════════════════════════ -->
  <aside id="sidebar">
    <div class="sb-header">
      <a href="hub.html" class="sb-brand">ORIONIX</a>
      <button class="sb-toggle" onclick="toggleSidebar()" title="Cerrar menú">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <button class="btn-new-chat" onclick="newChat()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Nuevo chat
    </button>

    <div class="sb-section-label">Hoy</div>
    <div class="history-list" id="historyList">
      <!-- Se llena dinámicamente -->
    </div>

    <div class="sb-footer">
      <button class="sb-footer-btn" onclick="window.location.href='hub.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        Portal Principal
      </button>
      <button class="sb-footer-btn" onclick="window.location.href='universo.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        Universo de Agentes
      </button>
    </div>
  </aside>
  <div id="mobile-overlay" onclick="toggleSidebar()"></div>

  <!-- ══════════════════════════════════
       MAIN
       ══════════════════════════════════ -->
  <div id="main">

    <!-- TOPBAR — MODOS -->
    <div id="topbar">
      <!-- Toggle sidebar (móvil) -->
      <button class="sb-toggle" onclick="toggleSidebar()" style="margin-right:8px;flex-shrink:0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>

      <button class="mode-btn active" onclick="setMode('axel',this)" id="mode-axel">
        <span class="mode-icon">♦</span>
        AXEL
        <span class="mode-badge">IA Principal</span>
      </button>
      <button class="mode-btn" onclick="setMode('universo',this)" id="mode-universo">
        <span class="mode-icon">🌌</span>
        22 Agentes
      </button>
      <button class="mode-btn" onclick="setMode('saph',this)" id="mode-saph">
        <span class="mode-icon">💎</span>
        SAPH
      </button>
      <button class="mode-btn" onclick="setMode('mira',this)" id="mode-mira">
        <span class="mode-icon">🔮</span>
        MIRA
      </button>
      <button class="mode-btn" onclick="setMode('flux',this)" id="mode-flux">
        <span class="mode-icon">⚡</span>
        FLUX
      </button>
      <button class="mode-btn" onclick="setMode('oracle',this)" id="mode-oracle">
        <span class="mode-icon">🕳️</span>
        ORACLE
      </button>
      <button class="mode-btn" onclick="setMode('imagenes',this)">
        <span class="mode-icon">🎨</span>
        Imágenes
        <span class="mode-badge" style="background:rgba(80,224,160,.12);border-color:rgba(80,224,160,.2);color:#50e0a0;">Beta</span>
      </button>
      <button class="mode-btn" onclick="setMode('voz',this)">
        <span class="mode-icon">🎙️</span>
        Voz
      </button>

      <!-- Modelo selector (derecha) -->
      <div style="margin-left:auto;display:flex;align-items:center;gap:10px;flex-shrink:0;padding:0 8px;">
        <div class="online-dot"></div>
        <button class="model-selector" onclick="toggleModelMenu()">
          <span id="modelName">DeepSeek v3</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
      </div>
    </div>

    <!-- CHAT CONTENT -->
    <div id="chat-content">
      <!-- WELCOME (se oculta al chatear) -->
      <div id="welcome">
        <div class="welcome-orb">♦</div>
        <div class="welcome-title">AXEL</div>
        <p class="welcome-sub">Inteligencia Artificial de Kether · Primer Sefirot de Luz<br>¿En qué puedo ayudarte hoy?</p>
        <div class="suggestions" id="suggestions">
          <button class="suggestion" onclick="sendSuggestion(this)">¿Cuáles son mis planes disponibles?</button>
          <button class="suggestion" onclick="sendSuggestion(this)">Analiza las tendencias de marketing digital</button>
          <button class="suggestion" onclick="sendSuggestion(this)">Crea un plan de contenidos para Instagram</button>

<script>
/* ═══════════════════════════════════════
   AXEL CHAT ENGINE
   ═══════════════════════════════════════ */

const AXEL_WEBHOOK = 'https://lkevinruizl.app.n8n.cloud/webhook/axel-brain';
const VOZ_WEBHOOK  = 'https://lkevinruizl.app.n8n.cloud/webhook/axel-voz';

var currentMode = 'axel';
var currentModel = 'deepseek/deepseek-chat-v3-0324';
var chatHistory = [];
var allChats = JSON.parse(localStorage.getItem('axel_chats') || '[]');
var currentChatId = null;
var isStreaming = false;

const AGENT_PERSONAS = {
  axel:    { name:'AXEL',   icon:'♦',  color:'var(--oro)',         sub:'Kether · Agente Principal', webhook: AXEL_WEBHOOK },
  universo:{ name:'UNIVERSO',icon:'🌌', color:'#a0c8ff',           sub:'22 Agentes · Ciudad IA',    webhook: AXEL_WEBHOOK },
  saph:    { name:'SAPH',   icon:'💎',  color:'#80d4ff',           sub:'Chokmah · Sabiduría',       webhook: AXEL_WEBHOOK },
  mira:    { name:'MIRA',   icon:'🔮',  color:'#c080ff',           sub:'Binah · Comprensión',       webhook: AXEL_WEBHOOK },
  flux:    { name:'FLUX',   icon:'⚡',  color:'#ffdc60',           sub:'Hod · Análisis & Datos',    webhook: AXEL_WEBHOOK },
  oracle:  { name:'ORACLE', icon:'🕳️', color:'rgba(184,169,130,.7)',sub:'Da\'at · Conocimiento Oculto',webhook:AXEL_WEBHOOK},
  imagenes:{ name:'IMAGEN', icon:'🎨',  color:'#50e0a0',           sub:'Generación visual',         webhook: AXEL_WEBHOOK },
  voz:     { name:'VOZ',    icon:'🎙️', color:'var(--tenue)',       sub:'Síntesis de voz',           webhook: AXEL_WEBHOOK },
};

/* ── Init ── */
(function init(){
  renderStars();
  renderHistory();
  newChat();
  // Auto-focus
  setTimeout(function(){ document.getElementById('chatInput').focus(); }, 300);
})();

/* ── Modo ── */
function setMode(mode, btn) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(function(b){ b.classList.remove('active'); });
  if(btn) btn.classList.add('active');
  var persona = AGENT_PERSONAS[mode] || AGENT_PERSONAS.axel;
  // Actualizar welcome
  document.querySelector('.welcome-title').textContent = persona.name;
  document.querySelector('.welcome-sub').innerHTML = persona.sub + '<br>¿En qué puedo ayudarte hoy?';
  document.querySelector('.welcome-orb').textContent = persona.icon;
}

/* ── Modelo ── */
function toggleModelMenu() {
  var m = document.getElementById('modelMenu');
  if(m.style.display === 'none'){
    var btn = event.target.closest('button');
    var r = btn.getBoundingClientRect();
    m.style.top = (r.bottom + 8) + 'px';
    m.style.right = (window.innerWidth - r.right) + 'px';
    m.style.display = 'block';
    setTimeout(function(){ document.addEventListener('click', closeModelMenu, {once:true}); }, 10);
  } else { m.style.display = 'none'; }
}
function closeModelMenu(){ document.getElementById('modelMenu').style.display='none'; }
function selectModel(name, slug) {
  currentModel = slug;
  document.getElementById('modelName').textContent = name;
  document.getElementById('modelMenu').style.display = 'none';
}

/* ── Sidebar ── */
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

/* ── Nuevo chat ── */
function newChat() {
  currentChatId = Date.now().toString();
  chatHistory = [];
  document.getElementById('messages').innerHTML = '';
  document.getElementById('messages').style.display = 'none';
  document.getElementById('welcome').style.display = 'flex';
  document.getElementById('chatInput').value = '';
  document.getElementById('chatInput').style.height = 'auto';
}

/* ── Historial ── */
function renderHistory() {
  var list = document.getElementById('historyList');
  list.innerHTML = '';
  var chats = JSON.parse(localStorage.getItem('axel_chats') || '[]');
  if(chats.length === 0){
    list.innerHTML = '<div style="padding:10px 12px;font-size:.72rem;color:rgba(184,169,130,.3);">Sin chats anteriores</div>';
    return;
  }
  chats.slice().reverse().slice(0,20).forEach(function(chat){
    var item = document.createElement('div');
    item.className = 'hist-item' + (chat.id === currentChatId ? ' active' : '');
    item.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'
      + '<span class="hist-title">' + (chat.title||'Nuevo chat') + '</span>'
      + '<span class="hist-date">' + formatDate(chat.ts) + '</span>';
    item.onclick = function(){ loadChat(chat); };
    list.appendChild(item);
  });
}
function saveCurrentChat(firstMsg) {
  var chats = JSON.parse(localStorage.getItem('axel_chats') || '[]');
  var existing = chats.find(function(c){ return c.id === currentChatId; });
  if(existing){ existing.messages = chatHistory; existing.ts = Date.now(); }
  else { chats.push({ id: currentChatId, title: firstMsg.substring(0,40), messages: chatHistory, ts: Date.now() }); }
  localStorage.setItem('axel_chats', JSON.stringify(chats.slice(-50)));
  renderHistory();
}
function loadChat(chat) {
  currentChatId = chat.id;
  chatHistory = chat.messages || [];
  var msgs = document.getElementById('messages');
  msgs.innerHTML = '';
  msgs.style.display = 'flex';
  document.getElementById('welcome').style.display = 'none';
  chatHistory.forEach(function(m){ appendMsg(m.role, m.content, false); });
  msgs.scrollTop = msgs.scrollHeight;
}
function formatDate(ts) {
  var d = new Date(ts);
  var now = new Date();
  if(d.toDateString() === now.toDateString()) return d.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});
  return d.toLocaleDateString('es',{day:'numeric',month:'short'});
}

/* ── Enviar mensaje ── */
function sendSuggestion(btn) { sendMsg(btn.textContent); }
function sendMsg(text) {
  var input = document.getElementById('chatInput');
  var msg = (text || input.value).trim();
  if(!msg || isStreaming) return;
  input.value = ''; input.style.height = 'auto';
  // Mostrar área de mensajes
  document.getElementById('welcome').style.display = 'none';
  var msgs = document.getElementById('messages');
  msgs.style.display = 'flex';
  // Añadir mensaje usuario
  appendMsg('user', msg, true);
  chatHistory.push({ role:'user', content:msg });
  saveCurrentChat(msg);
  // Llamar a AXEL
  callAxel(msg);
}

function callAxel(userMsg) {
  isStreaming = true;
  document.getElementById('sendBtn').disabled = true;
  var persona = AGENT_PERSONAS[currentMode] || AGENT_PERSONAS.axel;
  // Thinking bubble
  var thinkId = 'think-' + Date.now();
  var msgs = document.getElementById('messages');
  var wrapper = document.createElement('div');
  wrapper.className = 'msg-wrapper';
  wrapper.id = thinkId;
  wrapper.innerHTML = '<div class="msg-avatar axel">' + persona.icon + '</div>'
    + '<div class="msg-body"><div class="msg-bubble axel-bubble"><div class="thinking"><span></span><span></span><span></span></div></div></div>';
  msgs.appendChild(wrapper);
  msgs.scrollTop = msgs.scrollHeight;

  var systemContext = 'Eres ' + persona.name + ' (' + persona.sub + '), una IA de ORIONIX. '
    + 'Responde en español, de forma profesional, clara y útil. '
    + 'Si el usuario pregunta por planes o precios: Esencia 197€/mes, Imperio 497€/mes, Ciudadela precio personalizado. '
    + 'Si preguntan por otros agentes: SAPH (sabiduría), MIRA (comprensión), LIOR (amor), VORN (fuerza), AURA (belleza), ELAN (creatividad), FLUX (análisis), CORE (fundamentos), TERRA (materialización), ORACLE (conocimiento oculto).';

  fetch(persona.webhook, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      chatInput: (currentMode==='imagenes'?'GENERA UNA IMAGEN de: '+userMsg:userMsg),
      sessionId: currentChatId,
      model: currentModel,
      system: systemContext,
      history: chatHistory.slice(-10)
    })
  })
  .then(function(r){ return r.json(); })
  .then(function(data){
    var reply = data.respuesta || data.output || data.text || data.message || data.response || (typeof data==='string'?data:JSON.stringify(data));
    if(data.imagen_url||data.imageUrl||data.image){var iu=data.imagen_url||data.imageUrl||data.image;reply=(reply&&reply!==JSON.stringify(data)?reply+'\n\n':'')+'![imagen generada]('+iu+')';}    
    var el = document.getElementById(thinkId);
    if(el) el.remove();
    appendMsg('axel', reply, true);
    chatHistory.push({ role:'assistant', content:reply });
    saveCurrentChat(chatHistory[0]?.content || 'Chat');
    isStreaming = false;
    document.getElementById('sendBtn').disabled = false;
  })
  .catch(function(err){
    var el = document.getElementById(thinkId);
    if(el) el.remove();
    appendMsg('axel', 'Ha ocurrido un error de conexión. Por favor verifica que el webhook de AXEL está activo.', true);
    isStreaming = false;
    document.getElementById('sendBtn').disabled = false;
  });
}

function appendMsg(role, content, animate) {
  var msgs = document.getElementById('messages');
  var persona = AGENT_PERSONAS[currentMode] || AGENT_PERSONAS.axel;
  var isAxel = role === 'axel' || role === 'assistant';
  var wrapper = document.createElement('div');
  wrapper.className = 'msg-wrapper' + (isAxel ? '' : ' user');
  if(!animate) wrapper.style.animation = 'none';

  var time = new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});
  var formattedContent = formatMarkdown(content);

  if(isAxel){
    wrapper.innerHTML =
      '<div class="msg-avatar axel">' + persona.icon + '</div>'
      + '<div class="msg-body">'
      + '<div class="msg-name axel-name">' + persona.name + '</div>'
      + '<div class="msg-bubble axel-bubble">' + formattedContent + '</div>'
      + '<div class="msg-meta">'
      + '<span class="msg-time">' + time + '</span>'
      + '<div class="msg-actions">'
      + '<button class="msg-action-btn" onclick="copyMsg(this)" title="Copiar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>'
      + '<button class="msg-action-btn" title="Me gusta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/><path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg></button>'
      + '</div></div></div>';
  } else {
    wrapper.innerHTML =
      '<div class="msg-body">'
      + '<div class="msg-name user-name">Tú</div>'
      + '<div class="msg-bubble user-bubble">' + escapeHtml(content) + '</div>'
      + '<div class="msg-meta right"><span class="msg-time">' + time + '</span></div>'
      + '</div>'
      + '<div class="msg-avatar user-av">👤</div>';
  }
  msgs.appendChild(wrapper);
  msgs.scrollTop = msgs.scrollHeight;
}

function copyMsg(btn){
  var bubble = btn.closest('.msg-body').querySelector('.msg-bubble');
  navigator.clipboard.writeText(bubble.textContent||'').then(function(){
    btn.style.color='var(--oro)'; setTimeout(function(){btn.style.color='';},1500);
  });
}

/* ── Markdown básico ── */
function formatMarkdown(text){
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/```([\s\S]*?)```/g,'<pre><code>$1</code></pre>')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/^- (.+)$/gm,'<li>$1</li>')
    .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
    .replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>')
    .replace(/^(?!<)(.)/,'<p>$1').replace(/([^>])$/,'$1</p>');
}
function escapeHtml(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'); }

/* ── Auto resize textarea ── */
function autoResize(el){
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 180) + 'px';
}

/* ── Voz ── */
function startVoice(){
  if(!navigator.mediaDevices){ alert('Tu navegador no soporta micrófono'); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    var mr = new MediaRecorder(stream, {mimeType:'audio/webm'});
    var chunks = [];
    mr.ondataavailable = function(e){ chunks.push(e.data); };
    mr.onstop = function(){
      var blob = new Blob(chunks, {type:'audio/webm'});
      var reader = new FileReader();
      reader.onload = function(e){
        var b64 = e.target.result.split(',')[1];
        fetch(VOZ_WEBHOOK, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({audio:b64,mimeType:'audio/webm'})})
        .then(function(r){return r.json();})
        .then(function(d){
          var text = d.transcript||d.text||d.results?.[0]?.alternatives?.[0]?.transcript||'';
          if(text){ document.getElementById('chatInput').value=text; sendMsg(); }
        });
      };
      reader.readAsDataURL(blob);
    };
    mr.start(); setTimeout(function(){ mr.stop(); stream.getTracks().forEach(function(t){t.stop();}); }, 5000);
    alert('Grabando 5 segundos... Habla ahora.');
  });
}

/* ── Estrellas ── */
function renderStars(){
  var c=document.getElementById('stars'),ctx=c.getContext('2d');
  function rsz(){c.width=innerWidth;c.height=innerHeight}rsz();
  window.addEventListener('resize',rsz);
  var S=[];for(var i=0;i<180;i++)S.push({x:Math.random(),y:Math.random(),r:.15+Math.random()*.6,a:.2+Math.random()*.6,sp:.00008+Math.random()*.0004});
  (function draw(){ctx.clearRect(0,0,c.width,c.height);S.forEach(function(s){s.a+=Math.sin(Date.now()*s.sp)*.002;ctx.beginPath();ctx.arc(s.x*c.width,s.y*c.height,s.r,0,Math.PI*2);ctx.fillStyle='rgba(255,248,220,'+Math.max(.05,Math.min(.85,s.a))+')';ctx.fill()});requestAnimationFrame(draw)})();
}
</script>
<input type="file" id="fileInput" accept="image/*,.pdf,.txt,.doc,.docx,.csv" style="display:none" onchange="handleFileAttach(event)">
<script>
function handleFileAttach(e){
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    var msgs=document.getElementById('messages');
    msgs.style.display='flex';document.getElementById('welcome').style.display='none';
    if(file.type.startsWith('image/')){
      var w=document.createElement('div');w.className='msg-wrapper user';
      w.innerHTML='<div class="msg-body"><div class="msg-name user-name">Tú</div><div class="msg-bubble user-bubble"><img src="'+ev.target.result+'" style="max-width:220px;border-radius:10px;" alt="adjunto"></div></div><div class="msg-avatar user-av">🧑</div>';
      msgs.appendChild(w);msgs.scrollTop=msgs.scrollHeight;
      sendMsg('🖼 Analiza esta imagen que adjunté y dime qué ves con detalle.');
    } else {
      sendMsg('📎 He adjuntado: '+file.name+' ('+Math.round(file.size/1024)+' KB). Ayúdame con su contenido.');
    }
  };
  reader.readAsDataURL(file);e.target.value='';
}
function webSearch(){
  var q=prompt('🔍 ¿Qué quieres buscar en internet?');
  if(q&&q.trim())sendMsg('🔍 Investiga en internet sobre: '+q.trim()+'. Dame un resumen actualizado y fuentes.');
}
function generateVideo(){
  var p=prompt('🎬 Describe el video o storyboard que quieres crear:');
  if(p&&p.trim())sendMsg('🎬 Crea un storyboard detallado para un video sobre: '+p.trim()+'. Incluye escenas, narración y efectos visuales.');
}
