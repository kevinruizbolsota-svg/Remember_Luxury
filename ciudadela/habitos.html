<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hábitos Diarios de Kevin Ruiz</title>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #05060f;
            color: #fff;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #0a0d1c;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }
        .titulo {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 4px;
            color: #d4af37;
        }
        .subtitulo {
            text-align: center;
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #9aa0b5;
            margin: 0 0 20px;
        }
        .firma {
            text-align: center;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid rgba(212,175,55,.25);
            font-size: 13px;
            color: #7d8296;
        }
        .firma b { color: #d4af37; font-weight: 600; }
        .lista-habitos {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .lista-habitos li {
            margin-bottom: 10px;
        }
        .casilla {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            border: 1px solid #fff;
            border-radius: 50%;
            cursor: pointer;
        }
        .casilla:checked {
            background-color: #d4af37;
            border-color: #d4af37;
        }
        .barra-progreso {
            width: 100%;
            height: 10px;
            background-color: #333;
            border-radius: 10px;
            margin: 20px 0;
        }
        .progreso {
            height: 10px;
            background-color: #d4af37;
            border-radius: 10px;
        }
        .racha {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .boton-volver {
            background-color: #d4af37;
            color: #000;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }
        .boton-volver:hover {
            background-color: #c7a537;
        }
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
<!-- ORIONIX NAV UNIVERSAL -->
<style>
#onav{position:fixed;top:0;left:0;width:100%;z-index:9999;display:flex;justify-content:space-between;align-items:center;padding:10px 5vw;background:rgba(11,11,13,.95);border-bottom:1px solid rgba(232,200,106,.2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-family:'Cinzel',serif;}
#onav .on-m{font-size:.68rem;font-weight:600;letter-spacing:4px;text-decoration:none;background:linear-gradient(92deg,#8a6a24,#e8c86a 40%,#fff6d6 60%,#e8c86a 80%,#8a6a24);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:onBrillo 6s linear infinite;flex-shrink:0;}
@keyframes onBrillo{to{background-position:200% center}}
#onav .on-l{display:flex;align-items:center;gap:0;flex-wrap:nowrap;}
#onav .on-l a{color:#b8a982;text-decoration:none;margin-left:14px;font-size:.46rem;letter-spacing:1.4px;text-transform:uppercase;transition:color .2s;white-space:nowrap;font-family:'Cinzel',serif;}
#onav .on-l a:hover{color:#e8c86a;}
#onav .on-sp{width:1px;height:12px;background:rgba(232,200,106,.22);margin-left:14px;}
#onav .on-l a.on-a{color:#e8c86a!important;font-weight:600;border:1px solid rgba(232,200,106,.32);border-radius:5px;padding:4px 10px;margin-left:7px;transition:background .2s,box-shadow .2s;}
#onav .on-l a.on-a:hover{background:rgba(232,200,106,.12);box-shadow:0 0 10px rgba(232,200,106,.2);}
@media(max-width:780px){#onav .on-l a:not(.on-a){display:none;}}
</style>
<div id="onav">
  <a class="on-m" href="https://kevinruizbolsota-svg.github.io/Remember_Luxury/ciudadela/">ORIONIX</a>
  <div class="on-l">
    <a href="hub.html">Hub</a>
    <a href="ciudadela.html">Ciudadela</a>
    <a href="hogar.html">Hogar</a>
    <a href="forjadora.html">Forjadora</a>
    <div class="on-sp"></div>
    <a href="axel.html" class="on-a">AXEL</a>
    <a href="tienda.html" class="on-a">Tienda</a>
  </div>
</div>


    <div class="container">
        <h1 class="titulo">Hábitos Diarios del Forjador</h1>
        <p class="subtitulo">de Kevin Ruiz</p>
        <ul class="lista-habitos">
            <li>
                <input type="checkbox" id="habito1" class="casilla">
                <label for="habito1">Ejercicio físico</label>
            </li>
            <li>
                <input type="checkbox" id="habito2" class="casilla">
                <label for="habito2">Meditación</label>
            </li>
            <li>
                <input type="checkbox" id="habito3" class="casilla">
                <label for="habito3">Lectura</label>
            </li>
            <li>
                <input type="checkbox" id="habito4" class="casilla">
                <label for="habito4">Aprendizaje de un nuevo skill</label>
            </li>
            <li>
                <input type="checkbox" id="habito5" class="casilla">
                <label for="habito5">Escribir en un diario</label>
            </li>
        </ul>
        <div class="barra-progreso">
            <div class="progreso" id="progreso"></div>
        </div>
        <p class="racha" id="racha">Racha: 0 días</p>
        <button class="boton-volver" onclick="volverAlInicio()">Volver al inicio</button>
        <p class="firma">Creado por <b>Kevin Ruiz</b> · ORIONIX</p>
    </div>
    <script>
        let habitos = [
            { id: "habito1", nombre: "Ejercicio físico", completado: false },
            { id: "habito2", nombre: "Meditación", completado: false },
            { id: "habito3", nombre: "Lectura", completado: false },
            { id: "habito4", nombre: "Aprendizaje de un nuevo skill", completado: false },
            { id: "habito5", nombre: "Escribir en un diario", completado: false }
        ];
        let racha = 0;
        let progreso = 0;
        let fechaActual = new Date();
        let fechaUltimoRegistro = localStorage.getItem("fechaUltimoRegistro");
        let habitosCompletados = localStorage.getItem("habitosCompletados");
        if (fechaUltimoRegistro && habitosCompletados) {
            if (fechaUltimoRegistro !== fechaActual.toISOString().split("T")[0]) {
                racha = 0;
                habitos.forEach(habito => {
                    habito.completado = false;
                });
            } else {
                racha = parseInt(localStorage.getItem("racha"));
                habitosCompletados = JSON.parse(habitosCompletados);
                habitos.forEach(habito => {
                    habito.completado = habitosCompletados[habito.id];
                });
            }
        }
        habitos.forEach(habito => {
            let casilla = document.getElementById(habito.id);
            casilla.addEventListener("change", () => {
                habito.completado = casilla.checked;
                calcularProgreso();
                calcularRacha();
                guardarDatos();
            });
            if (habito.completado) {
                casilla.checked = true;
            }
        });
        function calcularProgreso() {
            progreso = 0;
            habitos.forEach(habito => {
                if (habito.completado) {
                    progreso++;
                }
            });
            document.getElementById("progreso").style.width = (progreso / habitos.length) * 100 + "%";
        }
        function calcularRacha() {
            if (progreso === habitos.length) {
                racha++;
            } else {
                racha = 0;
            }
            document.getElementById("racha").textContent = `Racha: ${racha} días`;
            localStorage.setItem("racha", racha);
        }
        function guardarDatos() {
            localStorage.setItem("fechaUltimoRegistro", fechaActual.toISOString().split("T")[0]);
            let habitosCompletados = {};
            habitos.forEach(habito => {
                habitosCompletados[habito.id] = habito.completado;
            });
            localStorage.setItem("habitosCompletados", JSON.stringify(habitosCompletados));
        }
        function volverAlInicio() {
            window.location.href = "index.html";
        }
        calcularProgreso();
        calcularRacha();
    </script>
</body>
</html>
