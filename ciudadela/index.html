<!DOCTYPE html><html><head><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>REMEMBER LUXURY</title><style>body {background-color: #111; font-family: serif;} #titulo {color: #ffd700; font-size: 60px; text-align: center; font-weight: bold; text-shadow: 2px 2px 5px #b8860b;} #subtitulo {color: #ffd700; font-size: 30px; text-align: center; font-weight: bold; text-shadow: 2px 2px 5px #b8860b;} .tarjeta {background-color: #b8860b; border: 1px solid #ffd700; border-radius: 10px; box-shadow: 2px 2px 10px #333; padding: 20px; width: 50%; margin: 40px auto; transition: transform 0.5s;} .tarjeta:hover {transform: rotateX(10deg);} #borrar-historial {background-color: #b8860b; border: 1px solid #ffd700; border-radius: 10px; box-shadow: 2px 2px 10px #333; padding: 10px 20px; font-size: 20px; font-weight: bold; color: #ffd700; cursor: pointer; transition: transform 0.5s;} #borrar-historial:hover {transform: rotateX(10deg);} #borrar-historial:active {transform: rotateX(5deg);}</style></head><body><h1 id="titulo">REMEMBER LUXURY</h1><h2 id="subtitulo">La Ciudadela</h2><div class="tarjeta"><p>Bienvenido a Remember Luxury, la ciudadela del lujo y la elegancia.</p></div><button id="borrar-historial" onclick="if (confirm('¿Estás seguro de borrar el historial?')) {localStorage.clear(); sessionStorage.clear(); location.reload();}">Borrar historial</button><script>document.addEventListener("DOMContentLoaded", function() {var tarjetas = document.getElementsByClassName("tarjeta");for (var i = 0; i < tarjetas.length; i++) {tarjetas[i].addEventListener("mouseover", function() {this.style.boxShadow = "2px 2px 20px #333";});tarjetas[i].addEventListener("mouseout", function() {this.style.boxShadow = "2px 2px 10px #333";});}});</script></body></html>
