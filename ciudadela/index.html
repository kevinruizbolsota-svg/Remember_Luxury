<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Ciudadela · KYBALIO</title>
<style>
:root{--bg:#0f1113;--panel:#16181b;--panel2:#1d2024;--border:#292c31;--txt:#e8e9ea;--muted:#8b8f96;--accent:#b08d4f;--accent2:#3a3f47;--user:#22252a;--bot:#16181b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Georgia,Times,serif;background:var(--bg);color:var(--txt);display:flex;height:100vh;overflow:hidden}
#sidebar{width:270px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:margin .25s}
#sidebar.hidden{margin-left:-270px}
.brand{padding:18px 16px;font-size:20px;letter-spacing:1px;color:var(--accent);border-bottom:1px solid var(--border)}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:2px;margin-top:3px}
.newchat{margin:12px 12px 0;padding:11px;background:var(--accent);color:#0f1113;border:none;border-radius:10px;cursor:pointer;font-size:14px;font-family:inherit;font-weight:bold}
.newchat:hover{opacity:.9}
.hist{flex:1;overflow-y:auto;padding:6px 8px}
.hist h4{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin:10px 8px 6px}
.chatitem{padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatitem:hover{background:var(--panel2)}
.chatitem.active{background:var(--panel2);border-left:2px solid var(--accent)}
.userbox{padding:12px 16px;border-top:1px solid var(--border);font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.userbox b{color:var(--txt)}
.logout{color:var(--muted);cursor:pointer;font-size:12px;text-decoration:underline}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel)}
.hamb{background:none;border:none;color:var(--txt);font-size:22px;cursor:pointer}
.topbar select{background:var(--panel2);color:var(--txt);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-family:inherit;font-size:13px}
.topbar .title{font-size:16px;color:var(--accent)}
#messages{flex:1;overflow-y:auto;padding:24px 0}
.msg{max-width:760px;margin:0 auto 22px;padding:0 24px;display:flex;gap:14px;line-height:1.6}
.avatar{width:34px;height:34px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:bold}
.avatar.u{background:var(--user);color:var(--accent)}
.avatar.b{background:var(--accent);color:#111}
.bubble{flex:1;font-size:15.5px;white-space:pre-wrap;padding-top:5px}
.who{font-size:12px;color:var(--muted);margin-bottom:3px}
.welcome{max-width:620px;margin:8vh auto;text-align:center;color:var(--muted)}
.welcome h1{color:var(--accent);font-size:30px;margin-bottom:10px}
.inputbar{border-top:1px solid var(--border);padding:16px;background:var(--panel)}
.inputwrap{max-width:760px;margin:0 auto;display:flex;gap:10px;background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:8px 8px 8px 16px}
#input{flex:1;background:none;border:none;color:var(--txt);font-size:15px;font-family:inherit;resize:none;outline:none;max-height:160px;padding:8px 0}
#send{background:var(--accent);color:#0f1113;border:none;border-radius:10px;width:44px;font-size:18px;cursor:pointer}
#send:disabled{opacity:.4;cursor:default}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:50}
.loginbox{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:34px;width:340px;text-align:center}
.loginbox h2{color:var(--accent);margin-bottom:6px}
.loginbox p{color:var(--muted);font-size:13px;margin-bottom:18px}
.loginbox input{width:100%;padding:12px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;color:var(--txt);font-size:15px;font-family:inherit;margin-bottom:14px;text-align:center}
.loginbox button{width:100%;padding:12px;background:var(--accent);color:#0f1113;border:none;border-radius:10px;font-size:15px;cursor:pointer;font-family:inherit;font-weight:bold}
.dots span{animation:blink 1.2s infinite;color:var(--muted)}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%{opacity:.2}40%{opacity:1}}
@media(max-width:720px){#sidebar{position:absolute;z-index:20;height:100%}}
#music{position:fixed;top:0;right:0;width:330px;max-width:90vw;height:100%;background:var(--panel);border-left:1px solid var(--border);z-index:40;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column}
#music.open{transform:translateX(0)}
.mhead{padding:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.mhead h3{color:var(--accent);font-size:16px}
.mhead .x{cursor:pointer;color:var(--muted);font-size:20px;background:none;border:none}
.player{padding:12px;border-bottom:1px solid var(--border)}
.player iframe{width:100%;height:170px;border:none;border-radius:10px;background:#000}
.player .np{color:var(--muted);font-size:12px;margin-top:8px;text-align:center}
.addrow{display:flex;gap:8px;padding:12px}
.addrow input{flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--txt);padding:9px;font-family:inherit;font-size:13px;outline:none}
.addrow button{background:var(--accent);color:#111;border:none;border-radius:8px;padding:0 14px;cursor:pointer;font-size:16px}
.plist{flex:1;overflow-y:auto;padding:4px 8px}
.track{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px}
.track:hover{background:var(--panel2)}
.track.playing{background:var(--panel2);border-left:2px solid var(--accent)}
.track .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track .del{color:var(--muted);cursor:pointer;font-size:15px}
.track .del:hover{color:#e06}
.mempty{color:var(--muted);font-size:13px;text-align:center;padding:24px 16px;line-height:1.6}
</style>
</head>
<body>
<div id="login" class="overlay">
<div class="loginbox">
<h2>La Ciudadela</h2>
<p>Recuerda tu origen. Escribe tu nombre para entrar.</p>
<input id="nameInput" placeholder="Tu nombre" autocomplete="off">
<button onclick="doLogin()">Entrar</button>
</div>
</div>
<div id="sidebar">
<div class="brand">LA CIUDADELA<small>KYBALIO</small></div>
<button class="newchat" onclick="newChat()">+ Nueva conversacion</button>
<button class="newchat" style="background:var(--panel2);color:var(--accent);border:1px solid var(--border)" onclick="toggleMusic()">&#9835; Musica</button>
<div class="hist" id="hist"><h4>Historial</h4></div>
<div class="userbox"><span>Sesion de <b id="uname"></b></span><span class="logout" onclick="logout()">salir</span></div>
</div>
<div id="main">
<div class="topbar">
<button class="hamb" onclick="toggleSide()">&#9776;</button>
<span class="title">KYBALIO</span>
<select id="agente">
<option value="GENERAL">General</option>
<option value="VENDEDOR">Vendedor / Ventas</option>
<option value="FILOSOFIA">Filosofia / Kybalion</option>
<option value="SOPORTE">Soporte</option>
</select>
</div>
<div id="messages"><div class="welcome"><h1>Hola</h1><p>Soy KYBALIO, el cerebro de La Ciudadela. Elige un proyecto arriba y escribe tu mensaje.</p></div></div>
<div class="inputbar"><div class="inputwrap">
<textarea id="input" rows="1" placeholder="Escribe tu mensaje..."></textarea>
<button id="send" onclick="sendMsg()">&#10148;</button>
</div></div>
</div>
<div id="music">
<div class="mhead"><h3>&#9835; Mi Musica</h3><button class="x" onclick="toggleMusic()">&times;</button></div>
<div class="player"><div id="ytplayer"></div><div class="np" id="np">Elige una cancion de tu lista</div></div>
<div class="addrow"><input id="ytlink" placeholder="Pega un link de YouTube..."><button onclick="addTrack()">+</button></div>
<div class="plist" id="plist"></div>
</div>
<script>
var WEBHOOK="https://kevinruiz.app.n8n.cloud/webhook/portal-central";
var user="",chats={},current=null;
function k(){return "ciudadela_"+user}
function load(){var raw=localStorage.getItem(k());chats=raw?JSON.parse(raw):{};}
function save(){localStorage.setItem(k(),JSON.stringify(chats));}
function uid(){return "s"+Date.now()+Math.floor(Math.random()*999);}
function doLogin(){var n=document.getElementById("nameInput").value.trim();if(!n)return;user=n;localStorage.setItem("ciudadela_user",n);document.getElementById("login").style.display="none";start();loadMusic();}
function logout(){localStorage.removeItem("ciudadela_user");location.reload();}
function start(){document.getElementById("uname").textContent=user;load();renderHist();var ids=Object.keys(chats);if(ids.length){openChat(ids[ids.length-1]);}else{newChat();}}
function newChat(){var id=uid();chats[id]={title:"Nueva conversacion",msgs:[]};current=id;save();renderHist();renderMsgs();document.getElementById("input").focus();}
function openChat(id){current=id;renderHist();renderMsgs();}
function renderHist(){var h=document.getElementById("hist");h.innerHTML="<h4>Historial</h4>";var ids=Object.keys(chats).reverse();for(var i=0;i<ids.length;i++){(function(id){var d=document.createElement("div");d.className="chatitem"+(id===current?" active":"");d.textContent=chats[id].title;d.onclick=function(){openChat(id);};h.appendChild(d);})(ids[i]);}}
function renderMsgs(){var m=document.getElementById("messages");m.innerHTML="";var c=chats[current];if(!c||!c.msgs.length){m.innerHTML="<div class=\"welcome\"><h1>Hola, "+user+"</h1><p>Elige un proyecto arriba y escribe tu mensaje.</p></div>";return;}for(var i=0;i<c.msgs.length;i++){addBubble(c.msgs[i].role,c.msgs[i].text,false);}m.scrollTop=m.scrollHeight;}
function addBubble(role,text,scroll){var m=document.getElementById("messages");if(m.querySelector(".welcome"))m.innerHTML="";var d=document.createElement("div");d.className="msg";var isU=role==="user";d.innerHTML="<div class=\"avatar "+(isU?"u":"b")+"\">"+(isU?user.charAt(0).toUpperCase():"K")+"</div><div class=\"bubble\"><div class=\"who\">"+(isU?user:"KYBALIO")+"</div>"+escapeHtml(text)+"</div>";m.appendChild(d);if(scroll)m.scrollTop=m.scrollHeight;return d;}
function escapeHtml(t){var e=document.createElement("div");e.textContent=t;return e.innerHTML;}
function sendMsg(){var inp=document.getElementById("input");var text=inp.value.trim();if(!text||!current)return;var c=chats[current];c.msgs.push({role:"user",text:text});if(c.title==="Nueva conversacion")c.title=text.slice(0,34);inp.value="";inp.style.height="auto";addBubble("user",text,true);save();renderHist();var typing=addBubble("bot","",true);typing.querySelector(".bubble").innerHTML="<div class=\"who\">KYBALIO</div><span class=\"dots\"><span>.</span><span>.</span><span>.</span></span>";document.getElementById("send").disabled=true;fetch(WEBHOOK,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({usuario:user,sesion:current,agente:document.getElementById("agente").value,mensaje:text})}).then(function(r){return r.json();}).then(function(data){var resp=(data&&(data.respuesta||data.output))||"(sin respuesta)";typing.remove();c.msgs.push({role:"bot",text:resp});addBubble("bot",resp,true);save();}).catch(function(){typing.remove();var err="No pude conectar con el cerebro. Revisa que el Portal Central este publicado.";c.msgs.push({role:"bot",text:err});addBubble("bot",err,true);save();}).finally(function(){document.getElementById("send").disabled=false;});}
function toggleSide(){document.getElementById("sidebar").classList.toggle("hidden");}
var inp=document.getElementById("input");inp.addEventListener("input",function(){this.style.height="auto";this.style.height=Math.min(this.scrollHeight,160)+"px";});inp.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMsg();}});
document.getElementById("nameInput").addEventListener("keydown",function(e){if(e.key==="Enter")doLogin();});
var playlist=[],curTrack=-1;
function mkey(){return "ciudadela_music_"+user;}
function loadMusic(){var raw=localStorage.getItem(mkey());playlist=raw?JSON.parse(raw):[];renderPlaylist();}
function saveMusic(){localStorage.setItem(mkey(),JSON.stringify(playlist));}
function toggleMusic(){document.getElementById("music").classList.toggle("open");}
function ytId(url){var m=url.match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/)([A-Za-z0-9_-]{11})/);return m?m[1]:null;}
function addTrack(){var el=document.getElementById("ytlink");var url=el.value.trim();var id=ytId(url);if(!id){alert("Pega un link valido de YouTube");return;}playlist.push({id:id,title:"Cancion "+(playlist.length+1),url:url});el.value="";saveMusic();renderPlaylist();}
function delTrack(i,e){e.stopPropagation();playlist.splice(i,1);if(curTrack===i){curTrack=-1;document.getElementById("ytplayer").innerHTML="";document.getElementById("np").textContent="Elige una cancion de tu lista";}saveMusic();renderPlaylist();}
function playTrack(i){curTrack=i;var t=playlist[i];document.getElementById("ytplayer").innerHTML="<iframe src=\"https://www.youtube.com/embed/"+t.id+"?autoplay=1\" allow=\"autoplay; encrypted-media\" allowfullscreen></iframe>";document.getElementById("np").textContent="Sonando: "+t.title;renderPlaylist();}
function renderPlaylist(){var p=document.getElementById("plist");if(!playlist.length){p.innerHTML="<div class=\"mempty\">Tu lista esta vacia.<br>Pega arriba el link de YouTube de tu cancion favorita y dale +.</div>";return;}p.innerHTML="";for(var i=0;i<playlist.length;i++){(function(i){var t=playlist[i];var d=document.createElement("div");d.className="track"+(i===curTrack?" playing":"");d.innerHTML="<span>&#9835;</span><span class=\"t\">"+escapeHtml(t.title)+"</span><span class=\"del\">&times;</span>";d.querySelector(".t").onclick=function(){playTrack(i);};d.querySelector(".del").onclick=function(e){delTrack(i,e);};p.appendChild(d);})(i);}}
(function(){var saved=localStorage.getItem("ciudadela_user");if(saved){user=saved;document.getElementById("login").style.display="none";start();loadMusic();}})();
</script>
</body>
</html>
