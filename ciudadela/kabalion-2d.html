<!DOCTYPE html>
<html lang="es">
<head>
<script src="orionix-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRC · Kabalion 2D</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-abyss: #050510; --gold: #C9A84C; --gold-light: #F0D080;
  --violet: #7B2FBE; --cyan: #00FFD1;
  --glass: rgba(255,255,255,0.04); --glass-border: rgba(201,168,76,0.2);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background: var(--bg-abyss); color: #e0e0e0; font-family: 'Cormorant Garamond', serif; min-height: 100vh; overflow: hidden; }
h1, h2, .cinzel { font-family: 'Cinzel', serif; }

nav { position: fixed; top: 0; width: 100%; z-index: 100; background: rgba(5,5,16,0.8); backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass-border); padding: 16px 40px; display: flex; justify-content: space-between; align-items: center; }
.nav-logo { color: var(--gold); font-size: 1.4rem; letter-spacing: 4px; text-decoration: none; font-weight: 900; }
.nav-links a { color: #aaa; text-decoration: none; margin-left: 24px; font-size: 0.9rem; letter-spacing: 1px; transition: 0.3s; }
.nav-links a:hover, .nav-links a.active { color: var(--gold-light); text-shadow: 0 0 10px rgba(201,168,76,0.5); }

.universe-container { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
svg#arbol-vida { width: 80vmin; height: 80vmin; filter: drop-shadow(0 0 20px rgba(123, 47, 190, 0.3)); }

/* Nodos interactivos */
.nodo { cursor: pointer; transition: all 0.4s ease; }
.nodo circle { fill: var(--bg-abyss); stroke: var(--gold); stroke-width: 2; transition: all 0.4s; }
.nodo text { fill: var(--gold-light); font-family: 'Cinzel', serif; font-size: 14px; text-anchor: middle; dominant-baseline: middle; opacity: 0.8; transition: 0.4s; pointer-events: none; }
.nodo .linea-conexion { stroke: var(--violet); stroke-width: 1.5; opacity: 0.4; transition: 0.4s; }

.nodo:hover circle { fill: var(--violet); stroke: var(--cyan); stroke-width: 3; filter: drop-shadow(0 0 15px var(--cyan)); }
.nodo:hover text { fill: #fff; opacity: 1; font-weight: 700; }
.nodo:hover .linea-conexion { stroke: var(--cyan); opacity: 0.8; stroke-width: 2.5; }

/* Tooltip místico */
#tooltip {
  position: absolute; background: rgba(5,5,16,0.95); border: 1px solid var(--cyan);
  padding: 16px 24px; border-radius: 8px; backdrop-filter: blur(15px);
  pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 200;
  box-shadow: 0 0 30px rgba(0,255,209,0.2); max-width: 250px;
}
#tooltip h3 { color: var(--cyan); font-size: 1.1rem; margin-bottom: 8px; letter-spacing: 2px; }
#tooltip p { color: #ccc; font-size: 0.95rem; line-height: 1.5; }
#tooltip .stat { color: var(--gold); font-family: 'Cinzel', serif; font-size: 0.8rem; margin-top: 8px; }

@media(max-width: 768px) { svg#arbol-vida { width: 95vmin; height: 95vmin; } .nav-links { display: none; } }
</style>
</head>
<body>
<nav>
  <a href="krc.html" class="nav-logo">KRC</a>
  <div class="nav-links">
    <a href="krc.html">Universo</a>
    <a href="kabalion-2d.html" class="active">Kabalion</a>
    <a href="forjadora.html">Forjadora</a>
    <a href="cronicas.html">Crónicas</a>
  </div>
</nav>

<div class="universe-container">
  <svg id="arbol-vida" viewBox="0 0 400 600">
    <!-- Líneas de conexión (Luz) -->
    <line x1="200" y1="80" x2="200" y2="180" class="linea-conexion" />
    <line x1="200" y1="180" x2="120" y2="280" class="linea-conexion" />
    <line x1="200" y1="180" x2="280" y2="280" class="linea-conexion" />
    <line x1="120" y1="280" x2="200" y2="380" class="linea-conexion" />
    <line x1="280" y1="280" x2="200" y2="380" class="linea-conexion" />
    <line x1="200" y1="380" x2="200" y2="500" class="linea-conexion" />

    <!-- Nodos (Sefirot / Estadísticas) -->
    <g class="nodo" data-title="KETHER" data-desc="La Corona. Origen de toda la XP y la voluntad del Creador." data-stat="Nivel Máximo">
      <circle cx="200" cy="80" r="25" />
      <text x="200" y="80">KETHER</text>
    </g>
    <g class="nodo" data-title="CHOKMAH" data-desc="Sabiduría pura. La arquitectura de los mundos y el diseño inicial." data-stat="Inteligencia: 99%">
      <circle cx="120" cy="180" r="22" />
      <text x="120" y="180">CHOKMAH</text>
    </g>
    <g class="nodo" data-title="BINAH" data-desc="Entendimiento. La estructura que da forma al caos cósmico." data-stat="Estructura: Sólida">
      <circle cx="280" cy="180" r="22" />
      <text x="280" y="180">BINAH</text>
    </g>
    <g class="nodo" data-title="TIFERET" data-desc="Belleza y Equilibrio. El corazón del universo KRC, donde todo converge." data-stat="Armonía: 100%">
      <circle cx="200" cy="300" r="30" />
      <text x="200" y="300">TIFERET</text>
    </g>
    <g class="nodo" data-title="MALKUTH" data-desc="El Reino. La manifestación física del código en la realidad." data-stat="Materialización: Activa">
      <circle cx="200" cy="450" r="28" />
      <text x="200" y="450">MALKUTH</text>
    </g>
  </svg>
  
  <div id="tooltip">
    <h3 id="tt-title"></h3>
    <p id="tt-desc"></p>
    <div class="stat" id="tt-stat"></div>
  </div>
</div>

<script>
const tooltip = document.getElementById('tooltip');
const ttTitle = document.getElementById('tt-title');
const ttDesc = document.getElementById('tt-desc');
const ttStat = document.getElementById('tt-stat');

document.querySelectorAll('.nodo').forEach(nodo => {
  nodo.addEventListener('mouseenter', (e) => {
    ttTitle.textContent = nodo.dataset.title;
    ttDesc.textContent = nodo.dataset.desc;
    ttStat.textContent = "✦ " + nodo.dataset.stat;
    tooltip.style.opacity = '1';
  });
  
  nodo.addEventListener('mousemove', (e) => {
    tooltip.style.left = (e.pageX + 20) + 'px';
    tooltip.style.top = (e.pageY - 20) + 'px';
  });
  
  nodo.addEventListener('mouseleave', () => {
    tooltip.style.opacity = '0';
  });
});
</script>
</body>
</html>
