<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#C9A84C;
  --gold2:#F0D080;
  --violet:#7B2FBE;
  --cyan:#00FFD1;
  --bg:#050510;
  --glass:rgba(255,255,255,0.04);
  --glass-border:rgba(201,168,76,0.2);
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Inter',sans-serif;cursor:default}

/* ── CANVAS ESTRELLADO ── */
#canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}

/* ── WRAPPER PRINCIPAL ── */
#app{position:relative;z-index:1;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}

/* ── TITULO KRC (Superior Izquierda) ── */
#krc-title{
  position:fixed;top:30px;left:40px;
  text-align:left;pointer-events:none;z-index:5
}
#krc-title h1{
  font-family:'Cinzel',serif;font-size:2rem;
  font-weight:900;letter-spacing:.3em;
  background:linear-gradient(135deg,var(--gold),var(--gold2),var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:none;filter:drop-shadow(0 0 15px rgba(201,168,76,.5));
}
#krc-title p{font-size:.6rem;letter-spacing:.5em;color:rgba(201,168,76,.6);margin-top:.3rem;font-weight:300}

/* ── CORAZON (Chakra Corazón - Arriba del centro) ── */
#heart{
  position:fixed;top:35%;left:50%;transform:translate(-50%,-50%);
  width:100px;height:100px;z-index:4;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px
}
#heart-svg{animation:heartbeat 1.4s ease-in-out infinite;filter:drop-shadow(0 0 20px rgba(201,168,76,.7))}
@keyframes heartbeat{0%,100%{transform:scale(1)}15%{transform:scale(1.15)}30%{transform:scale(1)}45%{transform:scale(1.08)}60%{transform:scale(1)}}
#xp-display{font-size:.6rem;letter-spacing:.15em;color:var(--gold);text-align:center;font-weight:600}
#xp-bar-wrap{width:80px;height:3px;background:rgba(201,168,76,.15);border-radius:2px;overflow:hidden;margin-top:2px}
#xp-bar{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:2px;transition:width .5s ease}

/* ── NODOS (Chakras) ── */
.node{
  position:fixed;z-index:6;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  transform:translate(-50%,-50%);
  transition:transform .3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  cursor:pointer;
}

.node:hover{transform:translate(-50%,-50%) scale(1.15)}

.node-orb{
  width:88px;height:88px;border-radius:50%;
  background:rgba(201,168,76,0.05);
  border:1.5px solid rgba(201,168,76,0.3);
  backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:visible;
  box-shadow:0 0 20px rgba(0,0,0,.5), inset 0 0 15px rgba(201,168,76,.1);
  color:var(--gold);
  transition:all .4s ease
}

/* Anillo de energía alrededor de ORIONIX */
#node-orionix .node-orb{
  width:100px;height:100px;
  border:2px solid rgba(201,168,76,0.5);
  box-shadow:0 0 40px rgba(201,168,76,.4), 0 0 80px rgba(123,47,190,.2), inset 0 0 30px rgba(201,168,76,.15);
  animation:orionix-pulse 3s ease-in-out infinite;
}
@keyframes orionix-pulse{
  0%,100%{box-shadow:0 0 40px rgba(201,168,76,.4),0 0 80px rgba(123,47,190,.2),inset 0 0 30px rgba(201,168,76,.15)}
  50%{box-shadow:0 0 70px rgba(201,168,76,.7),0 0 120px rgba(123,47,190,.4),inset 0 0 50px rgba(201,168,76,.3)}
}
#node-krc-logo .node-orb svg{
  animation:krc-spin 12s linear infinite;
}
@keyframes krc-spin{
  from{transform:rotate(0deg)} to{transform:rotate(360deg)}
}

.node:hover .node-orb{
  background:rgba(201,168,76,0.15);
  box-shadow:0 0 40px rgba(201,168,76,.5), inset 0 0 30px rgba(201,168,76,.3);
  border-color:var(--gold);
}

.node-orb svg{
  width:48px;height:48px;
  fill:none;stroke:currentColor;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 10px currentColor);
  transition:all .4s ease
}
.node:hover .node-orb svg{
  filter:drop-shadow(0 0 18px currentColor) drop-shadow(0 0 6px currentColor);
  transform:scale(1.05);
}

.node-orb::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.15),transparent 60%);
  border-radius:50%
}

.node-label{
  font-size:.65rem;letter-spacing:.15em;font-weight:600;
  color:var(--gold);text-transform:uppercase;white-space:nowrap;
  text-shadow:0 2px 8px rgba(0,0,0,1);
  display:flex;flex-direction:column;align-items:center;gap:2px
}

/* ── MODAL / SUB-MENU (Centro Comercial y Páginas) ── */
#menu-modal{
  position:fixed;inset:0;z-index:200;
  background:rgba(5,5,16,0.85);backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .3s ease;
}
#menu-modal.open{opacity:1;pointer-events:all}

.menu-panel{
  background:rgba(10,10,20,0.95);border:1px solid var(--gold);
  border-radius:16px;padding:2rem;width:90%;max-width:450px;
  box-shadow:0 20px 60px rgba(0,0,0,.9),0 0 40px rgba(201,168,76,.2);
  transform:scale(0.95) translateY(20px);transition:all .3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
#menu-modal.open .menu-panel{transform:scale(1) translateY(0)}

.menu-header{display:flex;align-items:center;gap:15px;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:1px solid rgba(201,168,76,.2)}
.menu-icon{width:48px;height:48px;color:var(--gold);display:flex;align-items:center;justify-content:center}
.menu-icon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5;filter:drop-shadow(0 0 8px currentColor)}
.menu-title{font-family:'Cinzel',serif;font-size:1.3rem;color:var(--gold);letter-spacing:.15em}
.menu-desc{font-size:.8rem;color:rgba(255,255,255,.5);margin-top:4px}
.close-modal{position:absolute;top:20px;right:20px;background:none;border:none;color:rgba(255,255,255,.5);font-size:1.5rem;cursor:pointer;transition:color .2s}
.close-modal:hover{color:var(--gold)}

.menu-links{display:flex;flex-direction:column;gap:10px}
.menu-link-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.05);border-radius:8px;
  text-decoration:none;color:#fff;font-size:.9rem;
  transition:all .2s;
}
.menu-link-item:hover{
  background:rgba(201,168,76,.1);border-color:var(--gold);
  transform:translateX(5px);box-shadow:0 0 15px rgba(201,168,76,.2);
}
.ml-icon{font-size:1.2rem}

/* ── TOOLTIP ── */
#tooltip{
  position:fixed;z-index:50;
  background:rgba(5,5,16,.95);border:1px solid var(--glass-border);
  border-radius:10px;padding:.6rem 1rem;
  font-size:.75rem;color:var(--gold);pointer-events:none;
  opacity:0;transition:opacity .2s ease;white-space:nowrap;
  backdrop-filter:blur(10px);box-shadow:0 10px 20px rgba(0,0,0,0.8)
}

@media(max-width:768px){
  .node-label{font-size:0.5rem;}
  .node-orb{width:66px;height:66px;}
  .node-orb svg{width:36px;height:36px;}
  #node-orionix .node-orb{width:78px;height:78px;}
}

// ── CREAR NODOS ──
function createNodes(){
  MUNDOS.forEach(m=>{
    const el = document.createElement('div');
    el.className = `node`;
    el.id = 'node-'+m.id;
    el.style.left = m.left + '%';
    el.style.top = m.top + '%';
    
    el.innerHTML = `
      <div class="node-orb">
        <svg viewBox="0 0 24 24">${m.icon}</svg>
      </div>
      <div class="node-label"><span>${m.label}</span></div>
    `;
    
    el.addEventListener('click', () => openModal(m));
    el.addEventListener('mouseenter', (e) => showTooltip(e,m.desc));
    el.addEventListener('mouseleave', hideTooltip);
    document.getElementById('app').appendChild(el);
    
    // Conectar todos con el centro (Orionix, 50%, 50%)
    if(m.id !== 'orionix'){
      const nx = (m.left / 100) * window.innerWidth;
      const ny = (m.top / 100) * window.innerHeight;
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      drawLine(nx, ny, cx, cy, 'rgba(201,168,76,0.2)');
    }
  });
}

function drawLine(x1,y1,x2,y2,color){
  let svg = document.getElementById('lines-svg');
  if(!svg){
    svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.id='lines-svg';
    svg.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;z-index:2;pointer-events:none';
    document.body.appendChild(svg);
  }
  const line=document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('x1',x1);line.setAttribute('y1',y1);
  line.setAttribute('x2',x2);line.setAttribute('y2',y2);
  line.setAttribute('stroke',color);
  line.setAttribute('stroke-width','1.5');
  line.setAttribute('stroke-dasharray','4,4');
  svg.appendChild(line);
}

// ── MODAL LOGIC ──
function openModal(mundo) {
  document.getElementById('modal-title').textContent = mundo.label;
  document.getElementById('modal-desc').textContent = mundo.desc;
  document.getElementById('modal-icon').innerHTML = `<svg viewBox="0 0 24 24">${mundo.icon}</svg>`;
  
  const linksContainer = document.getElementById('modal-links');
  linksContainer.innerHTML = '';
  
  mundo.links.forEach(link => {
    const a = document.createElement('a');
    a.href = link.url;
    a.className = 'menu-link-item';
    a.innerHTML = `
      <span>${link.name}</span>
      <span class="ml-icon">${link.emoji}</span>
    `;
    linksContainer.appendChild(a);
  });
  
  document.getElementById('menu-modal').classList.add('open');
}

function closeModal() {
  document.getElementById('menu-modal').classList.remove('open');
}

// ── CANVAS ESTRELLADO ──
(function initStars(){
  const canvas=document.getElementById('canvas');
  const ctx=canvas.getContext('2d');
  let W,H,stars=[];
  function resize(){
    W=canvas.width=window.innerWidth;
    H=canvas.height=window.innerHeight;
    stars=[];
    for(let i=0;i<250;i++){
      stars.push({
        x:Math.random()*W, y:Math.random()*H,
        r:Math.random()*1.5+.2,
        a:Math.random(),
        sp:Math.random()*.003+.001,
        twinkle:Math.random()*Math.PI*2
      });
    }
  }
  resize();
  window.addEventListener('resize',()=>{
    document.querySelectorAll('.node').forEach(n=>n.remove());
    const svg = document.getElementById('lines-svg');
    if(svg) svg.innerHTML = '';
    resize();
    createNodes();
  });
  function draw(){
    ctx.clearRect(0,0,W,H);
    const bg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W*.8);
    bg.addColorStop(0,'rgba(30,10,60,.4)');
    bg.addColorStop(1,'rgba(5,5,16,1)');
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    stars.forEach(s=>{
      s.twinkle+=s.sp;
      const alpha=s.a*(.5+.5*Math.sin(s.twinkle));
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${alpha})`;
      ctx.fill();
    });
    // Brillo central Orionix
    const nb=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,300);
    nb.addColorStop(0,'rgba(201,168,76,.15)');
    nb.addColorStop(.5,'rgba(123,47,190,.05)');
    nb.addColorStop(1,'transparent');
    ctx.fillStyle=nb;ctx.fillRect(0,0,W,H);
    requestAnimationFrame(draw);
  }
  draw();
})();

// ── TOOLTIP ──
const tip=document.getElementById('tooltip');
function showTooltip(e,text){
  tip.innerHTML=text;
  tip.style.left=(e.clientX+15)+'px';
  tip.style.top=(e.clientY-35)+'px';
  tip.style.opacity='1';
}
function hideTooltip(){tip.style.opacity='0'}
document.addEventListener('mousemove',e=>{
  if(tip.style.opacity === '1') {
    tip.style.left=(e.clientX+15)+'px';
    tip.style.top=(e.clientY-35)+'px';
  }
});

document.getElementById('menu-modal').addEventListener('click', (e) => {
  if(e.target.id === 'menu-modal') closeModal();
});

window.addEventListener('load',()=>{
  createNodes();
  document.body.style.opacity='0';
  setTimeout(()=>{
    document.body.style.transition='opacity 1s ease';
    document.body.style.opacity='1';
  },100);
});
</script>
