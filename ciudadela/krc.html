<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRC.COM — El Universo de Kevin Ruiz Creator</title>
<meta name="description" content="KRC.COM — Portal central del universo KRC. Accede a ORIONIX, La Forjadora, Crónicas del Creador, Kabaiom, Trascendencia y más.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#C9A84C;
  --gold2:#F0D080;
  --violet:#7B2FBE;
  --cyan:#00FFD1;
  --bg:#050510;
  --glass:rgba(255,255,255,0.04);
  --glass-border:rgba(201,168,76,0.2);
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Inter',sans-serif;cursor:default}

/* ── CANVAS ESTRELLADO ── */
#canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}

/* ── WRAPPER PRINCIPAL ── */
#app{position:relative;z-index:1;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}

/* ── TITULO KRC ── */
#krc-title{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;pointer-events:none;z-index:5
}
#krc-title h1{
  font-family:'Cinzel',serif;font-size:clamp(2.5rem,6vw,5rem);
  font-weight:900;letter-spacing:.3em;
  background:linear-gradient(135deg,var(--gold),var(--gold2),var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:none;filter:drop-shadow(0 0 30px rgba(201,168,76,.5));
  animation:pulse-title 4s ease-in-out infinite
}
#krc-title p{font-size:.8rem;letter-spacing:.5em;color:rgba(201,168,76,.4);margin-top:.3rem;font-weight:300}
@keyframes pulse-title{0%,100%{filter:drop-shadow(0 0 30px rgba(201,168,76,.5))}50%{filter:drop-shadow(0 0 60px rgba(201,168,76,.9))}}

/* ── CORAZON CENTRAL ── */
#heart{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  width:100px;height:100px;z-index:4;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px
}
#heart-svg{animation:heartbeat 1.4s ease-in-out infinite;filter:drop-shadow(0 0 20px rgba(201,168,76,.7))}
@keyframes heartbeat{0%,100%{transform:scale(1)}15%{transform:scale(1.15)}30%{transform:scale(1)}45%{transform:scale(1.08)}60%{transform:scale(1)}}
#xp-display{font-size:.6rem;letter-spacing:.15em;color:var(--gold);text-align:center;font-weight:600}
#xp-bar-wrap{width:80px;height:3px;background:rgba(201,168,76,.15);border-radius:2px;overflow:hidden;margin-top:2px}
#xp-bar{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:2px;transition:width .5s ease}

/* ── NODOS ORBITALES ── */
.node{
  position:fixed;z-index:6;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  transform:translate(-50%,-50%);
  transition:transform .3s cubic-bezier(0.175, 0.885, 0.32, 1.275)
}
.node.active{cursor:pointer}
.node.locked{cursor:not-allowed;opacity:0.7}

.node.active:hover{transform:translate(-50%,-50%) scale(1.15)}
.node.locked:hover{transform:translate(-50%,-50%) scale(1.05)}

.node-orb{
  width:72px;height:72px;border-radius:50%;
  background:var(--glass);
  border:1.5px solid var(--glass-border);
  backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
  box-shadow:0 0 20px rgba(0,0,0,.5);
  transition:all .4s ease
}

/* Efecto de magia en SVG */
.node-orb svg{
  width:36px;height:36px;
  fill:none;stroke:currentColor;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 8px currentColor);
  transition:all .4s ease
}

/* Estilos Activo vs Bloqueado */
.node.active .node-orb{
  background:rgba(201,168,76,0.1);
  border-color:var(--gold);
  box-shadow:0 0 30px rgba(201,168,76,.4), inset 0 0 20px rgba(201,168,76,.2);
  color:var(--gold);
}
.node.active:hover .node-orb{
  background:rgba(201,168,76,0.2);
  box-shadow:0 0 50px rgba(201,168,76,.6), inset 0 0 30px rgba(201,168,76,.4);
}
.node.locked .node-orb{
  background:rgba(10,10,20,0.8);
  border-color:rgba(255,255,255,0.1);
  color:rgba(255,255,255,0.2);
  box-shadow:inset 0 0 15px rgba(0,0,0,0.8);
}

.node-orb::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.15),transparent 60%);
  border-radius:50%
}

/* Candado para los bloqueados */
.lock-icon{
  position:absolute;bottom:5px;right:5px;
  width:16px;height:16px;background:rgba(5,5,10,0.9);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,0.1);
}
.lock-icon svg{width:8px;height:8px;stroke:rgba(255,255,255,0.4);filter:none}

.node-label{
  font-size:.65rem;letter-spacing:.15em;font-weight:600;
  color:rgba(255,255,255,.5);text-transform:uppercase;white-space:nowrap;
  text-shadow:0 2px 4px rgba(0,0,0,.8);
  display:flex;flex-direction:column;align-items:center;gap:2px
}
.node.active .node-label{color:var(--gold)}
.node.locked .node-label-sub{
  font-size:.45rem;color:rgba(255,255,255,0.3);
  letter-spacing:.2em;background:rgba(0,0,0,0.5);
  padding:2px 6px;border-radius:4px;border:1px solid rgba(255,255,255,0.05)
}

/* ── LINEAS ORBITALES ── */
.orbit-ring{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  border-radius:50%;border:1px solid rgba(201,168,76,.06);
  animation:orbit-spin 100s linear infinite;pointer-events:none;z-index:2
}
@keyframes orbit-spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

/* ── TITULO CENTRAL KRC LOGO ── */
#center-krc{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  width:130px;height:130px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,168,76,.15),transparent 70%);
  border:1px solid rgba(201,168,76,.1);
  z-index:3;pointer-events:none
}

/* ── TOOLTIP ── */
#tooltip{
  position:fixed;z-index:50;
  background:rgba(5,5,16,.95);border:1px solid var(--glass-border);
  border-radius:10px;padding:.6rem 1rem;
  font-size:.75rem;color:var(--gold);pointer-events:none;
  opacity:0;transition:opacity .2s ease;white-space:nowrap;
  backdrop-filter:blur(10px);box-shadow:0 10px 20px rgba(0,0,0,0.8)
}

/* ── RESPONSIVE ── */
@media(max-width:600px){
  #krc-title h1{font-size:2rem;letter-spacing:.15em}
  .orbit-ring{display:none} /* Simplificar en móvil */
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="app">
  <!-- Anillo orbital decorativo -->
  <div class="orbit-ring" style="width:380px;height:380px"></div>
  <div class="orbit-ring" style="width:580px;height:580px;animation-direction:reverse;animation-duration:150s"></div>

  <!-- Centro KRC -->
  <div id="center-krc"></div>

  <!-- Título KRC -->
  <div id="krc-title">
    <h1>KRC</h1>
    <p>UNIVERSE · EST. 2025</p>
  </div>

  <!-- Corazón central -->
  <div id="heart" title="El Corazón — Experiencia del Universo">
    <svg id="heart-svg" width="54" height="50" viewBox="0 0 44 40" fill="none">
      <path d="M22 37C22 37 3 25 3 13C3 7.477 7.477 3 13 3C16.254 3 19.13 4.516 22 7.5C24.87 4.516 27.746 3 31 3C36.523 3 41 7.477 41 13C41 25 22 37 22 37Z" fill="url(#hg)" stroke="rgba(201,168,76,0.6)" stroke-width="1.5"/>
      <defs><linearGradient id="hg" x1="3" y1="3" x2="41" y2="37" gradientUnits="userSpaceOnUse"><stop stop-color="#C9A84C"/><stop offset="1" stop-color="#7B2FBE"/></linearGradient></defs>
    </svg>
    <div id="xp-display">XP 0</div>
    <div id="xp-bar-wrap"><div id="xp-bar" style="width:0%"></div></div>
  </div>

  <!-- Tooltip -->
  <div id="tooltip"></div>
</div>

<script>
// ── FORMAS MAGICAS (SVGs) ──
const ICONS = {
  krc: '<path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>', // Templo/Logo
  orionix: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>', // Ojo
  cronicas: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>', // Libro
  forjadora: '<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/>', // Escudo/Espada
  musica: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>', // Nota musical
  kabaiom: '<polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>', // Cristal/Kabala
  trascendencia: '<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>', // Hexagono/Obelisco
  miuniverso: '<circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><path d="M2 12h20"/>' // Globo/Galaxia
};

const LOCK_ICON = '<div class="lock-icon"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></div>';

// ── CONFIG DE MUNDOS ──
const MUNDOS = [
  {
    id:'krc-logo', icon: ICONS.krc, label:'KRC Imperio',
    url:'tienda.html', active: true,
    desc:'El centro del Imperio — Acceso total',
    angle:270, dist:220
  },
  {
    id:'orionix', icon: ICONS.orionix, label:'ORIONIX',
    url:'#', active: false,
    desc:'La tienda del Imperio — En construcción',
    angle:315, dist:220
  },
  {
    id:'cronicas', icon: ICONS.cronicas, label:'CRÓNICAS',
    url:'#', active: false,
    desc:'Crónicas del Creador — Próximamente',
    angle:0, dist:220
  },
  {
    id:'forjadora', icon: ICONS.forjadora, label:'FORJADORA',
    url:'#', active: false,
    desc:'La Forjadora de Diamantes — Próximamente',
    angle:45, dist:220
  },
  {
    id:'musica', icon: ICONS.musica, label:'MÚSICA',
    url:'#', active: false,
    desc:'Reproductor Universal — Próximamente',
    angle:90, dist:220
  },
  {
    id:'kabaiom', icon: ICONS.kabaiom, label:'KABAIOM',
    url:'#', active: false,
    desc:'Estadísticas del espíritu — Próximamente',
    angle:135, dist:220
  },
  {
    id:'trascendencia', icon: ICONS.trascendencia, label:'TRASCENDENCIA',
    url:'#', active: false,
    desc:'El portal entre mundos — Próximamente',
    angle:180, dist:220
  },
  {
    id:'miuniverso', icon: ICONS.miuniverso, label:'PERFIL',
    url:'#', active: false,
    desc:'Tu espacio personal — Próximamente',
    angle:225, dist:220
  }
];

// ── CREAR NODOS ──
function createNodes(){
  const cx = window.innerWidth/2, cy = window.innerHeight/2;
  MUNDOS.forEach(m=>{
    const rad = m.angle * Math.PI/180;
    const x = cx + m.dist * Math.cos(rad);
    const y = cy + m.dist * Math.sin(rad);
    const el = document.createElement('div');
    
    el.className = `node ${m.active ? 'active' : 'locked'}`;
    el.id = 'node-'+m.id;
    el.style.left = x+'px';
    el.style.top = y+'px';
    
    let labelHtml = `<div class="node-label"><span>${m.label}</span>`;
    if(!m.active) labelHtml += `<span class="node-label-sub">EN CREACIÓN</span>`;
    labelHtml += `</div>`;

    el.innerHTML = `
      <div class="node-orb">
        <svg viewBox="0 0 24 24">${m.icon}</svg>
        ${!m.active ? LOCK_ICON : ''}
      </div>
      ${labelHtml}
    `;
    
    if(m.active) {
      el.addEventListener('click',()=>openWorld(m.url));
    }
    
    el.addEventListener('mouseenter',(e)=>showTooltip(e,m.desc));
    el.addEventListener('mouseleave',hideTooltip);
    document.getElementById('app').appendChild(el);
    
    // Línea del nodo al centro
    drawLine(x,y,cx,cy, m.active ? 'rgba(201,168,76,0.3)' : 'rgba(255,255,255,0.05)');
  });
}

// ── LINEAS DE CONEXION (SVG) ──
function drawLine(x1,y1,x2,y2,color){
  let svg = document.getElementById('lines-svg');
  if(!svg){
    svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.id='lines-svg';
    svg.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;z-index:2;pointer-events:none';
    document.body.appendChild(svg);
  }
  const line=document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('x1',x1);line.setAttribute('y1',y1);
  line.setAttribute('x2',x2);line.setAttribute('y2',y2);
  line.setAttribute('stroke',color);
  line.setAttribute('stroke-width','1');
  line.setAttribute('stroke-dasharray','4,4');
  svg.appendChild(line);
}

// ── CANVAS ESTRELLADO ──
(function initStars(){
  const canvas=document.getElementById('canvas');
  const ctx=canvas.getContext('2d');
  let W,H,stars=[];
  function resize(){
    W=canvas.width=window.innerWidth;
    H=canvas.height=window.innerHeight;
    stars=[];
    for(let i=0;i<250;i++){
      stars.push({
        x:Math.random()*W, y:Math.random()*H,
        r:Math.random()*1.5+.2,
        a:Math.random(),
        sp:Math.random()*.003+.001,
        twinkle:Math.random()*Math.PI*2
      });
    }
  }
  resize();
  window.addEventListener('resize',()=>{
    document.querySelectorAll('.node').forEach(n=>n.remove());
    const svg = document.getElementById('lines-svg');
    if(svg) svg.innerHTML = '';
    resize();
    createNodes();
  });
  function draw(){
    ctx.clearRect(0,0,W,H);
    // Gradiente de fondo
    const bg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W*.8);
    bg.addColorStop(0,'rgba(30,10,60,.4)');
    bg.addColorStop(1,'rgba(5,5,16,1)');
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    // Estrellas
    stars.forEach(s=>{
      s.twinkle+=s.sp;
      const alpha=s.a*(.5+.5*Math.sin(s.twinkle));
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${alpha})`;
      ctx.fill();
    });
    // Nebula central
    const nb=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,300);
    nb.addColorStop(0,'rgba(201,168,76,.08)');
    nb.addColorStop(.5,'rgba(123,47,190,.05)');
    nb.addColorStop(1,'transparent');
    ctx.fillStyle=nb;ctx.fillRect(0,0,W,H);
    requestAnimationFrame(draw);
  }
  draw();
})();

// ── TOOLTIP ──
const tip=document.getElementById('tooltip');
function showTooltip(e,text){
  tip.innerHTML=text;
  tip.style.left=(e.clientX+15)+'px';
  tip.style.top=(e.clientY-35)+'px';
  tip.style.opacity='1';
}
function hideTooltip(){tip.style.opacity='0'}
document.addEventListener('mousemove',e=>{
  if(tip.style.opacity === '1') {
    tip.style.left=(e.clientX+15)+'px';
    tip.style.top=(e.clientY-35)+'px';
  }
});

// ── NAVEGACION ──
function openWorld(url){
  if(url==='#') return;
  document.body.style.transition='opacity .4s ease';
  document.body.style.opacity='0';
  setTimeout(()=>window.location.href=url,400);
}

// ── INIT ──
window.addEventListener('load',()=>{
  createNodes();
  document.body.style.opacity='0';
  setTimeout(()=>{
    document.body.style.transition='opacity 1s ease';
    document.body.style.opacity='1';
  },100);
});
</script>
</body>
</html>
