<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EL ORÁCULO — Sistema ORIONIX</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0d;
    --gold: #e8c86a;
    --text: #e9ddc4;
  }
  body {
    margin: 0; padding: 0; background-color: var(--bg); color: var(--text);
    font-family: 'Cormorant Garamond', serif; overflow-x: hidden;
  }
  
  /* Canvas de Partículas */
  #particles { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
  
  .container {
    position: relative; z-index: 10; max-width: 900px; margin: 0 auto; padding: 60px 20px;
  }
  
  h1 {
    font-family: 'Cinzel', serif; color: var(--gold); text-align: center; font-size: 3rem;
    letter-spacing: 5px; text-shadow: 0 0 20px rgba(232,200,106,0.3); margin-bottom: 50px;
  }
  
  .terminal {
    background: rgba(0,0,0,0.6); border: 1px solid rgba(232,200,106,0.3); border-radius: 8px;
    padding: 40px; box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(232,200,106,0.05);
    min-height: 400px; position: relative;
  }
  
  .content { font-size: 1.2rem; line-height: 1.6; white-space: pre-wrap; }
  
  .cursor {
    display: inline-block; width: 10px; height: 20px; background-color: var(--gold);
    animation: blink 1s step-end infinite; vertical-align: bottom; margin-left: 5px;
  }
  @keyframes blink { 50% { opacity: 0; } }
  
  .btn-force {
    display: block; width: 250px; margin: 40px auto 0; padding: 15px; text-align: center;
    background: transparent; color: var(--gold); border: 1px solid var(--gold);
    font-family: 'Cinzel', serif; font-size: 1.1rem; cursor: pointer; transition: 0.3s;
    text-transform: uppercase; letter-spacing: 2px;
  }
  .btn-force:hover {
    background: var(--gold); color: var(--bg); box-shadow: 0 0 20px rgba(232,200,106,0.5);
  }
  
  .status {
    position: absolute; top: 15px; right: 20px; font-family: 'Cinzel', serif; font-size: 0.8rem;
    color: #4CAF50; letter-spacing: 2px;
  }
  .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #4CAF50; margin-right: 5px; box-shadow: 0 0 10px #4CAF50; }
  .status.error { color: #f44336; }
  .status.error .status-dot { background: #f44336; box-shadow: 0 0 10px #f44336; }

  /* Métricas */
  .metrics-panel {
    display: flex; justify-content: space-between; margin-bottom: 30px;
    background: rgba(232,200,106,0.05); border: 1px solid rgba(232,200,106,0.2);
    padding: 20px; border-radius: 8px;
  }
  .metric-box { text-align: center; flex: 1; }
  .metric-box:not(:last-child) { border-right: 1px solid rgba(232,200,106,0.1); }
  .metric-title { font-family: 'Cinzel', serif; font-size: 0.9rem; color: rgba(233, 221, 196, 0.6); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
  .metric-value { font-size: 1.5rem; color: var(--gold); font-weight: 600; }

  /* Enviar Misión */
  .mission-sender {
    margin-top: 30px; display: flex; gap: 15px;
  }
  .mission-input {
    flex: 1; background: rgba(0,0,0,0.6); border: 1px solid rgba(232,200,106,0.3);
    color: var(--text); padding: 15px; font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem; border-radius: 4px; outline: none;
  }
  .mission-input:focus { border-color: var(--gold); box-shadow: 0 0 15px rgba(232,200,106,0.2); }
  
  /* Syntax Highlighting */
  .hl-green { color: #4CAF50; }
  .hl-red { color: #f44336; }
  .hl-yellow { color: #ffeb3b; }
  .hl-gold { color: var(--gold); font-weight: bold; }
</style>
</head>
<body>

<canvas id="particles"></canvas>

<div class="container">
  <h1>EL ORÁCULO</h1>
  
  <div class="metrics-panel">
    <div class="metric-box">
      <div class="metric-title">Último Ciclo</div>
      <div class="metric-value" id="m-ciclo">--:--:--</div>
    </div>
    <div class="metric-box">
      <div class="metric-title">Agente Activo</div>
      <div class="metric-value" id="m-agente">Desconocido</div>
    </div>
    <div class="metric-box">
      <div class="metric-title">Ciclos Completados</div>
      <div class="metric-value" id="m-count">0</div>
    </div>
  </div>

  <div class="terminal">
    <div class="status" id="status-indicator"><span class="status-dot"></span>SYNC ACTIVO</div>
    <div id="mesa-content" class="content">Iniciando enlace con La Mesa Redonda...</div>
    <div class="cursor"></div>
  </div>
  
  <div class="mission-sender">
    <input type="text" id="missionInput" class="mission-input" placeholder="Dicta una nueva misión suprema al sistema...">
    <button class="btn-force" style="margin: 0; width: auto;" onclick="enviarMision()">Enviar al Creador</button>
  </div>
  
  <button class="btn-force" onclick="forzarCiclo()">Forzar Ciclo</button>
</div>

<script>
  const rawUrl = 'https://raw.githubusercontent.com/kevinruizbolsota-svg/Remember_Luxury/main/ciudadela/la_forja/MESA_REDONDA.md';
  const contentDiv = document.getElementById('mesa-content');
  const webhookMission = 'https://lkevinruizl.app.n8n.cloud/webhook/orionix-mission';
  const webhookBridge = 'https://lkevinruizl.app.n8n.cloud/webhook/orionix-bridge';

  function applySyntax(text) {
    const lines = text.split('\n');
    return lines.map(line => {
      if (line.includes('✅')) return `<span class="hl-green">${line}</span>`;
      if (line.includes('❌')) return `<span class="hl-red">${line}</span>`;
      if (line.includes('⚡')) return `<span class="hl-yellow">${line}</span>`;
      if (line.includes('🧠')) return `<span class="hl-gold">${line}</span>`;
      return line;
    }).join('\n');
  }

  // Fetch a la Mesa Redonda
  async function fetchMesa() {
    const statusInd = document.getElementById('status-indicator');
    try {
      const res = await fetch(rawUrl + '?t=' + new Date().getTime());
      if(res.ok) {
        const text = await res.text();
        
        // Parsear métricas
        const mSync = text.match(/\*\*Última Sincronización:\*\* (.*)/);
        if(mSync) document.getElementById('m-ciclo').innerText = mSync[1].trim();
        
        const mResp = text.match(/\*\*Responsable:\*\* (.*)/);
        if(mResp) document.getElementById('m-agente').innerText = mResp[1].trim();
        
        const count = (text.match(/✅/g) || []).length;
        document.getElementById('m-count').innerText = count;

        contentDiv.innerHTML = applySyntax(text);
        
        // Indicador verde
        statusInd.className = 'status';
        statusInd.innerHTML = '<span class="status-dot"></span>SYNC ACTIVO';
      } else {
        throw new Error("HTTP error");
      }
    } catch(e) {
      console.error("Error leyendo MESA_REDONDA", e);
      // Indicador rojo
      statusInd.className = 'status error';
      statusInd.innerHTML = '<span class="status-dot"></span>ERROR DE SYNC';
    }
  }

  // Refrescar cada 30 segundos
  setInterval(fetchMesa, 30000);
  fetchMesa();

  // Enviar Misión al Creador
  async function enviarMision() {
    const input = document.getElementById('missionInput');
    const texto = input.value.trim();
    if(!texto) return;
    
    try {
      await fetch(webhookBridge, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          evento: 'mensaje_agente',
          detalle: texto,
          agente: 'oraculo'
        })
      });
      alert("Mensaje transmitido al Creador.");
      input.value = '';
    } catch(e) {
      alert("Error enviando el mensaje.");
    }
  }

  // Forzar Ciclo
  async function forzarCiclo() {
    try {
      await fetch(webhookMission, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          tipo: 'forzar_ciclo', agente: 'oraculo_humano',
          mensaje: 'El creador ha forzado un nuevo ciclo desde El Oráculo.'
        })
      });
      alert("Señal enviada a ORIONIX. Ciclo forzado.");
    } catch(e) {
      alert("Error enviando la señal.");
    }
  }

  // Animación de partículas doradas
  const cv = document.getElementById('particles');
  const cx = cv.getContext('2d');
  let W, H, particles = [];
  
  function initCanvas() {
    W = cv.width = window.innerWidth;
    H = cv.height = window.innerHeight;
    particles = [];
    for(let i=0; i<100; i++) {
      particles.push({
        x: Math.random()*W, y: Math.random()*H,
        r: Math.random()*2, v: Math.random()*0.5 + 0.1
      });
    }
  }
  window.addEventListener('resize', initCanvas); initCanvas();
  
  function draw() {
    cx.clearRect(0, 0, W, H);
    cx.fillStyle = 'rgba(232, 200, 106, 0.5)';
    particles.forEach(p => {
      cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, Math.PI*2); cx.fill();
      p.y -= p.v;
      if(p.y < 0) { p.y = H; p.x = Math.random()*W; }
    });
    requestAnimationFrame(draw);
  }
  draw();
</script>

</body>
</html>
