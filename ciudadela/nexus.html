<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORIONIX NEXUS · Chat Multi-Agente</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0d;--bg2:#111114;--bg3:#18181c;--card:#1c1c22;
  --gold:#e8c86a;--gold-dim:rgba(232,200,106,.3);--gold-glow:rgba(232,200,106,.12);
  --text:#f0ece4;--muted:#8a8578;--border:rgba(232,200,106,.15);
  --green:#4ade80;--red:#f87171;--blue:#60a5fa;--purple:#a78bfa;--cyan:#22d3ee;
  --axel:#e8c86a;--qwen:#60a5fa;--claude:#d97757;--chatgpt:#4ade80;
  --copilot:#a78bfa;--antigravity:#22d3ee;--n8n:#f87171;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Cormorant Garamond',serif;height:100vh;overflow:hidden;display:flex}
h1,h2,h3,h4,.btn,.agent-name,.sidebar-title,.cmd{font-family:'Cinzel',serif}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--gold-dim)}
.sidebar{width:280px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:margin-left .3s}
.sidebar.collapsed{margin-left:-280px}
</style>
</head>
<body><p>LOADING...</p></body>
</html>
