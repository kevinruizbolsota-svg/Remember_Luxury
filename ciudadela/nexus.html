<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORIONIX NEXUS · Chat Multi-Agente</title>
<link rel="icon" href="https://raw.githubusercontent.com/kevinruizbolsota-svg/Remember_Luxury/main/ciudadela/unnamed.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070a;--bg2:#0f0f13;--bg3:#161619;--card:rgba(16,16,22,0.95);
  --gold:#e8c86a;--gd:#b89a40;--gl:#f5e0a0;
  --gold-glow:rgba(232,200,106,0.2);
  --text:#f0e8d0;--muted:rgba(240,232,208,0.4);
  --border:rgba(232,200,106,0.13);
  --green:#4ade80;--red:#f87171;--blue:#60a5fa;--purple:#a78bfa;--cyan:#22d3ee;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Cormorant Garamond',serif;display:flex;flex-direction:column}

h1,h2,h3,h4,.cinzel{font-family:'Cinzel',serif}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(232,200,106,0.2);border-radius:2px}

/* ── HEADER ── */
.hdr{
  display:flex;align-items:center;gap:10px;
  padding:11px 20px;
  background:rgba(7,7,10,.95);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(20px);
  flex-shrink:0;
  z-index:100;
}
.hdr-logo{font-family:'Cinzel',serif;font-size:.9rem;font-weight:900;letter-spacing:6px;color:var(--gold);text-shadow:0 0 20px var(--gold-glow)}
.hdr-sep{width:1px;height:18px;background:var(--border);margin:0 4px}
.hdr-agent{display:flex;align-items:center;gap:8px;flex:1}
.hdr-agent-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;transition:all .3s}
.hdr-agent-name{font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:3px;color:var(--text)}
.hdr-agent-role{font-size:.72rem;color:var(--muted);margin-left:4px}
#hdr-mode-badge{display:inline-flex}

/* ── MAIN LAYOUT ── */
.layout{display:flex;flex:1;overflow:hidden;min-height:0}

/* ── SIDEBAR ── */
.sidebar{
  width:220px;flex-shrink:0;
  border-right:1px solid var(--border);
  background:rgba(7,7,10,.9);
  display:flex;flex-direction:column;
  overflow:hidden;
  transition:width .3s;
}
.sidebar.collapsed{width:0;border:none;overflow:hidden}
.sb-top{padding:14px 10px 6px;flex-shrink:0}
.sb-top-title{font-family:'Cinzel',serif;font-size:.44rem;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
.sb-agents{flex:1;overflow-y:auto;padding:4px 6px 10px}

.agent-item{
  display:flex;align-items:center;gap:9px;
  padding:9px 10px;border-radius:8px;
  cursor:pointer;transition:all .2s;
  border:1px solid transparent;
  margin-bottom:3px;
}
.agent-item:hover{background:rgba(255,255,255,.03)}
.agent-item.active{background:rgba(232,200,106,.07);border-color:var(--border)}
.agent-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;transition:box-shadow .3s}
.agent-item.active .agent-dot{box-shadow:0 0 8px currentColor}
.agent-info{min-width:0;flex:1}
.agent-name{font-family:'Cinzel',serif;font-size:.56rem;letter-spacing:.06em;display:block;color:var(--text)}
.agent-role{font-size:.7rem;color:var(--muted);margin-top:1px;display:block}

.sb-section-title{font-family:'Cinzel',serif;font-size:.4rem;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;padding:10px 10px 4px}

.todos-btn{
  display:flex;align-items:center;gap:8px;
  margin:6px 6px 10px;
  padding:9px 12px;border-radius:8px;
  cursor:pointer;border:1px solid var(--border);
  background:rgba(232,200,106,.04);
  transition:all .2s;font-family:'Cinzel',serif;
  font-size:.5rem;letter-spacing:2px;color:var(--gold);text-transform:uppercase;
}
.todos-btn:hover{background:rgba(232,200,106,.08);border-color:rgba(232,200,106,.3)}

/* ── CHAT AREA ── */
.chat-main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

.chat-messages{
  flex:1;overflow-y:auto;
  padding:20px 22px;
  display:flex;flex-direction:column;gap:16px;
}

/* ── MESSAGES ── */
.msg{display:flex;gap:12px;animation:msgIn .3s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{flex-direction:row-reverse}

.msg-avatar{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;border:1px solid;
  background:rgba(0,0,0,.3);
  margin-top:2px;
}
.msg-body{max-width:75%;display:flex;flex-direction:column;gap:5px}
.msg.user .msg-body{align-items:flex-end}

.msg-header{display:flex;align-items:center;gap:8px}
.msg-name{font-family:'Cinzel',serif;font-size:.46rem;letter-spacing:2px;text-transform:uppercase}
.msg-time{font-size:.62rem;color:var(--muted)}
.msg-mode-tag{
  font-family:'Cinzel',serif;font-size:.38rem;letter-spacing:1px;
  padding:1px 6px;border-radius:8px;border:1px solid;
  text-transform:uppercase;
}

.msg-bubble{
  padding:11px 15px;border-radius:10px;
  font-size:.95rem;line-height:1.75;
  border:1px solid;
  position:relative;
  word-break:break-word;
}
.msg.user .msg-bubble{
  background:rgba(232,200,106,.08);
  border-color:rgba(232,200,106,.2);
  color:var(--text);
  border-radius:10px 2px 10px 10px;
}
.msg.agent .msg-bubble{
  background:rgba(255,255,255,.03);
  border-color:var(--border);
  color:var(--text);
  border-radius:2px 10px 10px 10px;
}

/* Files in bubble */
.msg-files{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.msg-file-thumb img{width:80px;height:60px;object-fit:cover;border-radius:5px;border:1px solid var(--border)}
.msg-file-pill{
  display:flex;align-items:center;gap:5px;
  padding:4px 10px;border-radius:20px;
  background:rgba(232,200,106,.06);border:1px solid var(--border);
  font-size:.75rem;color:var(--muted);
}

.msg-typing .msg-bubble{color:var(--muted)}
.typing-dots{display:inline-flex;gap:3px;align-items:center}
.typing-dots span{
  width:5px;height:5px;border-radius:50%;
  background:var(--muted);
  animation:dot-bounce .9s ease-in-out infinite;
}
.typing-dots span:nth-child(2){animation-delay:.15s}
.typing-dots span:nth-child(3){animation-delay:.3s}
@keyframes dot-bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

/* ── WELCOME ── */
.welcome{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;padding:40px;
  color:var(--muted);
}
.welcome h2{
  font-family:'Cinzel',serif;
  font-size:clamp(.9rem,2.5vw,1.2rem);
  letter-spacing:6px;color:var(--gold);margin-bottom:12px;
}
.welcome p{font-size:.9rem;line-height:1.8;max-width:420px}
.welcome .hint{margin-top:20px;font-size:.75rem;letter-spacing:1px}

/* ── INPUT WRAPPER ── */
.input-wrapper{
  padding:12px 16px 14px;
  border-top:1px solid var(--border);
  flex-shrink:0;
}

/* ── TOGGLE SIDEBAR BTN ── */
.toggle-sb-btn{
  width:28px;height:28px;border-radius:6px;
  border:1px solid var(--border);background:transparent;
  color:var(--muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:.8rem;transition:all .2s;flex-shrink:0;
}
.toggle-sb-btn:hover{color:var(--gold);border-color:rgba(232,200,106,.3)}

/* ── RESPONSIVE ── */
@media(max-width:600px){
  .sidebar{width:0;position:absolute;z-index:50;height:100%;top:0}
  .sidebar.open{width:220px}
  .chat-messages{padding:14px}
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <button class="toggle-sb-btn" id="toggleSb" title="Agentes">☰</button>
  <div class="hdr-logo">NEXUS</div>
  <div class="hdr-sep"></div>
  <div class="hdr-agent" id="hdrAgent">
    <div class="hdr-agent-dot" id="hdrDot" style="background:var(--gold)"></div>
    <span class="hdr-agent-name" id="hdrName">ORIONIX</span>
    <span class="hdr-agent-role" id="hdrRole">Selecciona un agente</span>
    <div id="hdr-mode-badge"></div>
  </div>
</div>

<!-- LAYOUT -->
<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sb-top">
      <div class="sb-top-title">Agentes</div>
    </div>
    <div class="sb-agents" id="sbAgents"></div>
  </div>

  <!-- CHAT -->
  <div class="chat-main">
    <div class="chat-messages" id="chatMessages">
      <div class="welcome" id="welcomeMsg">
        <h2>ORIONIX NEXUS</h2>
        <p>Chat multi-agente con voz, archivos e imágenes.<br>Selecciona un agente o escribe a todos.</p>
        <div class="hint">🎙️ Micrófono &nbsp;·&nbsp; 📎 Archivos &nbsp;·&nbsp; 💬 Modos</div>
      </div>
    </div>
    <div class="input-wrapper" id="inputWrapper"></div>
  </div>

</div>

<script>
/* ═══════════════════════════════════════
   CONFIG AGENTES
═══════════════════════════════════════ */
const GATEWAY = 'https://lkevinruizl.app.n8n.cloud/webhook/kabalion-chat';
const MESA    = 'https://lkevinruizl.app.n8n.cloud/webhook/kabalion-mesa';

const AGENTS = [
  { id:'axel',     name:'AXEL',     role:'Director Creativo · IA Principal',  color:'#e8c86a', emoji:'✦', sefirot:'Tiferet'   },
  { id:'claude',   name:'Claude',   role:'Ingeniero Principal · Terminal',     color:'#d97757', emoji:'⚙', sefirot:'Chesed'    },
  { id:'chatgpt',  name:'ChatGPT',  role:'Estrategia · Copywriting',          color:'#4ade80', emoji:'◈', sefirot:'Binah'     },
  { id:'copilot',  name:'Copilot',  role:'GitHub · Commits · Deploy',         color:'#a78bfa', emoji:'⬡', sefirot:'Netzach'   },
  { id:'qwen',     name:'Qwen',     role:'Diseño UI · Interfaces',            color:'#60a5fa', emoji:'◆', sefirot:'Hod'       },
  { id:'n8n',      name:'n8n',      role:'Comandante de Nube · Workflows',    color:'#f87171', emoji:'⚡', sefirot:'Keter'    },
];

let currentAgent = null;
let history = JSON.parse(localStorage.getItem('orx_nexus_history') || '[]');
let chat; // OrionixChat instance

/* ═══════════════════════════════════════
   SIDEBAR RENDER
═══════════════════════════════════════ */
function renderSidebar() {
  const sb = document.getElementById('sbAgents');
  let html = `<div class="todos-btn" onclick="selectAgent('todos')">
    <span>⬡</span> Todos los agentes
  </div>
  <div class="sb-section-title">Agentes</div>`;

  AGENTS.forEach(a => {
    html += `<div class="agent-item" id="sb-${a.id}" onclick="selectAgent('${a.id}')">
      <div class="agent-dot" style="background:${a.color};color:${a.color}"></div>
      <div class="agent-info">
        <span class="agent-name">${a.name}</span>
        <span class="agent-role">${a.role}</span>
      </div>
    </div>`;
  });
  sb.innerHTML = html;
}

/* ═══════════════════════════════════════
   SELECT AGENT
═══════════════════════════════════════ */
function selectAgent(id) {
  currentAgent = id;

  // Update sidebar active
  document.querySelectorAll('.agent-item').forEach(el => el.classList.remove('active'));
  const sbEl = document.getElementById('sb-' + id);
  if (sbEl) sbEl.classList.add('active');

  // Update header
  if (id === 'todos') {
    document.getElementById('hdrDot').style.background = 'var(--gold)';
    document.getElementById('hdrName').textContent = 'LIGA ORIONIX';
    document.getElementById('hdrRole').textContent = 'Todos los agentes activos';
  } else {
    const a = AGENTS.find(x => x.id === id);
    document.getElementById('hdrDot').style.background = a.color;
    document.getElementById('hdrName').textContent = a.name;
    document.getElementById('hdrRole').textContent = a.role;
  }

  // Hide welcome
  const welcome = document.getElementById('welcomeMsg');
  if (welcome) welcome.remove();

  // Restore history for this agent
  renderHistory(id);

  // Close sidebar on mobile
  if (window.innerWidth < 600) {
    document.getElementById('sidebar').classList.remove('open');
  }

  // Focus input
  if (chat) setTimeout(() => chat.focus(), 100);
}

/* ═══════════════════════════════════════
   RENDER HISTORY
═══════════════════════════════════════ */
function renderHistory(agentId) {
  const msgs = document.getElementById('chatMessages');
  msgs.innerHTML = '';
  const relevant = history.filter(m => m.agentId === agentId || m.agentId === 'todos');
  relevant.forEach(m => appendMsgEl(m));
}

/* ═══════════════════════════════════════
   APPEND MESSAGE ELEMENT
═══════════════════════════════════════ */
function appendMsgEl(m) {
  const msgs = document.getElementById('chatMessages');
  const el   = document.createElement('div');
  const modeColors = { chat:'#e8c86a', image:'#60a5fa', video:'#f87171', web:'#4ade80' };
  const modeIcons  = { chat:'💬', image:'🖼️', video:'🎥', web:'🌐' };

  const agent = AGENTS.find(a => a.id === m.agentId) || { name:'ORIONIX', color:'var(--gold)', emoji:'✦' };

  if (m.role === 'user') {
    const filesHtml = (m.files||[]).map(f => {
      if (f.type?.startsWith('image/'))
        return `<div class="msg-file-thumb"><img src="${f.dataUrl}" alt="${f.name}"></div>`;
      return `<div class="msg-file-pill">${fileIcon(f.type)} ${f.name}</div>`;
    }).join('');

    const modeTag = m.mode && m.mode !== 'chat'
      ? `<span class="msg-mode-tag" style="color:${modeColors[m.mode]};border-color:${modeColors[m.mode]}">
           ${modeIcons[m.mode]} ${m.mode}
         </span>` : '';

    el.className = 'msg user';
    el.innerHTML = `
      <div class="msg-avatar" style="border-color:rgba(232,200,106,.25);color:var(--gold)">👤</div>
      <div class="msg-body">
        <div class="msg-header">
          ${modeTag}
          <span class="msg-time">${m.time || ''}</span>
        </div>
        <div class="msg-bubble">
          ${m.text ? escHtml(m.text) : ''}
          ${filesHtml ? `<div class="msg-files">${filesHtml}</div>` : ''}
        </div>
      </div>`;
  } else {
    el.className = 'msg agent';
    el.innerHTML = `
      <div class="msg-avatar" style="border-color:${agent.color}33;color:${agent.color}">${agent.emoji}</div>
      <div class="msg-body">
        <div class="msg-header">
          <span class="msg-name" style="color:${agent.color}">${agent.name}</span>
          <span class="msg-time">${m.time || ''}</span>
        </div>
        <div class="msg-bubble">${formatResponse(m.text)}</div>
      </div>`;
  }

  msgs.appendChild(el);
  msgs.scrollTop = msgs.scrollHeight;
}

/* ═══════════════════════════════════════
   TYPING INDICATOR
═══════════════════════════════════════ */
function showTyping(agentId) {
  const msgs  = document.getElementById('chatMessages');
  const agent = AGENTS.find(a => a.id === agentId) || { name:'...', color:'var(--gold)', emoji:'✦' };
  const el    = document.createElement('div');
  el.className = 'msg agent msg-typing';
  el.id = 'typing-indicator';
  el.innerHTML = `
    <div class="msg-avatar" style="border-color:${agent.color}33;color:${agent.color}">${agent.emoji}</div>
    <div class="msg-body">
      <div class="msg-header"><span class="msg-name" style="color:${agent.color}">${agent.name}</span></div>
      <div class="msg-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>
    </div>`;
  msgs.appendChild(el);
  msgs.scrollTop = msgs.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

/* ═══════════════════════════════════════
   SEND MESSAGE
═══════════════════════════════════════ */
async function handleSend(payload) {
  if (!currentAgent) {
    chat.showStatus('Selecciona un agente primero', 'err', 3000);
    return;
  }

  const now = new Date().toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit' });

  // Add user message
  const userMsg = {
    role: 'user', agentId: currentAgent,
    text: payload.text, files: payload.files,
    mode: payload.mode, time: now,
  };
  history.push(userMsg);
  appendMsgEl(userMsg);

  // Show typing
  showTyping(currentAgent === 'todos' ? 'axel' : currentAgent);
  chat.showStatus('Contactando agente...', '', 0);

  try {
    let respuesta, agentId = currentAgent;

    if (currentAgent === 'todos') {
      // Mesa de mando
      const res  = await fetch(MESA, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          mision:   payload.text,
          prioridad:'normal',
          tipo:     payload.mode,
          origen:   'nexus',
        }),
      });
      const data = await res.json();
      respuesta  = data.reporte || data.respuesta || JSON.stringify(data);
      agentId    = 'todos';
    } else {
      // Gateway individual
      const res  = await fetch(GATEWAY, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          mensaje: payload.text,
          agente:  currentAgent,
          modo:    payload.mode,
          archivos: payload.files.map(f => ({ nombre:f.name, tipo:f.type })),
        }),
      });
      const data = await res.json();
      respuesta  = data.respuesta || data.response || data.mensaje || JSON.stringify(data);
    }

    removeTyping();
    chat.showStatus('');

    const agentMsg = { role:'agent', agentId, text: respuesta, time: now };
    history.push(agentMsg);
    appendMsgEl(agentMsg);

    // Persist
    if (history.length > 200) history = history.slice(-200);
    localStorage.setItem('orx_nexus_history', JSON.stringify(history));

  } catch(e) {
    removeTyping();
    chat.showStatus('Error de conexión — intenta de nuevo', 'err', 5000);
    const errMsg = { role:'agent', agentId: currentAgent, text:'⚠️ Error de conexión. Verifica que los workflows están activos.', time: now };
    appendMsgEl(errMsg);
  }
}

/* ═══════════════════════════════════════
   UTILS
═══════════════════════════════════════ */
function escHtml(t) {
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function formatResponse(t) {
  if (!t) return '';
  return escHtml(t).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>');
}

function fileIcon(type) {
  if (!type) return '📎';
  if (type.startsWith('image/')) return '🖼️';
  if (type.startsWith('video/')) return '🎥';
  if (type.includes('pdf'))      return '📄';
  if (type.includes('audio'))    return '🎵';
  return '📎';
}

/* ═══════════════════════════════════════
   INIT
═══════════════════════════════════════ */
renderSidebar();

// Toggle sidebar
document.getElementById('toggleSb').addEventListener('click', () => {
  const sb = document.getElementById('sidebar');
  if (window.innerWidth < 600) {
    sb.classList.toggle('open');
  } else {
    sb.classList.toggle('collapsed');
  }
});

// Load OrionixChat component and mount it
(function loadChat() {
  const script = document.createElement('script');
  // Inline the component so this page is self-contained
  script.textContent = `${ORIONIX_CHAT_INLINE}`;
  document.head.appendChild(script);

  window.addEventListener('load', () => {
    chat = OrionixChat.mount('#inputWrapper', {
      badgeEl:  document.getElementById('hdr-mode-badge'),
      sendLabel: 'Enviar',
      onSend:   handleSend,
      onModeChange: (mode, m) => {
        // Badge already handled by the component
      },
    });
  });
})();
</script>

<!-- OrionixChat component (self-contained) -->
<script id="orionix-chat-component">
</script>

<script>
// Mount OrionixChat after page load (component defined above)
document.addEventListener('DOMContentLoaded', () => {
  renderSidebar();
  chat = OrionixChat.mount('#inputWrapper', {
    badgeEl:  document.getElementById('hdr-mode-badge'),
    sendLabel: 'Enviar',
    onSend:   handleSend,
  });
});
</script>

<script src="orionix-profile.js"></script>
</body>
</html>
