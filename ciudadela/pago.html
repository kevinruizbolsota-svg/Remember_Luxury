<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORIONIX · Confirmación de Pago</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--gold:#e8c86a;--gd:#b89a40;--bg:#0b0b0d;--bg2:rgba(14,13,20,0.97);--b:rgba(232,200,106,0.12);--ba:rgba(232,200,106,0.4);--text:#f0e8d0;--dim:rgba(240,232,208,0.4)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cormorant Garamond',serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#cv{position:fixed;inset:0;z-index:0;pointer-events:none}

.box{width:100%;max-width:560px;position:relative;z-index:1;text-align:center}

/* SUCCESS STATE */
.success-ico{width:80px;height:80px;border-radius:50%;background:rgba(46,204,113,.12);border:2px solid rgba(46,204,113,.4);display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 20px;animation:popIn .5s cubic-bezier(.34,1.56,.64,1) both}
@keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.pend-ico{width:80px;height:80px;border-radius:50%;background:rgba(255,152,0,.1);border:2px solid rgba(255,152,0,.35);display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 20px}

.title{font-family:'Cinzel',serif;font-size:1.5rem;font-weight:900;letter-spacing:.12em;margin-bottom:8px}
.sub{font-size:.92rem;color:var(--dim);font-style:italic;max-width:420px;margin:0 auto 24px;line-height:1.6}

.card{background:var(--bg2);border:1px solid var(--b);border-radius:12px;padding:22px;margin-bottom:14px;position:relative;overflow:hidden;text-align:left}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

.order-num{font-family:'Cinzel',serif;font-size:.52rem;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;margin-bottom:10px}
.on-val{font-family:'Cinzel',serif;font-size:1rem;font-weight:700;color:var(--text);margin-bottom:14px}
.drow{display:flex;justify-content:space-between;margin-bottom:7px}
.drow:last-child{margin-bottom:0;padding-top:8px;border-top:1px solid var(--b)}
.dl{font-size:.82rem;color:var(--dim)}
.dv{font-family:'Cinzel',serif;font-size:.78rem;color:var(--text)}
.dv.gold{color:var(--gold)}

.steps-box{background:rgba(255,255,255,.025);border:1px solid var(--b);border-radius:8px;padding:14px;margin-top:12px}
.steps-h{font-family:'Cinzel',serif;font-size:.5rem;letter-spacing:.16em;color:var(--gold);text-transform:uppercase;margin-bottom:10px}
.step-item{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.step-item:last-child{margin-bottom:0}
.sico{width:22px;height:22px;border-radius:50%;background:rgba(232,200,106,.1);border:1px solid rgba(232,200,106,.3);display:flex;align-items:center;justify-content:center;font-size:.6rem;flex-shrink:0;margin-top:1px}
.stxt{font-size:.8rem;color:var(--text);line-height:1.5}
.stxt span{color:var(--dim)}

.actions{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.abtn{display:block;padding:12px;border-radius:8px;font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.12em;text-decoration:none;transition:all .28s;text-align:center}
.abtn.pri{background:var(--gold);color:var(--bg);box-shadow:0 0 16px rgba(232,200,106,.18)}
.abtn.pri:hover{background:var(--gd)}
.abtn.sec{border:1px solid var(--b);color:var(--dim)}
.abtn.sec:hover{color:var(--text);border-color:rgba(232,200,106,.25)}
.abtn.tg{background:rgba(0,136,204,.1);color:#29b6f6;border:1px solid rgba(0,136,204,.25)}
.abtn.tg:hover{background:rgba(0,136,204,.18)}

/* CONFETTI */
.confetti-wrap{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.cf{position:absolute;width:8px;height:8px;border-radius:50%;animation:fall linear forwards}
@keyframes fall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="confetti-wrap" id="confetti"></div>

<div class="box">
  <div id="content"><!-- generado por JS --></div>
</div>

<script>
const params=new URLSearchParams(location.search);
const metodo=params.get('metodo')||'paypal';
const total=params.get('total')||'0.00';
const nombre=params.get('nombre')||'Cliente';

const orderNum='ORX-'+Date.now().toString(36).toUpperCase().slice(-8);

function showSuccess(){
  document.getElementById('content').innerHTML=`
    <div class="success-ico">✓</div>
    <div class="title" style="color:#2ecc71">¡Pedido Recibido!</div>
    <p class="sub">Tu pedido ha sido registrado en el universo ORIONIX. Te contactaremos para coordinar el siguiente paso.</p>

    <div class="card">
      <div class="order-num">Número de Pedido</div>
      <div class="on-val">${orderNum}</div>
      <div class="drow"><span class="dl">Total</span><span class="dv gold">€${total}</span></div>
      <div class="drow"><span class="dl">Método</span><span class="dv">${{paypal:'PayPal',telegram:'Telegram · Directo',transferencia:'Transferencia Bancaria'}[metodo]||metodo}</span></div>
      <div class="drow"><span class="dl">Estado</span><span class="dv" style="color:#f39c12">Pendiente de confirmación</span></div>
    </div>

    <div class="card">
      <div class="steps-h">✦ Próximos Pasos</div>
      ${metodo==='paypal'?`
        <div class="step-item"><div class="sico">1</div><div class="stxt">Completa el pago en PayPal <span>— si no lo has hecho ya</span></div></div>
        <div class="step-item"><div class="sico">2</div><div class="stxt">Recibirás confirmación por email en <span>menos de 2 horas</span></div></div>
        <div class="step-item"><div class="sico">3</div><div class="stxt">Tu pedido se procesará y recibirás el seguimiento <span>por Telegram</span></div></div>
      `:metodo==='telegram'?`
        <div class="step-item"><div class="sico">1</div><div class="stxt">Ya abrimos Telegram con Kevin — <span>confirma allí los detalles</span></div></div>
        <div class="step-item"><div class="sico">2</div><div class="stxt">Kevin coordinará el pago y envío <span>en menos de 24h</span></div></div>
        <div class="step-item"><div class="sico">3</div><div class="stxt">Una vez confirmado, tu pedido se despacha <span>inmediatamente</span></div></div>
      `:`
        <div class="step-item"><div class="sico">1</div><div class="stxt">Recibirás los datos bancarios en tu email <span>en menos de 1 hora</span></div></div>
        <div class="step-item"><div class="sico">2</div><div class="stxt">Realiza la transferencia indicando: <span>Pedido ${orderNum}</span></div></div>
        <div class="step-item"><div class="sico">3</div><div class="stxt">Confirma el pago por Telegram a <span>@KevinRuizBolsota</span></div></div>
      `}
    </div>

    <div class="actions">
      ${metodo==='telegram'?`<a href="https://t.me/KevinRuizBolsota" class="abtn tg" target="_blank">✈️ Abrir Telegram con Kevin</a>`:''}
      <a href="articulos.html" class="abtn pri">Seguir Comprando →</a>
      <a href="hub.html" class="abtn sec">← Volver al Portal</a>
    </div>`;

  // Clear cart
  localStorage.removeItem('orionix_cart');

  // Confetti
  const cf=document.getElementById('confetti');
  const colors=['#e8c86a','#f5e0a0','#b89a40','#fff9e0','#6a3d9a'];
  for(let i=0;i<55;i++){
    const el=document.createElement('div');
    el.className='cf';
    el.style.cssText=`left:${Math.random()*100}%;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*.8}s;width:${4+Math.random()*8}px;height:${4+Math.random()*8}px;border-radius:${Math.random()>.5?'50%':'2px'}`;
    cf.appendChild(el);
  }
}

function showPending(){
  document.getElementById('content').innerHTML=`
    <div class="pend-ico">⏳</div>
    <div class="title" style="color:#ff9800">Pedido Registrado</div>
    <p class="sub">Hemos recibido tu pedido. Coordinaremos el pago contigo directamente por Telegram.</p>
    <div class="card">
      <div class="order-num">Referencia</div>
      <div class="on-val">${orderNum}</div>
    </div>
    <div class="actions">
      <a href="https://t.me/KevinRuizBolsota" class="abtn tg" target="_blank">✈️ Contactar a Kevin por Telegram</a>
      <a href="articulos.html" class="abtn sec">← Ver más artículos</a>
    </div>`;
}

if(metodo==='paypal')showSuccess();
else if(metodo==='telegram')showSuccess();
else showPending();

(function(){const c=document.getElementById('cv'),ctx=c.getContext('2d');function r(){c.width=innerWidth;c.height=innerHeight}r();addEventListener('resize',r);const s=Array.from({length:50},()=>({x:Math.random(),y:Math.random(),r:Math.random()*.8+.15,a:Math.random(),da:(Math.random()-.5)*.005}));function d(){ctx.clearRect(0,0,c.width,c.height);s.forEach(p=>{p.a=Math.max(.03,Math.min(.75,p.a+p.da));if(p.a<=.03||p.a>=.75)p.da*=-1;ctx.beginPath();ctx.arc(p.x*c.width,p.y*c.height,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(232,200,106,${p.a*.4})`;ctx.fill();});requestAnimationFrame(d);}d();})();
</script>
</body>
</html>
