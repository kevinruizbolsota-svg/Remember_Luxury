<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Remember Luxury · Productos pendientes</title><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet"><style>:root{--bg:#050507;--panel:#0d0d11;--gold:#e5c56a;--muted:#9b978d;--line:rgba(229,197,106,.15)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17130a,#050507 48%);color:#f2ead8;font-family:'Cormorant Garamond',serif}.nav{padding:24px 6vw;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font:700 13px Cinzel;letter-spacing:.2em;color:var(--gold)}.nav a{color:var(--muted);text-decoration:none;font:500 10px Cinzel;letter-spacing:.14em;text-transform:uppercase}.wrap{max-width:1200px;margin:auto;padding:70px 24px}.ey{font:500 10px Cinzel;letter-spacing:.3em;color:var(--gold)}h1{font:400 clamp(42px,7vw,72px);margin:14px 0 10px}.lead{color:var(--muted);font-size:18px;max-width:700px;line-height:1.6}.status{margin:28px 0;padding:16px 20px;border:1px solid var(--line);background:rgba(229,197,106,.04);color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}.card{background:var(--panel);border:1px solid var(--line);overflow:hidden}.img{aspect-ratio:4/5;background:#111}.img img{width:100%;height:100%;object-fit:cover}.body{padding:16px}.cat{font:500 8px Cinzel;letter-spacing:.18em;color:var(--gold)}.name{font-size:19px;margin:7px 0}.meta{font-size:13px;color:var(--muted)}.pending{margin-top:12px;font:500 8px Cinzel;letter-spacing:.12em;color:#c7b68d;text-transform:uppercase}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><header class="nav"><div class="brand">REMEMBER LUXURY</div><a href="articulos.html">← Volver a la tienda</a></header><main class="wrap"><div class="ey">CATÁLOGO · AWIN</div><h1>Productos pendientes.</h1><p class="lead">Estas piezas están conservadas aquí hasta encontrar un anunciante y un enlace de afiliado verificable. No se presentan como comprables por afiliación hasta completar la validación.</p><div class="status" id="status">Cargando catálogo maestro…</div><section class="grid" id="grid"></section></main><script>const DATA='../Gaia/Data/products/todos_1450.json';const FALLBACK='https://picsum.photos/seed/remember/700/900';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch(DATA).then(r=>r.json()).then(a=>{const items=Array.isArray(a)?a:[];document.getElementById('status').textContent=items.length.toLocaleString('es-ES')+' productos pendientes de validación Awin.';document.getElementById('grid').innerHTML=items.map(p=>`<article class="card"><div class="img"><img src="${esc(p.imagen_url||p.image||p.imagen||FALLBACK)}" loading="lazy" onerror="this.src='${FALLBACK}'"></div><div class="body"><div class="cat">${esc((p.categoria||p.category||'OTROS').toUpperCase())}</div><div class="name">${esc(p.nombre||p.name||'Producto')}</div><div class="meta">SKU: ${esc(p.sku||'—')}</div><div class="pending">Pendiente de enlace afiliado</div></div></article>`).join('')}).catch(()=>document.getElementById('status').textContent='No se pudo cargar el catálogo maestro.')</script></body></html>
