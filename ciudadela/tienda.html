<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>REMEMBER LUXURY | Tienda</title>
<meta name="description" content="Tienda oficial de La Ciudadela: agentes de inteligencia artificial, ropa premium y productos digitales.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --oro:#e8c86a; --oro-med:#c8a24a; --oro-osc:#8a6a24;
    --bg:#0b0b0d; --bg2:#141118; --panel:#141117; --panel2:#1c1922; --border:#2a2530;
    --texto:#e9ddc4; --tenue:#b8a982;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:'Cormorant Garamond',Georgia,serif;background:var(--bg);color:var(--texto);min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased}
  h1,h2,h3,.marca,.btn,.cinzel{font-family:'Cinzel',serif}
  .oro{background:linear-gradient(92deg,#8a6a24,#e8c86a 25%,#fff6d6 50%,#e8c86a 75%,#8a6a24);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:brilloOro 6s linear infinite}
  @keyframes brilloOro{to{background-position:200% center}}
  a{color:inherit;text-decoration:none}

  nav{position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:16px 6vw;background:rgba(11,11,13,.92);border-bottom:1px solid rgba(232,200,106,.2);backdrop-filter:blur(10px)}
  nav .marca{font-size:1.1rem;font-weight:700;letter-spacing:4px;color:var(--oro)}
  nav .links a{color:var(--tenue);margin-left:22px;font-size:.72rem;letter-spacing:2px;text-transform:uppercase;font-family:'Cinzel',serif;transition:color .25s}
  nav .links a:hover{color:var(--oro)}
  .cartbtn{position:relative;cursor:pointer;color:var(--oro);font-size:1.3rem}
  .cartbtn .badge{position:absolute;top:-8px;right:-10px;background:linear-gradient(180deg,#f4e2a0,#c8a24a);color:#1a1409;font-size:.62rem;font-weight:700;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif}

  header.hero{text-align:center;padding:70px 6vw 40px;background:radial-gradient(ellipse at 50% 0%,rgba(232,200,106,.12),transparent 60%)}
  header.hero .eyebrow{font-family:'Cinzel',serif;letter-spacing:6px;font-size:.7rem;color:var(--oro-med);text-transform:uppercase}
  header.hero h1{font-size:clamp(2.2rem,7vw,4.2rem);font-weight:900;letter-spacing:5px;margin:14px 0}
  header.hero p{color:var(--tenue);font-size:1.2rem;font-style:italic;max-width:600px;margin:0 auto}

  .filtros{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:10px 6vw 30px}
  .filtro{background:var(--panel2);border:1px solid var(--border);color:var(--tenue);border-radius:20px;padding:8px 18px;font-size:.78rem;cursor:pointer;font-family:'Cinzel',serif;letter-spacing:1px;transition:all .2s}
  .filtro:hover{border-color:var(--oro);color:var(--oro)}
  .filtro.on{background:linear-gradient(180deg,#f4e2a0,#c8a24a);color:#1a1409;border-color:var(--oro)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:28px;max-width:1200px;margin:0 auto;padding:0 6vw 80px}
  .prod{background:linear-gradient(160deg,rgba(232,200,106,.06),rgba(20,17,24,.5));border:1px solid rgba(232,200,106,.18);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;transition:transform .4s,box-shadow .4s,border-color .4s}
  .prod:hover{transform:translateY(-8px);border-color:var(--oro);box-shadow:0 24px 50px rgba(0,0,0,.55)}
  .prod .img{aspect-ratio:1;background:#0f0d12 center/cover no-repeat;position:relative}
  .prod .cat{position:absolute;top:12px;left:12px;background:rgba(11,11,13,.8);color:var(--oro);font-size:.62rem;letter-spacing:1.5px;text-transform:uppercase;padding:5px 11px;border-radius:12px;border:1px solid rgba(232,200,106,.3);font-family:'Cinzel',serif}
  .prod .body{padding:20px;display:flex;flex-direction:column;flex:1}
  .prod h3{font-size:1.15rem;letter-spacing:1px;color:var(--oro);margin-bottom:8px}
  .prod .desc{font-size:1rem;color:var(--tenue);flex:1;margin-bottom:16px}
  .prod .precio{font-family:'Cinzel',serif;font-size:1.5rem;color:#fff6d6;margin-bottom:14px}
  .prod .precio small{font-size:.7rem;color:var(--tenue);letter-spacing:1px}
  .btn{display:block;text-align:center;cursor:pointer;padding:13px;font-size:.75rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#1a1409;border:none;border-radius:6px;background:linear-gradient(180deg,#f4e2a0,#e8c86a 45%,#c8a24a);box-shadow:0 6px 18px rgba(0,0,0,.4),inset 0 1px 1px rgba(255,255,255,.6);transition:transform .25s,box-shadow .25s;font-family:'Cinzel',serif;width:100%}
  .btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(232,200,106,.35)}
  .btn.ghost{background:transparent;color:var(--oro);border:1px solid var(--oro-med);box-shadow:none;margin-top:8px}

  .estado{text-align:center;color:var(--tenue);padding:60px;font-size:1.2rem;font-style:italic}

  /* CARRITO */
  #carrito{position:fixed;top:0;right:0;width:min(400px,90vw);height:100%;background:var(--panel);border-left:1px solid var(--border);z-index:300;transform:translateX(105%);transition:transform .3s;display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(0,0,0,.5)}
  #carrito.open{transform:none}
  #carrito .chead{padding:20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
  #carrito .chead h2{font-size:1.1rem;color:var(--oro);letter-spacing:2px}
  #carrito .cerrar{cursor:pointer;color:var(--tenue);font-size:1.5rem}
  #carrito .items{flex:1;overflow-y:auto;padding:14px}
  .citem{display:flex;gap:12px;padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:10px;align-items:center}
  .citem img{width:54px;height:54px;border-radius:6px;object-fit:cover;background:#0f0d12}
  .citem .info{flex:1;font-size:.95rem}
  .citem .info b{color:var(--oro);display:block;font-family:'Cinzel',serif;font-size:.9rem}
  .citem .quitar{cursor:pointer;color:#c0392b;font-size:1.1rem}
  #carrito .foot{padding:18px 20px;border-top:1px solid var(--border)}
  #carrito .total{display:flex;justify-content:space-between;font-family:'Cinzel',serif;font-size:1.2rem;color:#fff6d6;margin-bottom:14px}
  .vacio{text-align:center;color:var(--tenue);padding:40px;font-style:italic}
  #overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:250;display:none}
  #overlay.on{display:block}

  footer{text-align:center;padding:36px 6vw;border-top:1px solid rgba(232,200,106,.15);color:var(--tenue);font-size:.8rem;letter-spacing:2px;font-family:'Cinzel',serif;text-transform:uppercase}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="marca">&#128081; REMEMBER LUXURY</a>
  <div class="links" style="display:flex;align-items:center;gap:6px">
    <a href="index.html">Inicio</a>
    <a href="index.html#contacto">Contacto</a>
    <span class="cartbtn" onclick="abrirCarrito()">&#128722;<span class="badge" id="badge">0</span></span>
  </div>
</nav>

<header class="hero">
  <div class="eyebrow">Tienda Oficial</div>
  <h1 class="oro">EL MERCADO DE LA CIUDADELA</h1>
  <p>Agentes de inteligencia, prendas de poder y tesoros digitales. Todo forjado con la esencia de Remember Luxury.</p>
</header>

<div class="filtros" id="filtros"></div>
<div class="grid" id="grid"><div class="estado" id="estado">Invocando el mercado&hellip;</div></div>

<div id="overlay" onclick="cerrarCarrito()"></div>
<aside id="carrito">
  <div class="chead"><h2>Tu Cofre</h2><span class="cerrar" onclick="cerrarCarrito()">&times;</span></div>
  <div class="items" id="citems"><div class="vacio">Tu cofre esta vacio.</div></div>
  <div class="foot">
    <div class="total"><span>Total</span><span id="total">$0</span></div>
    <button class="btn" id="pagarBtn" onclick="pagar()">Pagar con PayPal</button>
  </div>
</aside>

<footer>Remember Luxury &mdash; La Ciudadela &copy; 2026</footer>

<script>
const API = "https://kevinruiz.app.n8n.cloud/webhook/tienda-productos";
let PRODUCTOS = [], CARRITO = [], CAT_ACTUAL = "Todos";

function money(p, m){ return (m==="USD"?"$":"") + Number(p).toLocaleString() + (m&&m!=="USD"?(" "+m):"") ; }

async function cargar(){
  try{
    const r = await fetch(API, {cache:"no-store"});
    const d = await r.json();
    PRODUCTOS = (d.productos||[]);
    if(!PRODUCTOS.length){ document.getElementById("estado").textContent = "Aun no hay productos en el mercado."; return; }
    pintarFiltros(); pintar();
  }catch(e){
    document.getElementById("estado").textContent = "No se pudo cargar el mercado. Intenta de nuevo.";
  }
}

function pintarFiltros(){
  const cats = ["Todos", ...Array.from(new Set(PRODUCTOS.map(p=>p.categoria)))];
  document.getElementById("filtros").innerHTML = cats.map(c =>
    '<div class="filtro'+(c===CAT_ACTUAL?' on':'')+'" onclick="filtrar(\''+c.replace(/'/g,"")+'\')">'+c+'</div>'
  ).join("");
}
function filtrar(c){ CAT_ACTUAL=c; pintarFiltros(); pintar(); }

function pintar(){
  const lista = CAT_ACTUAL==="Todos" ? PRODUCTOS : PRODUCTOS.filter(p=>p.categoria===CAT_ACTUAL);
  document.getElementById("grid").innerHTML = lista.map((p,i)=>{
    const idx = PRODUCTOS.indexOf(p);
    return '<div class="prod">'
      + '<div class="img" style="background-image:url(\''+p.imagen+'\')"><span class="cat">'+p.categoria+'</span></div>'
      + '<div class="body"><h3>'+p.nombre+'</h3>'
      + '<div class="desc">'+p.descripcion+'</div>'
      + '<div class="precio">'+money(p.precio,p.moneda)+' <small>'+(p.moneda||"USD")+'</small></div>'
      + '<button class="btn" onclick="agregar('+idx+')">Agregar al cofre</button>'
      + (p.pago ? '<a class="btn ghost" href="'+p.pago+'" target="_blank">Comprar ya</a>' : '')
      + '</div></div>';
  }).join("");
}

function agregar(i){ CARRITO.push(PRODUCTOS[i]); actualizar(); abrirCarrito(); }
function quitar(i){ CARRITO.splice(i,1); actualizar(); }
function actualizar(){
  document.getElementById("badge").textContent = CARRITO.length;
  const cont = document.getElementById("citems");
  if(!CARRITO.length){ cont.innerHTML = '<div class="vacio">Tu cofre esta vacio.</div>'; }
  else{
    cont.innerHTML = CARRITO.map((p,i)=>
      '<div class="citem"><img src="'+p.imagen+'"><div class="info"><b>'+p.nombre+'</b>'+money(p.precio,p.moneda)+'</div><span class="quitar" onclick="quitar('+i+')">&times;</span></div>'
    ).join("");
  }
  const total = CARRITO.reduce((s,p)=>s+Number(p.precio||0),0);
  document.getElementById("total").textContent = "$"+total.toLocaleString();
}
function abrirCarrito(){ document.getElementById("carrito").classList.add("open"); document.getElementById("overlay").classList.add("on"); }
function cerrarCarrito(){ document.getElementById("carrito").classList.remove("open"); document.getElementById("overlay").classList.remove("on"); }

function pagar(){
  if(!CARRITO.length){ alert("Tu cofre esta vacio."); return; }
  // Si todos los productos tienen el mismo link de pago, abre ese; si no, abre el del primero.
  const link = CARRITO[0].pago || "https://www.paypal.com/";
  window.open(link, "_blank");
}

cargar();
</script>
</body>
</html>
