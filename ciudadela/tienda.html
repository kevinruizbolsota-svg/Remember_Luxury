var ALL = PRODUCTOS;
var CAT = 'TODOS';
var CAT_LABELS = {'TODOS':'Todos','MODA':'Moda','FASHION STYLE':'Fashion Style','MI DINASTIA':'Mi Dinastía','DIGITAL':'Digital','HOGAR':'Hogar','TECH':'Tech','BIENESTAR':'Bienestar','VIAJE':'Viaje','MASCOTAS':'Mascotas'};

function getCart(){try{return JSON.parse(localStorage.getItem('orionix_cart')||'[]')}catch(e){return[]}}
function saveCart(c){localStorage.setItem('orionix_cart',JSON.stringify(c))}
function updateBadge(){var b=document.getElementById('cart-badge');if(b)b.textContent=getCart().reduce(function(a,x){return a+(x.qty||1)},0)}
function addToCart(id,nombre,precio,imagen){var c=getCart();var ex=c.find(function(x){return x.id===id});if(ex){ex.qty=(ex.qty||1)+1}else{c.push({id:id,nombre:nombre,precio:precio,imagen:imagen,qty:1})}saveCart(c);updateBadge();showToast('✦ Añadido: '+nombre.substring(0,32))}
function showToast(m){var t=document.getElementById('toast');if(!t)return;t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on')},2500)}

function buildFilters(){
  var cats=Array.from(new Set(ALL.map(function(p){return p.categoria}).filter(Boolean))).sort();
  var wrap=document.getElementById('filt-wrap');if(!wrap)return;
  wrap.innerHTML=['TODOS'].concat(cats).map(function(c){return '<button class="filt'+(c===CAT?' on':'')+'" onclick="setCat(''+c+'')">'+(CAT_LABELS[c]||c)+'</button>';}).join('');
}
function setCat(c){CAT=c;buildFilters();render()}
function render(){
  var q=(document.getElementById('q')||{}).value||'';q=q.toLowerCase();
  var f=ALL.filter(function(p){return(CAT==='TODOS'||(p.categoria||'')===CAT)&&(!q||p.nombre.toLowerCase().indexOf(q)>-1||(p.descripcion||'').toLowerCase().indexOf(q)>-1)});
  var cnt=document.getElementById('count');if(cnt)cnt.textContent=f.length;
  var g=document.getElementById('grid');if(!g)return;
  if(!f.length){g.innerHTML='<div class="empty"><p>Sin resultados para "'+q+'"</p></div>';return}
  g.innerHTML=f.map(function(p){
    var img=p.imagen_url||('https://picsum.photos/seed/'+p.id+'/400/400');
    var pr='€'+(+p.precio).toFixed(2);
    var n=String(p.nombre).replace(/\/g,'\\').replace(/'/g,"\'");
    var im=img.replace(/'/g,"\'");
    return '<div class="card"><img src="'+img+'" alt="'+p.nombre+'" loading="lazy" onerror="this.src=\'https://picsum.photos/seed/'+p.id+'/400/400\'"><div class="card-body"><div class="card-cat">'+(p.categoria||'')+'</div><div class="card-name">'+p.nombre+'</div><div class="card-desc">'+(p.descripcion||'')+'</div><div class="card-footer"><span class="card-price">'+pr+'</span><button class="btn-add" onclick="addToCart('+p.id+',\''+n+'\','+p.precio+',\''+im+'\')">+ Carrito</button></div></div></div>';
  }).join('');
}
updateBadge();buildFilters();render();
</script>
