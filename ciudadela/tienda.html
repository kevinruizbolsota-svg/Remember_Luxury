<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORIONIX · La Tienda del Imperio</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:image" content="https://raw.githubusercontent.com/kevinruizbolsota-svg/Remember_Luxury/main/ciudadela/unnamed.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#e8c86a;--gd:#b89a40;--gl:#f5e0a0;
  --glow:rgba(232,200,106,0.22);--bg:#0b0b0d;--bg2:rgba(14,13,20,0.96);
  --b:rgba(232,200,106,0.12);--ba:rgba(232,200,106,0.4);
  --text:#f0e8d0;--dim:rgba(240,232,208,0.4);--purple:#6a3d9a;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cormorant Garamond',serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
#cv{position:fixed;inset:0;z-index:0;pointer-events:none}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;height:56px;z-index:900;display:flex;align-items:center;gap:0;padding:0 20px;background:rgba(11,11,13,.98);border-bottom:1px solid var(--b);backdrop-filter:blur(14px)}
