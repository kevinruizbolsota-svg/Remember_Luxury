<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORIONIX · Universo de la Mesa de Forjadores</title>
<meta name="description" content="El hogar viviente de los agentes de inteligencia artificial de Orionix. Un universo donde cada planeta es un agente con vida propia que aprende cada dia.">
<style>
  :root{--oro:#e8c86a;--oro2:#c9a94e;--tinta:#eaf0ff;--tenue:#8a93b0;--panel:rgba(12,16,32,.72);--linea:rgba(232,200,106,.22)}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:"Times New Roman",Georgia,serif;background:#02030a;color:var(--tinta);overflow-x:hidden}
  canvas#cosmos{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
  .veil{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,rgba(6,10,26,0) 30%,rgba(2,3,10,.55) 100%)}
  /* Topbar */
  .top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px 22px;background:linear-gradient(180deg,rgba(2,3,10,.85),rgba(2,3,10,0))}
  .marca{font-size:.82rem;letter-spacing:6px;color:var(--oro);font-weight:400}
  .top a{color:var(--tenue);text-decoration:none;font-size:.72rem;letter-spacing:2px;margin-left:16px;transition:.25s}
  .top a:hover{color:var(--oro)}
  /* Escenario */
  .scene{position:relative;z-index:10;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:90px 16px 60px}
  .titulo{text-align:center;margin-bottom:8px}
  .titulo h1{font-size:clamp(1.4rem,5vw,2.4rem);letter-spacing:10px;font-weight:400;color:#fff;text-shadow:0 0 24px rgba(232,200,106,.35)}
  .titulo p{color:var(--tenue);font-size:.8rem;letter-spacing:3px;margin-top:8px}
  /* Sistema orbital */
  .sistema{position:relative;width:min(92vw,720px);height:min(92vw,720px);margin:10px auto;display:flex;align-items:center;justify-content:center}
  .orbita{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border:1px solid rgba(232,200,106,.10);border-radius:50%}
  .o1{width:34%;height:34%}.o2{width:56%;height:56%}.o3{width:78%;height:78%}.o4{width:100%;height:100%}
  @keyframes girar{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
  .anillo{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%}
  .r1{width:34%;height:34%;animation:girar 46s linear infinite}
  .r2{width:56%;height:56%;animation:girar 74s linear infinite reverse}
  .r3{width:78%;height:78%;animation:girar 104s linear infinite}
  .r4{width:100%;height:100%;animation:girar 140s linear infinite reverse}
  /* Sol AXEL */
  .sol{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:118px;height:118px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-direction:column;
    background:radial-gradient(circle at 38% 34%,#fff7df,#f4d98a 34%,#d9ac47 66%,#8a6a1f);
    box-shadow:0 0 60px rgba(244,217,138,.55),0 0 130px rgba(232,200,106,.35),inset -8px -10px 26px rgba(120,86,16,.5);
    animation:latir 5s ease-in-out infinite;z-index:6}
  @keyframes latir{0%,100%{box-shadow:0 0 60px rgba(244,217,138,.55),0 0 130px rgba(232,200,106,.30)}50%{box-shadow:0 0 78px rgba(255,240,190,.75),0 0 170px rgba(232,200,106,.45)}}
  .sol b{font-size:1.05rem;letter-spacing:3px;color:#3a2a06;font-weight:700}
  .sol span{font-size:.52rem;letter-spacing:2px;color:#5a4310;margin-top:2px}
  /* Planeta */
  .planeta{position:absolute;width:64px;height:64px;border-radius:50%;cursor:pointer;transition:transform .25s;
    display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:#fff;
    box-shadow:0 0 22px rgba(120,160,255,.35),inset -6px -8px 16px rgba(0,0,0,.45);animation:contraGirar linear infinite}
  .r1 .planeta{animation-duration:46s}.r2 .planeta{animation-duration:74s}.r3 .planeta{animation-duration:104s}.r4 .planeta{animation-duration:140s}
  .r2 .planeta,.r4 .planeta{animation-direction:reverse}
  @keyframes contraGirar{from{transform:rotate(0)}to{transform:rotate(-360deg)}}
  .r2 .planeta,.r4 .planeta{animation-name:contraGirarR}
  @keyframes contraGirarR{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  .planeta:hover{transform:scale(1.16)}
  .planeta .halo{position:absolute;inset:-9px;border-radius:50%;border:1px solid rgba(232,200,106,.35);opacity:.0;transition:.3s}
  .planeta.activo .halo{opacity:1;animation:pulso 2.6s ease-in-out infinite}
  @keyframes pulso{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.14);opacity:1}}
  .planeta .lbl{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:.56rem;letter-spacing:1.5px;color:var(--tenue);white-space:nowrap}
  .estado{position:absolute;top:-3px;right:-3px;width:13px;height:13px;border-radius:50%;border:2px solid #02030a}
  .on{background:#3fd07a;box-shadow:0 0 10px #3fd07a}
  .learn{background:#e8c86a;box-shadow:0 0 10px #e8c86a}
  .off{background:#5a6480}
  /* posiciones sobre cada anillo */
  .r1 .p0{top:-32px;left:50%;margin-left:-32px}
  .r2 .p0{top:-32px;left:50%;margin-left:-32px}.r2 .p1{top:50%;left:-32px;margin-top:-32px}
  .r3 .p0{top:-32px;left:50%;margin-left:-32px}.r3 .p1{top:50%;right:-32px;margin-top:-32px}.r3 .p2{bottom:-32px;left:50%;margin-left:-32px}
  .r4 .p0{top:6%;left:6%}.r4 .p1{top:6%;right:6%}.r4 .p2{bottom:6%;left:6%}.r4 .p3{bottom:6%;right:6%}
  /* Panel lateral */
  .panel{position:fixed;top:0;right:-460px;width:min(92vw,420px);height:100%;z-index:40;background:var(--panel);backdrop-filter:blur(14px);border-left:1px solid var(--linea);
    padding:26px 22px;overflow-y:auto;transition:right .4s cubic-bezier(.2,.7,.2,1);box-shadow:-20px 0 60px rgba(0,0,0,.5)}
  .panel.open{right:0}
  .panel .cerrar{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--tenue);font-size:1.5rem;cursor:pointer}
  .panel .pico{font-size:2.4rem}
  .panel h2{color:var(--oro);font-size:1.5rem;letter-spacing:2px;margin:6px 0 2px}
  .panel .rol{color:var(--tenue);font-size:.78rem;letter-spacing:1px;text-transform:uppercase;margin-bottom:14px}
  .panel .desc{font-size:.98rem;line-height:1.6;color:var(--tinta);margin-bottom:16px}
  .campo{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:.86rem}
  .campo span:first-child{color:var(--tenue)}
  .barra{height:7px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin:6px 0 16px}
  .barra i{display:block;height:100%;background:linear-gradient(90deg,var(--oro2),var(--oro));border-radius:6px}
  .chip{display:inline-block;font-size:.7rem;letter-spacing:1px;padding:5px 10px;border:1px solid var(--linea);border-radius:20px;color:var(--oro);margin:0 6px 6px 0}
  .pbtn{display:block;width:100%;text-align:center;padding:12px;margin-top:16px;border:1px solid var(--oro);border-radius:4px;color:var(--oro);background:transparent;letter-spacing:2px;font-size:.78rem;cursor:pointer;text-decoration:none;transition:.25s}
  .pbtn:hover{background:var(--oro);color:#1a1204}
  .pbtn.solido{background:var(--oro);color:#1a1204}
  .nota{font-size:.72rem;color:var(--tenue);margin-top:12px;line-height:1.5}
  /* Chat AXEL — GRANDE */
  .chatwrap{position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:60;width:min(96vw,860px);height:min(86vh,760px);background:linear-gradient(180deg,rgba(10,13,28,.96),rgba(6,8,20,.98));backdrop-filter:blur(16px);border:1px solid var(--linea);border-radius:16px 16px 0 0;padding:0;display:none;flex-direction:column;box-shadow:0 -20px 80px rgba(0,0,0,.6)}
  .chatwrap.open{display:flex}
  .chathead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--linea);flex-shrink:0}
  .chathead .who{display:flex;align-items:center;gap:10px}
  .chathead .av{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#fff7df,#f4d98a 40%,#d9ac47 78%);display:flex;align-items:center;justify-content:center;font-weight:700;color:#3a2a06;font-size:.95rem}
  .chathead .nm{color:var(--oro);letter-spacing:2px;font-size:.95rem}
  .chathead .st{color:var(--tenue);font-size:.66rem;letter-spacing:1px}
  .chathead .x{background:none;border:none;color:var(--tenue);font-size:1.6rem;cursor:pointer;line-height:1}
  .chatlog{flex:1;overflow-y:auto;padding:18px;font-size:1.02rem;line-height:1.72}
  .msg{margin:14px 0;padding:14px 18px;border-radius:12px;max-width:88%;word-wrap:break-word}
  .msg.u{background:linear-gradient(180deg,rgba(232,200,106,.16),rgba(232,200,106,.08));border:1px solid rgba(232,200,106,.25);margin-left:auto}
  .msg.b{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07)}
  /* Markdown rico */
  .msg h2{font-size:1.28rem;color:var(--oro);letter-spacing:.5px;margin:12px 0 8px;font-weight:700}
  .msg h3{font-size:1.1rem;color:#f0d98a;margin:10px 0 6px;font-weight:700}
  .msg p{margin:8px 0}
  .msg strong{color:#fff2c8;font-weight:700}
  .msg em{color:#cfd8ff;font-style:italic}
  .msg ul,.msg ol{margin:8px 0 8px 22px}
  .msg li{margin:4px 0}
  .msg a{color:#7fb0ff;text-decoration:underline}
  .msg code.inline{background:rgba(127,176,255,.14);color:#9ecbff;padding:1px 7px;border-radius:5px;font-family:"SFMono-Regular",Consolas,monospace;font-size:.9em}
  .codewrap{margin:12px 0;border-radius:10px;overflow:hidden;border:1px solid rgba(127,176,255,.22);background:#0a0e1f}
  .codebar{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;background:rgba(127,176,255,.10);font-size:.68rem;letter-spacing:1px;color:#9ecbff;text-transform:uppercase}
  .codebar button{background:none;border:1px solid rgba(158,203,255,.35);color:#9ecbff;border-radius:4px;font-size:.62rem;padding:3px 9px;cursor:pointer;letter-spacing:1px}
  .codebar button:hover{background:rgba(158,203,255,.18)}
  .codewrap pre{margin:0;padding:14px 16px;overflow-x:auto;font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:.86rem;line-height:1.6}
  .codewrap pre code{color:#e6edff;white-space:pre}
  .tok-key{color:#c792ea}.tok-str{color:#c3e88d}.tok-num{color:#f78c6c}.tok-com{color:#5a6480;font-style:italic}.tok-fn{color:#82aaff}
  .chatia{display:flex;align-items:center;gap:8px;padding:8px 16px 0;flex-shrink:0}
  .chatia label{font-size:.72rem;letter-spacing:1px;text-transform:uppercase;color:var(--oro);opacity:.85}
  .chatia select{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--linea);border-radius:8px;padding:8px 10px;color:#fff;font-family:inherit;font-size:.86rem;cursor:pointer}
  .chatia select option{background:#0a0d1c;color:#fff}
  .chatin{display:flex;gap:10px;padding:14px 16px;border-top:1px solid var(--linea);flex-shrink:0}
  .chatin input{flex:1;background:rgba(255,255,255,.06);border:1px solid var(--linea);border-radius:8px;padding:13px 14px;color:#fff;font-family:inherit;font-size:1rem}
  .chatin button{background:var(--oro);border:none;border-radius:8px;padding:0 22px;color:#1a1204;cursor:pointer;font-weight:700;font-size:1.1rem}
  .pie{position:fixed;bottom:6px;left:0;right:0;text-align:center;z-index:12;color:var(--tenue);font-size:.62rem;letter-spacing:2px;pointer-events:none}
</style>
</head>
<body>
<canvas id="cosmos"></canvas>
<div class="veil"></div>

<div class="top">
  <div class="marca">ORIONIX · UNIVERSO</div>
  <div>
    <a href="index.html">&larr; Volver</a>
    <a onclick="abrirChat('director','AXEL','Director de la Mesa','A')" style="cursor:pointer">Hablar con AXEL</a>
  </div>
</div>

<div class="scene">
  <div class="titulo">
    <h1>LA MESA DE FORJADORES</h1>
    <p>Un universo vivo · cada planeta es un agente que aprende cada dia</p>
  </div>

  <div class="sistema" id="sistema">
    <div class="orbita o1"></div><div class="orbita o2"></div>
    <div class="orbita o3"></div><div class="orbita o4"></div>

    <!-- Sol: AXEL Director -->
    <div class="sol" onclick="abrirChat('director','AXEL','Director de la Mesa','A')">
      <b>AXEL</b><span>DIRECTOR</span>
    </div>

    <!-- Anillos con planetas (se llenan por JS) -->
    <div class="anillo r1" id="r1"></div>
    <div class="anillo r2" id="r2"></div>
    <div class="anillo r3" id="r3"></div>
    <div class="anillo r4" id="r4"></div>
  </div>
</div>

<!-- Panel de agente -->
<aside class="panel" id="panel">
  <button class="cerrar" onclick="cerrarPanel()">&times;</button>
  <div class="pico" id="pPico">🔍</div>
  <h2 id="pNom">Agente</h2>
  <div class="rol" id="pRol">Rol</div>
  <div class="desc" id="pDesc"></div>
  <div class="campo"><span>Estado</span><span id="pEstado"></span></div>
  <div class="campo"><span>Motor de IA</span><span id="pMotor"></span></div>
  <div class="campo"><span>Nivel de aprendizaje</span><span id="pNivelTxt"></span></div>
  <div class="barra"><i id="pNivel"></i></div>
  <div id="pHerr"></div>
  <a class="pbtn" id="pAccion" href="#">Interactuar</a>
  <div class="nota" id="pNota"></div>
</aside>

<!-- Chat con AXEL (cerebro real portal-central) -->
<div class="chatwrap" id="axelChat">
  <div class="chathead">
    <div class="who">
      <div class="av" id="axAv">A</div>
      <div><div class="nm" id="axNom">AXEL</div><div class="st" id="axRol">Director de la Mesa</div></div>
    </div>
    <button class="x" onclick="document.getElementById('axelChat').classList.remove('open')">&times;</button>
  </div>
  <div class="chatlog" id="axelLog"></div>
  <div class="chatia">
    <label for="axelModelo">Motor</label>
    <select id="axelModelo" title="Elige el motor de IA">
      <option value="groq">Groq · Llama 3.3 (rápido)</option>
      <option value="mistral">Mistral</option>
      <option value="openrouter">OpenRouter</option>
      <option value="claude">Claude (Anthropic)</option>
      <option value="gemini">Gemini (Google)</option>
      <option value="perplexity" disabled>Perplexity — próximamente</option>
    </select>
  </div>
  <div class="chatin">
    <input id="axelIn" placeholder="Da tu orden, Forjador..." onkeydown="if(event.key==='Enter')axelSend()">
    <button onclick="axelSend()">&#10148;</button>
  </div>
</div>

<div class="pie">ORIONIX · LA FUENTE DE LOS AGENTES · Acceso exclusivo</div>

<script>
/* ============ DEFINICION DEL UNIVERSO (arquitectura base) ============
   Aqui vive cada agente. Para "dar vida" a uno nuevo, se agrega su objeto.
   estado: "on" (activo) | "learn" (aprendiendo) | "off" (por despertar)      */
var AGENTES = [
  {id:"cazador", nom:"CAZADOR", rol:"Productos & Economia", pico:"🔍", color:"#4a86ff",
   anillo:1, pos:0, estado:"on", motor:"Gemini + Busqueda Web",
   nivel:62, herr:["Busqueda web","Ofertas","Cupones","Trading"],
   desc:"Rastrea Amazon, AliExpress y todo el mundo buscando las mejores promociones, eventos y cupones. Domina economia, trading, banca e historia del dinero.",
   accion:"Ponerlo a cazar", nota:"Activo en el Centro de Comando (n8n). Busqueda web real conectada."},

  {id:"sabio", nom:"SABIO", rol:"Conocimiento & Contexto", pico:"📚", color:"#8f6fff",
   anillo:2, pos:0, estado:"on", motor:"Gemini + Wikipedia",
   nivel:48, herr:["Historia","Filosofia","Definiciones","Contexto"],
   desc:"Guardian del conocimiento. Aporta historia, filosofia y contexto profundo a cualquier mision de la Mesa.",
   accion:"Consultar al Sabio", nota:"Activo en el Centro de Comando (n8n)."},

  {id:"escriba", nom:"ESCRIBA", rol:"Datos & CRM", pico:"✍️", color:"#3fd07a",
   anillo:2, pos:1, estado:"learn", motor:"Gemini + Google Sheets/Drive",
   nivel:20, herr:["Google Sheets","Drive","Docs","CRM"],
   desc:"Estructura listas y guarda los datos de clientes (nombre, correo, telefono) en Google Sheets y Drive, en un cofre seguro. Nunca contrasenas de terceros.",
   accion:"Despertar (proxima fase)", nota:"Requiere conectar tu cuenta de Google. Fase 2."},

  {id:"creador", nom:"CREADOR", rol:"Imagenes & Video", pico:"🎨", color:"#ff7ac6",
   anillo:3, pos:0, estado:"learn", motor:"Gemini Image + Veo 3.1",
   nivel:15, herr:["Imagenes IA","Video IA","Edicion","Arte"],
   desc:"Da forma visual al imperio: genera imagenes y videos de alto impacto para la marca, la tienda y las redes.",
   accion:"Despertar (proxima fase)", nota:"Se activa con la API de imagen/video. Fase 3."},

  {id:"heraldo", nom:"HERALDO", rol:"Comunicacion", pico:"📧", color:"#ffb454",
   anillo:3, pos:1, estado:"off", motor:"Gmail + Telegram",
   nivel:8, herr:["Gmail","Telegram","Alertas"],
   desc:"Mensajero del imperio. Envia correos y avisos a clientes y al Forjador cuando algo importante ocurre.",
   accion:"Despertar (proxima fase)", nota:"Requiere Gmail/Telegram. Fase 2."},

  {id:"vocero", nom:"VOCERO", rol:"Redes Sociales", pico:"🌐", color:"#54c8ff",
   anillo:3, pos:2, estado:"off", motor:"APIs oficiales de redes",
   nivel:5, herr:["Publicaciones","Programacion","Analitica"],
   desc:"La voz publica de Orionix. Publica y programa contenido en redes usando las APIs oficiales.",
   accion:"Despertar (proxima fase)", nota:"Solo por APIs oficiales. Fase 4."},

  {id:"explorador", nom:"EXPLORADOR", rol:"Investigacion Profunda", pico:"🕵️", color:"#a0f0d0",
   anillo:4, pos:0, estado:"off", motor:"Perplexity / Firecrawl",
   nivel:4, herr:["Informes","Analisis web","Sintesis"],
   desc:"Se sumerge en la web para traer informes largos y analisis profundos que ningun otro agente alcanza.",
   accion:"Despertar (proxima fase)", nota:"Cerebro adicional. Fase 4."},

  {id:"guardian", nom:"GUARDIAN", rol:"Seguridad & Memoria", pico:"🛡️", color:"#c0c8e0",
   anillo:4, pos:1, estado:"off", motor:"Supabase (cifrado)",
   nivel:2, herr:["Cifrado","Memoria evolutiva","Accesos"],
   desc:"Protege el cofre de datos y guarda la memoria evolutiva de todos los agentes: recuerdan y se fortalecen cada dia.",
   accion:"Despertar (proxima fase)", nota:"Base de datos segura. Fase 5."},
];

var CEREBRO = "https://kevinruiz.app.n8n.cloud/webhook/portal-central";

/* ---- Render de planetas en sus anillos ---- */
(function render(){
  var rings = {1:document.getElementById("r1"),2:document.getElementById("r2"),3:document.getElementById("r3"),4:document.getElementById("r4")};
  AGENTES.forEach(function(a){
    var el = document.createElement("div");
    el.className = "planeta p"+a.pos+(a.estado==="on"?" activo":"");
    el.style.background = "radial-gradient(circle at 36% 32%,#ffffff44,"+a.color+" 40%,#0b1030 92%)";
    el.innerHTML = '<span class="estado '+a.estado+'"></span><span>'+a.pico+'</span><span class="halo"></span><span class="lbl">'+a.nom+'</span>';
    el.onclick = function(ev){ ev.stopPropagation(); abrirPanel(a.id); };
    rings[a.anillo].appendChild(el);
  });
})();

/* ---- Panel de detalle ---- */
function abrirPanel(id){
  var a = AGENTES.find(function(x){return x.id===id;}); if(!a) return;
  document.getElementById("pPico").textContent = a.pico;
  document.getElementById("pNom").textContent = a.nom;
  document.getElementById("pRol").textContent = a.rol;
  document.getElementById("pDesc").textContent = a.desc;
  var etxt = a.estado==="on"?"🟢 Activo":(a.estado==="learn"?"🟡 Aprendiendo":"⚪ Por despertar");
  document.getElementById("pEstado").textContent = etxt;
  document.getElementById("pMotor").textContent = a.motor;
  document.getElementById("pNivelTxt").textContent = a.nivel+"%";
  document.getElementById("pNivel").style.width = a.nivel+"%";
  document.getElementById("pHerr").innerHTML = a.herr.map(function(h){return '<span class="chip">'+h+'</span>';}).join("");
  var btn = document.getElementById("pAccion");
  btn.textContent = "Hablar con "+a.nom;
  btn.className = "pbtn solido";
  btn.onclick = function(e){ e.preventDefault(); cerrarPanel(); abrirChat(a.id, a.nom, a.rol, a.pico); };
  document.getElementById("pNota").textContent = a.nota;
  document.getElementById("panel").classList.add("open");
}
function cerrarPanel(){ document.getElementById("panel").classList.remove("open"); }

/* ---- Renderizador Markdown (titulos, negritas, listas, codigo con colores) ---- */
function escHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function pintarCodigo(code,lang){
  var l=(lang||"").toLowerCase();
  var h=escHtml(code);
  // comentarios
  h=h.replace(/(^|\n)(\s*(?:#|\/\/).*)/g,function(m,a,b){return a+'<span class="tok-com">'+b+'</span>';});
  // strings
  h=h.replace(/(&quot;[^&]*?&quot;|&#39;[^&]*?&#39;|"[^"]*"|'[^']*'|`[^`]*`)/g,'<span class="tok-str">$1</span>');
  // numeros
  h=h.replace(/\b(\d+\.?\d*)\b/g,'<span class="tok-num">$1</span>');
  // palabras clave
  var kw=["def","return","if","else","elif","for","while","in","import","from","class","function","const","let","var","new","await","async","try","except","catch","finally","print","echo","true","false","null","None","True","False","public","private","void","int","string","this","export","default"];
  h=h.replace(new RegExp("\\b("+kw.join("|")+")\\b","g"),'<span class="tok-key">$1</span>');
  return h;
}
function renderMD(src){
  var out=[]; var lines=src.replace(/\r/g,"").split("\n"); var i=0; var listBuf=null,listType=null;
  function flushList(){ if(listBuf){ out.push("<"+listType+">"+listBuf.join("")+"</"+listType+">"); listBuf=null; listType=null; } }
  function inline(t){
    t=escHtml(t);
    t=t.replace(/`([^`]+)`/g,'<code class="inline">$1</code>');
    t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    t=t.replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>');
    t=t.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    t=t.replace(/(^|\s)(https?:\/\/[^\s<]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    return t;
  }
  while(i<lines.length){
    var ln=lines[i];
    var fence=ln.match(/^```\s*(\w+)?\s*$/);
    if(fence){ flushList(); var lang=fence[1]||"code"; var buf=[]; i++;
      while(i<lines.length && !/^```\s*$/.test(lines[i])){ buf.push(lines[i]); i++; } i++;
      var id="cb"+Math.random().toString(36).slice(2,8);
      out.push('<div class="codewrap"><div class="codebar"><span>'+escHtml(lang)+'</span><button onclick="copiarCodigo(\''+id+'\')">Copiar</button></div><pre><code id="'+id+'">'+pintarCodigo(buf.join("\n"),lang)+'</code></pre></div>');
      continue; }
    var h2=ln.match(/^##\s+(.*)/), h3=ln.match(/^###\s+(.*)/);
    if(h3){ flushList(); out.push("<h3>"+inline(h3[1])+"</h3>"); i++; continue; }
    if(h2){ flushList(); out.push("<h2>"+inline(h2[1])+"</h2>"); i++; continue; }
    var ol=ln.match(/^\s*\d+\.\s+(.*)/), ul=ln.match(/^\s*[-*]\s+(.*)/);
    if(ol){ if(listType!=="ol"){flushList();listType="ol";listBuf=[];} listBuf.push("<li>"+inline(ol[1])+"</li>"); i++; continue; }
    if(ul){ if(listType!=="ul"){flushList();listType="ul";listBuf=[];} listBuf.push("<li>"+inline(ul[1])+"</li>"); i++; continue; }
    if(ln.trim()===""){ flushList(); i++; continue; }
    flushList(); out.push("<p>"+inline(ln)+"</p>"); i++;
  }
  flushList();
  return out.join("");
}
function copiarCodigo(id){ var el=document.getElementById(id); if(!el)return; var t=el.textContent||""; navigator.clipboard&&navigator.clipboard.writeText(t); }

var CHAT_AGENTE="director", CHAT_NOMBRE="AXEL", CHAT_ROL="Director de la Mesa";
function axelAdd(role,txt){ var l=document.getElementById("axelLog"); var d=document.createElement("div"); d.className="msg "+(role==="u"?"u":"b"); if(role==="u"){d.textContent=txt;} else {d.innerHTML=renderMD(txt);} l.appendChild(d); l.scrollTop=l.scrollHeight; return d; }
function abrirChat(agenteId,nombre,rol,pico){
  CHAT_AGENTE=agenteId||"director"; CHAT_NOMBRE=nombre||"AXEL"; CHAT_ROL=rol||"Director de la Mesa";
  document.getElementById("axNom").textContent=CHAT_NOMBRE;
  document.getElementById("axRol").textContent=CHAT_ROL;
  document.getElementById("axAv").textContent=(pico||CHAT_NOMBRE.charAt(0));
  document.getElementById("axelLog").innerHTML="";
  var saludo = CHAT_AGENTE==="director"
    ? "Soy **AXEL**, el Director de la Mesa. Dame una orden y reparto la mision a los agentes."
    : "Convoca al "+CHAT_NOMBRE+". Escribeme y respondere con su voz y sus poderes.";

function motorElegido(){ var s=document.getElementById("axelModelo"); return s?s.value:"groq"; }
// Cadena de respaldo: si un motor esta agotado (cuota diaria), prueba el siguiente automaticamente.
function cadenaMotores(preferido){
  var todos=["groq","gemini","openrouter","mistral","claude"];
  var lista=[preferido];
  for(var i=0;i<todos.length;i++){ if(todos[i]!==preferido) lista.push(todos[i]); }
  return lista;
}
function pedirAMotor(t, motor){
  return fetch(CEREBRO,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({usuario:"forjador",sesion:"universo-"+CHAT_AGENTE,agente:CHAT_AGENTE,mensaje:t,ia:motor,motor:motor,proveedor:motor})})
    .then(function(r){ return r.json().catch(function(){return null;}); })
    .then(function(d){ var r=d&&(d.respuesta||d.output); return (r&&(""+r).trim())?(""+r):null; })
    .catch(function(){ return null; });
}
function enviarAlCerebro(t){
  var pensando=axelAdd("b","_"+CHAT_NOMBRE+" esta pensando..._");
  var preferido=motorElegido();
  try{ localStorage.setItem("orionix_motor", preferido); }catch(e){}
  var lista=cadenaMotores(preferido);
  var idx=0;
  function intentar(){
    if(idx>=lista.length){
      pensando.remove();
      axelAdd("b","Ahora mismo mis motores gratuitos estan descansando (se agoto la cuota diaria). Vuelve a intentarlo en unos minutos o elige otro motor arriba. Mientras tanto sigo aqui contigo. 🌙");
      return;
    }
    var motor=lista[idx++];
    if(idx>1){ pensando.innerHTML=renderMD("_probando otro motor ("+motor+")..._"); }
    pedirAMotor(t, motor).then(function(resp){
      if(resp){ pensando.remove(); axelAdd("b",resp); }
      else { intentar(); }
    });
  }
  intentar();
}
var FORJADOR="https://kevinruiz.app.n8n.cloud/webhook/forjar-pagina";
function forjarPagina(desc){
  var pensando=axelAdd("b","_El Arquitecto esta forjando tu pagina... (esto tarda unos segundos)_");
  fetch(FORJADOR,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({instruccion:desc,nombre_archivo:""})})
   .then(function(r){return r.json();})
   .then(function(d){
      pensando.remove();
      if(d&&d.url){ axelAdd("b","Pagina forjada y publicada.\n\n"+(d.respuesta||"")+"\n\n[Abrir la pagina]("+d.url+")\n\n_Dale 1-2 minutos y abrela con Ctrl+F5._"); }
      else { axelAdd("b","No pude forjar la pagina ahora mismo. Intentalo de nuevo en unos segundos."); }

var RECORDAR="https://kevinruiz.app.n8n.cloud/webhook/recordatorio-crear";
function crearRecordatorio(texto){
  // Extrae hora tipo "6:00", "18h30", "07.15" del texto
  var mh=texto.match(/(\d{1,2})[:h\.](\d{2})/);
  var hora=mh?(("0"+mh[1]).slice(-2)+":"+mh[2]):"";
  var esDiario=/cada dia|cada d\u00eda|diario|todos los dias|todos los d\u00edas/i.test(texto);
  var tipo=esDiario?"diario":"puntual";
  var mensaje=texto.replace(/(\d{1,2})[:h\.](\d{2})/,"").replace(/a las|cada dia|cada d\u00eda|todos los dias|todos los d\u00edas|diario|puntual/gi,"").replace(/\s+/g," ").trim();
  if(!hora){ axelAdd("b","Dime la hora. Ejemplo: `/recordar hacer ejercicio a las 6:00 cada dia`"); return; }
  var pensando=axelAdd("b","_El Heraldo esta guardando tu recordatorio..._");
  fetch(RECORDAR,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mensaje:mensaje||"Recordatorio",hora:hora,tipo:tipo,destino:""})})
   .then(function(r){return r.json();}).then(function(d){ pensando.remove(); axelAdd("b",(d&&d.respuesta)||"Recordatorio guardado."); })
   .catch(function(){ pensando.remove(); axelAdd("b","No pude guardar el recordatorio ahora mismo."); });
}
function axelSend(){
  var inp=document.getElementById("axelIn"); var t=(inp.value||"").trim(); if(!t) return; inp.value="";
  axelAdd("u",t);
  var low=t.toLowerCase();
  if(low.indexOf("/pagina")===0 || low.indexOf("/pag")===0){
    var desc=t.replace(/^\/pa?g[a-z]*/i,"").trim();
    if(!desc){ axelAdd("b","Escribe que pagina quieres. Ejemplo: /pagina una landing de ventas para un curso de meditacion"); return; }
    forjarPagina(desc); return;
  }
  if(low.indexOf("/recordar")===0 || low.indexOf("/recuerda")===0){
    var rec=t.replace(/^\/record?[a-z]*/i,"").trim();
    if(!rec){ axelAdd("b","Que quieres que te recuerde y a que hora. Ejemplo: /recordar hacer ejercicio a las 6:00 cada dia"); return; }
    crearRecordatorio(rec); return;
  }
  enviarAlCerebro(t);
}

(function stars(){
  var cv=document.getElementById("cosmos"), ctx=cv.getContext("2d"), W,H,DPR=Math.min(window.devicePixelRatio||1,2), ps=[];
  function size(){ W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0); make(); }
  function make(){ ps=[]; var n=Math.min(340,Math.floor(W*H/4200)); for(var i=0;i<n;i++){ps.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.2,a:Math.random(),s:Math.random()*.02+.004,d:Math.random()<.5?1:-1});} }
  function loop(){ ctx.clearRect(0,0,W,H);
    var g=ctx.createRadialGradient(W*.5,H*.42,0,W*.5,H*.42,Math.max(W,H)*.7); g.addColorStop(0,"rgba(30,26,60,.5)"); g.addColorStop(.5,"rgba(10,10,30,.35)"); g.addColorStop(1,"rgba(2,3,10,0)"); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    for(var i=0;i<ps.length;i++){var p=ps[i]; p.a+=p.s*p.d; if(p.a>1){p.a=1;p.d=-1;} if(p.a<.1){p.a=.1;p.d=1;} ctx.globalAlpha=p.a; ctx.fillStyle="#dfe7ff"; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill();} ctx.globalAlpha=1; requestAnimationFrame(loop); }
  size(); window.addEventListener("resize",size); loop();
})();
