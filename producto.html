<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Producto · Remember Luxury</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#030305;color:#fff;font-family:Montserrat,sans-serif}a{text-decoration:none;color:inherit}.wrap{max-width:1180px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2b2516;padding-bottom:18px}.logo{font-weight:700;letter-spacing:.2em}.back{font-size:10px;letter-spacing:.15em;color:#f5d77f}.product{display:grid;grid-template-columns:1.05fr .95fr;gap:60px;align-items:center;min-height:calc(100vh - 100px)}.media{aspect-ratio:1/1;border:1px solid rgba(245,215,127,.3);background:#0b0b0f;border-radius:16px;overflow:hidden;box-shadow:0 30px 100px #000}.media img{width:100%;height:100%;object-fit:cover}.kicker{font-size:10px;letter-spacing:.28em;color:#f5d77f;font-weight:700}.name{font:italic 300 clamp(42px,6vw,76px)/1 'Cormorant Garamond',serif;margin:16px 0}.desc{font:italic 20px/1.65 'Cormorant Garamond',serif;color:#c9c9cf}.price{font:600 32px 'Cormorant Garamond',serif;color:#fff1a8;margin:25px 0}.cta{display:inline-flex;align-items:center;justify-content:center;padding:15px 25px;border:1px solid #f5d77f;border-radius:999px;background:linear-gradient(135deg,#8d691b,#f5d77f,#b38a29);color:#050505;font-weight:800;letter-spacing:.13em;text-transform:uppercase;cursor:pointer;box-shadow:0 12px 35px rgba(245,215,127,.18);transition:.25s}.cta:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 18px 50px rgba(245,215,127,.3)}.note{margin-top:16px;font-size:11px;color:#777;line-height:1.6}.error{padding:80px 0;text-align:center}.error h1{font:italic 42px 'Cormorant Garamond',serif}@media(max-width:800px){.product{grid-template-columns:1fr;gap:30px;padding:40px 0}.media{max-height:65vh}.wrap{padding:18px}.name{font-size:50px}}</style></head><body><main class="wrap"><nav class="top"><div class="logo">REMEMBER <span style="color:#f5d77f">LUXURY</span></div><a class="back" href="index.html">← VOLVER A LA EXPERIENCIA</a></nav><section id="app"></section></main><script>const DATA='Gaia/Data/products/todos_1450.json';const p=new URLSearchParams(location.search);const key=(p.get('id')||p.get('q')||'').trim().toLowerCase();function esc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}async function run(){try{const r=await fetch(DATA);const items=await r.json();let x=items.find(a=>String(a.id||'').toLowerCase()===key);if(!x&&key)x=items.find(a=>String(a.nombre||a.title||'').toLowerCase()===key||String(a.nombre||a.title||'').toLowerCase().includes(key));if(!x){document.querySelector('#app').innerHTML='<div class="error"><h1>Producto no encontrado</h1><a class="cta" href="index.html#productos">EXPLORAR PRODUCTOS</a></div>';return}const name=x.nombre||x.title||'Producto';const img=x.imagen_url||x.image||'https://picsum.photos/seed/rememberluxury/900/900';const desc=x.descripcion||x.description||'Descubre esta pieza seleccionada por Remember Luxury.';const price=x.precio??x.price;document.title=name+' · Remember Luxury';document.querySelector('#app').innerHTML='<div class="product"><div class="media"><img src="'+esc(img)+'" alt="'+esc(name)+'"></div><div><div class="kicker">SELECCIÓN REMEMBER LUXURY · '+esc(x.categoria||x.category||'COLECCIÓN')+'</div><h1 class="name">'+esc(name)+'</h1><p class="desc">'+esc(desc)+'</p>'+(price!=null?'<div class="price">$'+Number(price).toFixed(2)+'</div>':'')+'<a class="cta" href="index.html#productos">VER MÁS PRODUCTOS</a><div class="note">Esta página está diseñada para descubrir el producto y continuar hacia el proveedor o canal de compra correspondiente cuando el enlace comercial esté verificado. No se procesa el pago aquí.</div></div></div>'}catch(e){document.querySelector('#app').innerHTML='<div class="error"><h1>No pudimos cargar el producto</h1><a class="cta" href="index.html">VOLVER</a></div>'}}run();</script></body></html>
