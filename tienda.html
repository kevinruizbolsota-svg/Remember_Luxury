<!DOCTYPE html>
<html lang="es">
<head>
<script src="/Remember_Luxury/ciudadela/orionix-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORIONIX · Catálogo</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0d;--gold:#e8c86a;--gd:#b89a40;--gl:#f5e0a0;--text:#f0e8d0;--dim:rgba(240,232,208,.45);--card:#111118;--b:rgba(232,200,106,.10)}
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:'Cormorant Garamond',serif;min-height:100vh}
nav{background:rgba(11,11,13,.96);border-bottom:1px solid var(--b);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:58px;position:sticky;top:0;z-index:100;backdrop-filter:blur(20px)}
.nav-brand{font-family:Cinzel,serif;font-size:.85rem;font-weight:900;letter-spacing:.18em;color:var(--gold);text-decoration:none}.nav-links{display:flex;gap:6px}.nav-links a{font-family:Cinzel,serif;font-size:.48rem;letter-spacing:.1em;color:var(--dim);text-decoration:none;padding:7px 12px}.nav-links a:hover{color:var(--gold)}
.nav-cart{display:flex;align-items:center;gap:8px;padding:7px 18px;border:1px solid var(--b);border-radius:10px;font-family:Cinzel,serif;font-size:.52rem;color:var(--gold);text-decoration:none}.hero{padding:60px 24px 40px;text-align:center}.hero-tag{font-family:Cinzel,serif;font-size:.44rem;letter-spacing:.28em;color:var(--dim);margin-bottom:12px}.hero h1{font-family:Cinzel,serif;font-size:clamp(1.6rem,4vw,2.8rem);font-weight:900;letter-spacing:.1em;color:var(--gold);margin-bottom:8px}.hero p{color:var(--dim);font-size:1rem}
.controls{max-width:1200px;margin:0 auto;padding:20px 24px;display:flex;gap:12px;flex-wrap:wrap}.search-box{flex:1;min-width:200px;background:var(--card);border:1px solid var(--b);border-radius:10px;padding:10px 16px;color:var(--text);font-family:inherit;font-size:1rem;outline:none}.filters{display:flex;gap:8px;flex-wrap:wrap}.filt{font-family:Cinzel,serif;font-size:.44rem;letter-spacing:.08em;padding:8px 16px;border:1px solid var(--b);border-radius:8px;color:var(--dim);background:transparent;cursor:pointer}.filt:hover,.filt.on{color:var(--gold);border-color:var(--gold);background:rgba(232,200,106,.06)}
.count-bar{max-width:1200px;margin:0 auto;padding:0 24px 16px;font-family:Cinzel,serif;font-size:.48rem;letter-spacing:.1em;color:var(--dim)}.grid{max-width:1200px;margin:0 auto;padding:0 24px 80px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}.card{background:var(--card);border:1px solid var(--b);border-radius:14px;overflow:hidden;transition:.3s;cursor:pointer}.card:hover{transform:translateY(-4px);border-color:rgba(232,200,106,.3);box-shadow:0 12px 40px rgba(232,200,106,.08)}.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.card-body{padding:14px}.card-cat{font-family:Cinzel,serif;font-size:.38rem;letter-spacing:.14em;color:var(--dim);margin-bottom:6px;text-transform:uppercase}.card-name{font-size:1rem;font-weight:600;margin-bottom:6px;line-height:1.3}.card-desc{font-size:.82rem;color:var(--dim);margin-bottom:12px;line-height:1.4}.card-footer{display:flex;align-items:center;justify-content:space-between}.card-price{font-family:Cinzel,serif;font-size:1rem;font-weight:600;color:var(--gold)}.btn-cart{font-family:Cinzel,serif;font-size:.42rem;letter-spacing:.08em;padding:7px 14px;background:linear-gradient(135deg,var(--gd),var(--gold));border:0;border-radius:8px;color:#000;cursor:pointer;font-weight:700}.loading,.empty{text-align:center;padding:80px 24px;color:var(--dim);grid-column:1/-1}.spinner{width:40px;height:40px;border:2px solid var(--b);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 20px}@keyframes spin{to{transform:rotate(360deg)}}.badge{display:inline-block;background:var(--gold);color:#000;border-radius:50%;width:18px;height:18px;font-size:.5rem;font-weight:700;text-align:center;line-height:18px}
@media(max-width:600px){.nav-links{display:none}.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}}
</style>
</head>
<body>
<nav><a class="nav-brand" href="/Remember_Luxury/ciudadela/hub.html">✦ ORIONIX</a><div class="nav-links"><a href="/Remember_Luxury/tienda.html">Tienda</a><a href="/Remember_Luxury/ciudadela/agentes.html">Agentes</a><a href="/Remember_Luxury/ciudadela/mi-universo.html">Universo</a></div><a class="nav-cart" href="/Remember_Luxury/ciudadela/carrito.html">🛒 Carrito <span class="badge" id="cart-badge">0</span></a></nav>
<div class="hero"><div class="hero-tag">✦ ORIONIX · CENTRO COMERCIAL</div><h1>Catálogo Imperial</h1><p id="hero-sub">Cargando colección…</p></div>
<div class="controls"><input class="search-box" id="q" type="text" placeholder="Buscar productos…"><div class="filters" id="filt-wrap"></div></div>
<div class="count-bar"><span id="count">—</span> productos</div><div class="grid" id="grid"></div>
<script>
var ALL=[],CAT='TODOS',API='https://lkevinruizl.app.n8n.cloud/webhook/orionix-tienda';
function getCart(){try{return JSON.parse(localStorage.getItem('orionix_cart')||'[]')}catch(e){return[]}}function saveCart(c){localStorage.setItem('orionix_cart',JSON.stringify(c))}function updateBadge(){var b=document.getElementById('cart-badge');if(b)b.textContent=getCart().length}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function addToCart(id,nombre,precio,imagen){var c=getCart(),ex=c.find(x=>x.id===id);if(ex)ex.qty=(ex.qty||1)+1;else c.push({id,nombre,precio,imagen,qty:1});saveCart(c);updateBadge()}
var LABEL={'TODOS':'Todos','MODA':'Moda','FASHION STYLE':'Fashion Style','MI DINASTIA':'Mi Dinastía','DIGITAL':'Digital','HOGAR':'Hogar','TECH':'Tech','BIENESTAR':'Bienestar','VIAJE':'Viaje','MASCOTAS':'Mascotas'};
function buildFilters(cats){document.getElementById('filt-wrap').innerHTML=['TODOS'].concat(cats).map(c=>'<button class="filt '+(c===CAT?'on':'')+'" data-cat="'+esc(c)+'">'+esc(LABEL[c]||c)+'</button>').join('')}
function render(){var q=(document.getElementById('q').value||'').toLowerCase(),filtered=ALL.filter(p=>(CAT==='TODOS'||(p.categoria||'')===CAT)&&(!q||String(p.nombre).toLowerCase().includes(q)||String(p.descripcion||'').toLowerCase().includes(q)));document.getElementById('count').textContent=filtered.length;var g=document.getElementById('grid');if(!filtered.length){g.innerHTML='<div class="empty">Sin resultados.</div>';return}g.innerHTML=filtered.map(p=>{var img=p.imagen_url||('https://picsum.photos/seed/'+p.id+'/400/400');return '<div class="card"><img src="'+esc(img)+'" alt="'+esc(p.nombre)+'" loading="lazy"><div class="card-body"><div class="card-cat">'+esc(p.categoria||'')+'</div><div class="card-name">'+esc(p.nombre)+'</div><div class="card-desc">'+esc(p.descripcion||'')+'</div><div class="card-footer"><span class="card-price">€'+Number(p.precio).toFixed(2)+'</span><button class="btn-cart" data-id="'+p.id+'">+ Carrito</button></div></div></div>'}).join('')}
document.addEventListener('input',e=>{if(e.target.id==='q')render()});document.addEventListener('click',e=>{var f=e.target.closest('[data-cat]');if(f){CAT=f.dataset.cat;render();buildFilters([...new Set(ALL.map(p=>p.categoria).filter(Boolean))].sort())}var b=e.target.closest('[data-id]');if(b){var p=ALL.find(x=>String(x.id)===b.dataset.id);if(p)addToCart(p.id,p.nombre,p.precio,p.imagen_url)}})
async function loadProducts(){var g=document.getElementById('grid');g.innerHTML='<div class="loading"><div class="spinner"></div>Cargando catálogo…</div>';try{var r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accion:'catalogo',limite:500})});var data=await r.json(),prods=data.productos||data.items||data;if(!Array.isArray(prods)||!prods.length)throw Error('sin datos');ALL=prods;document.getElementById('hero-sub').textContent=prods.length+' productos en colección';buildFilters([...new Set(prods.map(p=>p.categoria).filter(Boolean))].sort());render()}catch(e){g.innerHTML='<div class="empty">No se pudo cargar el catálogo.<br><button class="btn-cart" onclick="loadProducts()" style="margin-top:20px">REINTENTAR</button></div>'}}
updateBadge();loadProducts();
</script>
</body></html>
